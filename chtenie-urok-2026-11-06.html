var seq2=[],ti2=0,rev2=false;
function buildSeq2(){
  seq2=[];
  var ts=shuffle(TRIPLETS);
  for(var i=0;i<ts.length;i++){seq2=seq2.concat(ts[i]);}
}
function showWord2(){
  rev2=false;
  var c=seq2[ti2];
  el('wBig').textContent=c.w;
  el('wBig').className=c.t?'word target':'word';
  el('wBadge').textContent=c.t?'новое слово ⭐':'';
  el('wPic').textContent='';
  el('wNext').textContent='Показать картинку 🖼';
  el('wCnt').textContent=(ti2+1)+' / '+seq2.length;
}
el('wNext').onclick=function(){
  if(!rev2){
    rev2=true;
    var c=seq2[ti2];
    var b64=IMGS[c.w];
    if(b64){el('wPic').innerHTML='<img alt="">';el('wPic').firstChild.src=b64;}
    else if(c.e){el('wPic').innerHTML='<span>'+c.e+'</span>';}
    else{el('wPic').textContent='';}
    el('wNext').textContent='Дальше →';
  }else{
    ti2++;if(ti2>=seq2.length){ti2=0;buildSeq2();}
    showWord2();
  }
};
el('wBack').onclick=function(){if(ti2>0){ti2--;showWord2();}};

function newBatch5(){var sh=shuffle(WORDS9);b5=sh.slice(0,5);i5=0;load5();}
function load5(){
  placed5=[];
  var c=b5[i5];
  var ident5=c.map(function(_,k){return k;});
  order5=shuffle(ident5);
  var guard5=0;
  while(order5.join()===ident5.join()&&guard5<20){order5=shuffle(ident5);guard5++;}
  el('sCnt').textContent='Слово '+(i5+1)+' из 5';
  el('sMsg').textContent='';
  el('sPicBox').textContent='';
  el('sPic').disabled=true;
  var nb=el('sNext');
  nb.disabled=true;
  nb.textContent=(i5===4)?'Ещё? Новые 5 слов 🔄':'Следующее слово →';
  render5();
}
function render5(){
  var syl=b5[i5];
  var remaining=order5.filter(function(k){return placed5.indexOf(k)<0;});
  var tEl=el('sTiles');
  tEl.innerHTML='';
  for(var i=0;i<remaining.length;i++){
    (function(k){
      var d=document.createElement('div');
      d.className='tile';
      d.style.background=SLOT_COLORS[k];
      d.style.borderColor=SLOT_COLORS[k];
      d.style.color='#fff';
      d.style.textShadow='0 1px 2px rgba(0,0,0,.35)';
      d.textContent=syl[k];
      d.onclick=function(){if(placed5.length<syl.length){placed5.push(k);render5();}};
      tEl.appendChild(d);
    })(remaining[i]);
  }
  var slEl=el('sSlots');
  slEl.innerHTML='';
  for(var j=0;j<syl.length;j++){
    (function(pos){
      var d=document.createElement('div');
      d.style.borderColor=SLOT_COLORS[pos];
      if(pos<placed5.length){
        d.className='slot filled';
        d.style.background=SLOT_COLORS[pos];
        d.textContent=syl[placed5[pos]];
        d.onclick=function(){placed5.splice(pos,1);render5();};
      }else{
        d.className='slot';
        d.style.background=SLOT_COLORS[pos]+'55';
        d.style.borderStyle='solid';
      }
      slEl.appendChild(d);
    })(j);
  }
  if(placed5.length===syl.length){
    el('sMsg').textContent='✅ Собрали! Читай слово!';
    el('sNext').disabled=false;
  }
}
el('sNext').onclick=function(){i5++;if(i5>4){newBatch5();}else{load5();}};
el('sPic').onclick=function(){el('sPicBox').textContent='🌟';};

}
el('eNext').onclick=function(){ei++;if(ei>=SENT.length){ei=0;}showSent();};

document.addEventListener('keydown',function(e){
  var k=e.code||e.key;
  var isNext=(k==='ArrowRight'||k==='Right'||k==='Space'||k===' ');
