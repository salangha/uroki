    },
    {
      q: "Как называется ритмичный стишок, который является частью игры, один из малых жанров фольклора?",
      options: [
        { t: "поговорка", e: "меткое короткое выражение, для игр не используется" },
        { t: "небылица", e: "весёлая история о том, чего на свете не бывает" },
        { t: "считалка", e: "ритмичный стишок, по которому выбирают водящего в игре" }
      ],
      correct: 2
    }
  ];

  const total = questions.length;
  let current = 0;
  let score = 0;
  let answered = false;
  let resultShown = false;
  // results[i]: null — вопрос остался без ответа, true — верно с первой попытки, false — была ошибка
  let results = new Array(total).fill(null);
  let optionOrder = []; // порядок показа вариантов текущего вопроса (перемешан)
  function countScore() { return results.filter(r => r === true).length; }
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  function showQuestion() {
    answered = false;
    const q = questions[current];
    document.getElementById("qlabel").textContent = "Вопрос " + (current + 1) + " / " + total;
    document.getElementById("xpFill").style.width = (current / total * 100) + "%";
    document.getElementById("questText").textContent = q.q;
    const box = document.getElementById("options");
    box.innerHTML = "";
    // варианты каждый раз перемешиваются: правильный ответ не стоит на одном и том же месте
    optionOrder = shuffle(q.options.map((_, i) => i));
    optionOrder.forEach((orig, i) => {
      const opt = q.options[orig];
      const btn = document.createElement("button");
      btn.className = "option-btn";
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;
      const txt = document.createElement("span");
      txt.textContent = opt.t;
      btn.appendChild(num);
      btn.appendChild(txt);
      btn.addEventListener("click", () => answer(i));
      box.appendChild(btn);
    });
    document.getElementById("feedback").className = "feedback";
    document.getElementById("retryBtn").style.display = "none";
    document.getElementById("prevBtn").style.visibility = (current === 0) ? "hidden" : "visible";
    document.getElementById("nextBtn").textContent = (current === total - 1) ? "🏆 ИТОГИ" : "ДАЛЬШЕ ➡";
  }

  function answer(i) {
    if (answered || resultShown) return;
    answered = true;
    const q = questions[current];
    const btns = Array.from(document.querySelectorAll("#options .option-btn"));
    btns.forEach(b => b.classList.add("disabled"));
    const orig = optionOrder[i]; // какой по счёту вариант показан на месте i
    const ok = (orig === q.correct);
    btns[optionOrder.indexOf(q.correct)].classList.add("correct");
    const fb = document.getElementById("feedback");
    const retryBtn = document.getElementById("retryBtn");
    if (results[current] === null) results[current] = ok;
    const failedBefore = (results[current] === false);
    if (ok) {
      fb.className = "feedback show good";
      fb.innerHTML =
        '<div class="fb-title">✅ ВЕРНО!' + (failedBefore ? " Теперь запомнил! 🔧" : "") + '</div>' +
        '<div class="fb-body">💬 ' + q.options[q.correct].e + '.</div>';
      retryBtn.style.display = "none";
    } else {
      btns[i].classList.add("wrong");
      fb.className = "feedback show bad";
      fb.innerHTML =
        '<div class="fb-title">❌ ОШИБКА В КОДЕ!</div>' +
        '<div class="fb-body">' +
          '<div>🔴 <b>Ты выбрал:</b> «' + q.options[orig].t + '» — ' + q.options[orig].e + '.</div>' +
          '<div>🟢 <b>Правильный ответ:</b> «' + q.options[q.correct].t + '» — ' + q.options[q.correct].e + '.</div>' +
        '</div>';
      retryBtn.style.display = "";
    }
    document.getElementById("gems").textContent = "💎 " + countScore();
    document.getElementById("xpFill").style.width = ((current + 1) / total * 100) + "%";
    document.getElementById("controls").scrollIntoView({ block: "nearest" });
  }

  function retry() {
    if (!answered || resultShown) return;
    answered = false;
    document.querySelectorAll("#options .option-btn").forEach(b => b.classList.remove("correct", "wrong", "disabled"));
    document.getElementById("feedback").className = "feedback";
    document.getElementById("xpFill").style.width = (current / total * 100) + "%";
    window.scrollTo(0, 0);
  }

  function prev() {
    if (resultShown || current === 0) return;
    current--;
    showQuestion();
  }

  // «Дальше» работает и без ответа: вопрос просто остаётся пропущенным
  function next() {
    if (resultShown) return;
    if (current < total - 1) {
      current++;
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    resultShown = true;
    document.getElementById("quizArea").style.display = "none";
    document.getElementById("xpFill").style.width = "100%";
    score = countScore();
    const pct = Math.round(score / total * 100);
    let rank;
    if (pct >= 90) {
      rank = "🏆 АЛМАЗНЫЙ УРОВЕНЬ! Ты — настоящий знаток фольклора!";
    } else if (pct >= 75) {
      rank = "⚔️ ЖЕЛЕЗНЫЙ УРОВЕНЬ! Отличный результат!";
    } else if (pct >= 50) {
      rank = "🪨 КАМЕННЫЙ УРОВЕНЬ! Неплохо, но жанры фольклора стоит повторить!";
    } else {
      rank = "🪵 ДЕРЕВЯННЫЙ УРОВЕНЬ. Ничего страшного — повторим и пройдём снова!";
    }
    const result = document.getElementById("result");
    result.innerHTML =
      '<div class="big">🏆 КВЕСТ ЗАВЕРШЁН!</div>' +
      '<div>Правильно с первой попытки: <span class="score">' + score + ' из ' + total + '</span> (' + pct + '%)</div>' +
      '<div class="rank">' + rank + '</div>' +
      (results.some(r => r === false)
        ? '<div class="wrong-list">🔧 Вопросы с ошибками: ' + results.map((r, i) => r === false ? i + 1 : 0).filter(n => n).join(", ") + ' — их стоит разобрать ещё раз.</div>'
        : '<div class="wrong-list" style="color:#7EFC20">🐞 Багов не найдено — ни одной ошибки!</div>') +
      (results.some(r => r === null)
        ? '<div class="wrong-list">⏭ Без ответа оставлены вопросы: ' + results.map((r, i) => r === null ? i + 1 : 0).filter(n => n).join(", ") + '.</div>'
        : '') +
      '<button class="action retry" onclick="restart()">🔄 ПРОЙТИ ЗАНОВО</button>';
    result.classList.add("show");
  }

  function restart() {
    current = 0;
    score = 0;
    results = new Array(total).fill(null);
    resultShown = false;
    document.getElementById("gems").textContent = "💎 0";
    document.getElementById("result").className = "result";
    document.getElementById("quizArea").style.display = "";
    showQuestion();
  }

  // Управление с клавиатуры (работает на любой раскладке)
  document.addEventListener("keydown", e => {
    if (resultShown) {
      if (e.code === "Enter") restart();
      return;
    }
    if (!answered && (e.code === "Digit1" || e.code === "Numpad1")) answer(0);
    else if (!answered && (e.code === "Digit2" || e.code === "Numpad2")) answer(1);
    else if (!answered && (e.code === "Digit3" || e.code === "Numpad3")) answer(2);
    else if (answered && e.code === "KeyR") retry();
    else if (answered && (e.code === "Enter" || e.code === "ArrowRight" || e.code === "KeyN")) next();
    else if (e.code === "ArrowLeft" || e.code === "KeyP") prev();
  });

  showQuestion();
</script>
