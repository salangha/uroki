<body>

<h1>📚 КНИЖНЫЕ МИРЫ</h1>
<div class="subtitle">приключение по списку чтения «Школа России» • 1–4 класс • путь к ВПР</div>

<div class="hud">
  <div class="qlabel" id="qlabel">КАРТА</div>
  <div class="lvl-label" id="lvlLabel">⭐ Ур. 1</div>
  <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
  <div class="gems" id="gems">💎 0</div>
  <div class="feathers" id="feathers">🖋 0</div>
</div>

<div id="app"></div>

<script>
  // ============================================================
  // КНИЖНЫЕ МИРЫ — этап 1: каркас + мир 1 «Фольклорный лес»
  // Экономика и структура — по плану проекта (Nonograms Katana).
  // ============================================================

  // ---------- СОХРАНЕНИЕ ПРОГРЕССА ----------
  const SAVE_KEY = "knizhnye_miry_save_v1";
  function defaultS() {
    return { v: 1, coins: 0, xp: 0, feathers: 0,
             done: {}, cards: {}, bossProgress: {}, water: "" };
  }
  function loadS() {
    try {
      const r = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (r && r.v === 1) return r;
    } catch (e) {}
    return defaultS();
  }
  let S = loadS();
  function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  // ---------- УРОВЕНЬ ЧИТАТЕЛЯ ----------
  // Чтобы достичь уровня n, нужно накопить 25*n*(n-1) опыта всего.
  function lvlNeed(n) { return 25 * n * (n - 1); }
  function curLvl() { let n = 1; while (S.xp >= lvlNeed(n + 1)) n++; return n; }
  function addCoins(n) { S.coins += n; }
  function addXp(n) {
    const before = curLvl();
    S.xp += n;
    const after = curLvl();
    return after > before ? after : 0; // новый уровень или 0
  }
  function addFeathers(n) { S.feathers += n; }
  function markDone(id) { S.done[id] = 1; save(); }

  // ---------- УТИЛИТЫ ----------
  function $(id) { return document.getElementById(id); }
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }
  function esc(s) { return String(s); }
  function setHud(label, pct) {
    $("qlabel").textContent = label;
    $("xpFill").style.width = pct + "%";
    $("lvlLabel").textContent = "⭐ Ур. " + curLvl();
    $("gems").textContent = "💎 " + S.coins;
    $("feathers").textContent = "🖋 " + S.feathers;
  }
  function hudPct() {
    const n = curLvl();
    const lo = lvlNeed(n), hi = lvlNeed(n + 1);
    if (hi <= lo) return 100;
    return Math.max(0, Math.min(100, (S.xp - lo) / (hi - lo) * 100));
  }
  function refreshHud(label) {
    if (label) $("qlabel").textContent = label;
    $("xpFill").style.width = hudPct() + "%";
    $("lvlLabel").textContent = "⭐ Ур. " + curLvl();
    $("gems").textContent = "💎 " + S.coins;
    $("feathers").textContent = "🖋 " + S.feathers;
  }

  // ============================================================
  // ДАННЫЕ: ДВЕРИ-ЗАМКИ (малые формы фольклора)
  // ============================================================
  const DOORS = {
    d_zagadki: {
      icon: "🚪", title: "Избушка загадок",
      keeperIcon: "🐦‍⬛", keeper: "Ворон Замкаслов",
      intro: "У края леса сидит ворон и клюёт клювом замок. «Не пропущу, пока не разгадаешь все четыре загадки. Ошибёшься — вопрос вернётся, я не тороплюсь!»",
      coins: 20, xp: 10,
      q: [
        { type: "choice", q: "Не лает, не кусает, а в дом не пускает.", options: [
          { t: "Замок", ok: true, e: "висит на двери и чужих не пускает" },
          { t: "Собака", ok: false, e: "собака как раз лает и кусает — а в загадке наоборот" },
          { t: "Сторож", ok: false, e: "сторож живой человек, а загадка — про железное" }
        ] },
        { type: "choice", q: "Сидит дед, во сто шуб одет. Кто его раздевает — тот слёзы проливает.", options: [
          { t: "Лук", ok: true, e: "у лука сто чешуек-«шуб», и от него все плачут" },
          { t: "Дед Мороз", ok: false, e: "шуба есть, а слёз от него не бывает" },
          { t: "Капуста", ok: false, e: "кочан слоями, но слёз от капусты нет" }
        ] },
        { type: "choice", q: "Зимой и летом одним цветом.", options: [
          { t: "Ель", ok: true, e: "хвоя у ели зелёная и зимой и летом" },
          { t: "Берёза", ok: false, e: "летом зелёная, а на зиму листья сбрасывает" },
          { t: "Ромашка", ok: false, e: "цветёт только летом — зимой её нет" }
        ] },
        { type: "choice", q: "Без окон, без дверей — полна горница людей.", options: [
          { t: "Огурец", ok: true, e: "внутри огурца «комната» с семечками-«людьми»" },

    d_poslovicy: {

      coins: 20, xp: 12,
      q: [
        { type: "choice", q: "Терпение и труд…", options: [
          { t: "…всё перетрут", ok: true, e: "терпеливый и трудолюбивый справится с любым делом" },
          { t: "…дороже денег", ok: false, e: "так говорят про дружбу: «дружба дороже денег»" },
          { t: "…насильно мил не будешь", ok: false, e: "это совсем другая пословица — про чувства" }
        ] },
        { type: "choice", q: "Не имей сто рублей…", options: [
          { t: "…а имей сто друзей", ok: true, e: "друзья ценнее денег — они выручат" },
          { t: "…а имей сто книг", ok: false, e: "книги — хорошо, но пословица про друзей" },
          { t: "…а имей сто советов", ok: false, e: "такой половинки нет" }
        ] },
        { type: "choice", q: "Семь раз отмерь…", options: [
          { t: "…один раз отрежь", ok: true, e: "сначала подумай, потом делай" },
          { t: "…один раз съешь", ok: false, e: "вкусно придумано, но пословица про дела" },
          { t: "…семь раз отрежь", ok: false, e: "резать семь раз — это как раз бездумно" }

        { type: "choice", q: "Делу время…", options: [
          { t: "…потехе час", ok: true, e: "сначала дело, а играть можно и потом — часик найдётся" },

        { type: "choice", q: "Без труда…", options: [
          { t: "…не вытащишь и рыбку из пруда", ok: true, e: "даже рыбка сама в руки не даётся — надо трудиться" },

        { type: "choice", q: "Ученье — свет…", options: [
          { t: "…а неученье — тьма", ok: true, e: "кто учится — идёт на свет, кто не учится — в темноте" },
          { t: "…а лень — отдыха", ok: false, e: "звучит заманчиво, но пословица не такова" },
          { t: "…а книга — окно", ok: false, e: "про книгу есть другая поговорка, а тут — про ученье" }
        ] }
      ]
    },
    d_skoro: {
      icon: "🗣", title: "Скороговорочный холм",

      intro: "Сорока тараторит скороговорки, да нарочно путает. «Поймай в каждой скороговорке слово, которое я спрятала!»",

        { type: "choice", q: "Карл у Клары украл…", options: [

      ]
    },
    d_zhanry: {
      icon: "🎭", title: "Поляна жанров",
      keeperIcon: "🐻", keeper: "Медведь Баюн",
      intro: "Медведь Баюн устроил смотр малых жанров фольклора. «Определи жанр каждой строчки — на ВПР без этого никак!»",
      coins: 25, xp: 14,
      q: [
        { type: "choice", q: "«Бай-бай-бай, спи, дружок, засыпай…» — это…", options: [
          { t: "колыбельная песенка", ok: true, e: "поётся малышу, чтобы он заснул" },

  let CUR = { mode: "map", world: 1 };

  function showMap() {
    const lvl = curLvl();
    const watered = S.water === todayKey();
    let html = '<div class="scene-head">🗺 КАРТА КНИЖНЫХ МИРОВ</div>';
    html += '<div class="water-panel">' +
      (watered
        ? "💧 Выученное уже полито сегодня. Повторение даёт монеты каждый день — приходи завтра!"
        : "💧 <b>Полить выученное</b>: один вопрос из пройденного. Верно — +5 💎 +3 ⭐") +
      '<div class="controls">' +
      (watered ? "" : '<button class="primary-btn" style="background:#4FC3F7;border-color:#1b7fb5" onclick="startWatering()">💧 ПОЛИТЬ ВЫУЧЕННОЕ</button>') +
      "</div></div>";
    html += '<div class="info-line">🃏 Карточек собрано: ' + Object.keys(S.cards).length + " из " + TALES.length + "</div>";
    for (let i = 1; i < WORLDS.length; i++) {
      const w = WORLDS[i];
      let st, why, cls;
      if (S.done["wb_" + i]) { st = "✅"; why = w.name + ": босс повержен!"; cls = "green"; }
      else if (i === 1 || S.done["wb_" + (i - 1)]) {
        if (lvl >= w.req) { st = "▶"; why = i === 1 ? "малые формы фольклора + народные сказки" : w.desc; cls = ""; }
        else { st = "🔒"; why = "нужен уровень читателя " + w.req; cls = "locked"; }
      } else { st = "🔒"; why = "сначала победи босса предыдущего мира"; cls = "locked"; }
      html += '<button class="menu-btn ' + cls + '" ' + (cls === "locked" ? "" : 'onclick="openWorld(' + i + ')"') + ">" +
        '<span class="nm">' + w.icon + " МИР " + i + ": " + w.name.toUpperCase() + '</span><span class="st">' + st + "</span>" +
        '<span class="why">' + why + "</span></button>";
    }
    const allBosses = [2, 3, 4, 5, 6, 7, 8].every(i => S.done["wb_" + i]);
    html += '<button class="menu-btn locked"><span class="nm">🚪 ВРАТА ВПР — ПЕРЕХОД В 5 КЛАСС</span><span class="st">' +

    html += '<div class="small-note">Прогресс сохраняется автоматически • <button class="reset-btn" id="resetBtn" onclick="askReset()">сбросить прогресс</button></div>';
    $("app").innerHTML = html;
    refreshHud("КАРТА МИРОВ");
  }

  function askReset() {
    const b = $("resetBtn");
    if (!b) return;
    if (b.dataset.confirm === "1") {
      localStorage.removeItem(SAVE_KEY);
      S = defaultS();
      save();
      showMap();
    } else {
      b.dataset.confirm = "1";
      b.textContent = "точно сбросить? нажми ещё раз";
      setTimeout(() => {
        const bb = $("resetBtn");
        if (bb) { bb.dataset.confirm = ""; bb.textContent = "сбросить прогресс"; }
      }, 4000);
    }
  }

  function openWorld(n) { CUR.world = n; showWorld(); }

  function showWorld() {
    const n = CUR.world;
    const w = WORLDS[n];
    const order = WORLD1_ORDER;
    const doneCount = order.filter(id => S.done[id]).length;
    const step = Math.max(1, Math.ceil(doneCount / order.length * 5));
    let html = '<div class="scene-head">' + w.icon + " " + w.name.toUpperCase() + "</div>";
    html += '<div class="info-line">🪜 Ступень мира: ' + step + "/5 • 🃏 карточек: " +
      Object.keys(S.cards).length + "/" + TALES.length + " • пройдено узлов: " + doneCount + "/" + order.length + "</div>";
    order.forEach((id, i) => {
      const isDoor = !!DOORS[id];
      const src = isDoor ? DOORS[id] : TALES.find(t => t.id === id);
      const title = isDoor ? src.title : "Сказка: " + src.title;
      let st, why, cls;
      if (S.done[id]) { st = "✅"; why = isDoor ? "дверь открыта" : "сказка пройдена, мини-босс повержен"; cls = "green"; }
      else if (i === 0 || S.done[order[i - 1]]) { st = "▶"; why = isDoor ? "дверь-замок: " + src.keeper : "текст, задания и мини-босс «" + src.boss.name + "»"; cls = ""; }
      else { st = "🔒"; why = "сначала пройди предыдущий узел"; cls = "locked"; }
      html += '<button class="menu-btn ' + cls + '" ' + (cls === "locked" ? "" : 'onclick="openNode(\'' + id + '\')"') + ">" +
        '<span class="nm">' + src.icon + " " + title.toUpperCase() + '</span><span class="st">' + st + "</span>" +
        '<span class="why">' + why + "</span></button>";
    });
    const bossProg = S.bossProgress["wb_" + n];
    let bSt, bWhy, bCls;
    if (S.done["wb_" + n]) { bSt = "✅"; bWhy = "босс повержен — мир пройден!"; bCls = "green"; }
    else if (doneCount === order.length) { bSt = "▶"; bWhy = "экзамен мира: 10 ❤️" + (bossProg ? " • бой в разгаре, осталось ❤️: " + bossProg.hp : ""); bCls = ""; }
    else { bSt = "🔒"; bWhy = "откроется, когда все узлы мира будут пройдены"; bCls = "locked"; }
    html += '<button class="menu-btn ' + bCls + '" ' + (bCls === "locked" ? "" : 'onclick="startWorldBoss()"') + ">" +
      '<span class="nm">⚔️ БОСС МИРА: ' + w.boss.name.toUpperCase() + '</span><span class="st">' + bSt + "</span>" +
      '<span class="why">' + bWhy + "</span></button>";
    html += '<div class="controls"><button class="back-btn" onclick="showMap()">← НА КАРТУ</button></div>';
    $("app").innerHTML = html;
    refreshHud("МИР " + n + ": " + w.name.toUpperCase());
  }

  function openNode(id) {
    if (DOORS[id]) startDoor(id);
    else startTale(id);
  }

  // ============================================================
  // ДВЕРИ-ЗАМКИ (малые формы фольклора)
  // ============================================================
  function startDoor(id) {
    const d = DOORS[id];
    CUR = { mode: "door", world: CUR.world, id: id, queue: shuffle(d.q.map((_, i) => i)), doneCount: 0, answered: false };
    $("app").innerHTML =
      '<div class="scene-head">' + d.icon + " " + d.title.toUpperCase() + "</div>" +
      '<div class="story-panel"><div class="story-text">' + d.keeperIcon + " <b>" + d.keeper + ":</b> " + d.intro + "</div>" +
      '<div class="btn-row"><button class="primary-btn" onclick="renderDoorQ()">▶ ОТКРЫВАТЬ ЗАМКИ</button>' +
      '<button class="back-btn" onclick="showWorld()">← К СПИСКУ</button></div></div>';
    refreshHud(d.icon + " " + d.title.toUpperCase());
  }

  function renderDoorQ() {
    const d = DOORS[CUR.id];
    const q = d.q[CUR.queue[0]];
    let html = '<div class="scene-head">🔒 ' + d.title.toUpperCase() + " — ЗАМОК " + (CUR.doneCount + 1) + " ИЗ " + d.q.length + "</div>" +
      '<div class="task-panel"><div class="task-title">🗝 ЗАМОК ДВЕРИ</div><div class="task-q">' + q.q + "</div>";
    if (q.type === "word") {
      html += '<div id="wordArea">';
      shuffle(q.words).forEach(wd => { html += '<span class="word-block" onclick="pickDoorWord(this)">' + wd + "</span>"; });
      html += "</div>";
    } else {
      CUR.opts = shuffle(q.options);
      html += '<div class="options" id="opts">';
      CUR.opts.forEach((o, i) => {
        html += '<button class="opt-btn" onclick="pickDoorOpt(' + i + ')"><span class="num">' + (i + 1) + "</span><span>" + o.t + "</span></button>";
      });
      html += "</div>";
    }
    html += '<div id="feedback" class="feedback"></div><div id="controls" class="controls"></div></div>';
    $("app").innerHTML = html;
    CUR.answered = false;
    window.scrollTo(0, document.body.scrollHeight);
  }

  function doorAnswered(ok, optText, optE, correct) {
    const fb = $("feedback");
    fb.className = "feedback show " + (ok ? "good" : "bad");
    if (ok) {
      addCoins(3);
      CUR.doneCount++;
      CUR.queue.shift();
      const lvlUp = addXp(2);
      fb.innerHTML = '<div class="fb-title">🗝 ЩЁЛК! Замок поддался! +3 💎</div><div>💬 ' + correct.e + ".</div>" + (lvlUp ? '<div class="fb-title">⭐ УРОВЕНЬ ЧИТАТЕЛЯ: ' + lvlUp + "!</div>" : "");
      $("controls").innerHTML = CUR.queue.length
        ? '<button class="primary-btn" onclick="renderDoorQ()">СЛЕДУЮЩИЙ ЗАМОК ▶</button>'
        : '<button class="primary-btn" onclick="doorOpen()">ДВЕРЬ ОТКРЫТА! 🚪</button>';
    } else {
      CUR.queue.push(CUR.queue.shift());
      fb.innerHTML = '<div class="fb-title">🔒 Замок не поддался… +2 к упрямству замка</div>' +
        '<div>🔴 <b>Ты выбрал:</b> «' + optText + "» — " + optE + ".</div>" +
        '<div>🟢 <b>Правильный ответ:</b> «' + correct.t + "» — " + correct.e + ".</div>" +
        "<div>↩️ Вопрос вернётся ещё раз — дверь никуда не денется!</div>";
      $("controls").innerHTML = '<button class="primary-btn" onclick="renderDoorQ()">ПОПРОБОВАТЬ ДАЛЬШЕ ▶</button>';
    }
    save(); refreshHud(null);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function pickDoorOpt(i) {
    if (CUR.answered) return;
    CUR.answered = true;
    const opts = CUR.opts;
    const opt = opts[i];
    const btns = Array.from(document.querySelectorAll("#opts .opt-btn"));
    btns.forEach(b => b.classList.add("disabled"));
    btns.forEach((b, j) => { if (opts[j].ok) b.classList.add("correct"); });
    if (!opt.ok) btns[i].classList.add("wrong");
    doorAnswered(!!opt.ok, opt.t, opt.e, opts.find(o => o.ok));
  }

  function pickDoorWord(span) {
    if (CUR.answered) return;
    const q = DOORS[CUR.id].q[CUR.queue[0]];
    if (span.textContent === q.target) {
      CUR.answered = true;
      span.classList.add("found");
      doorAnswered(true, "", "", { t: q.target, e: "«" + q.target + "» — верное слово!" });
    } else {
      span.classList.add("miss");
      setTimeout(() => span.classList.remove("miss"), 500);
    }
  }

  function doorOpen() {
    const d = DOORS[CUR.id];
    const lvlUp = addXp(d.xp);
    addCoins(d.coins);
    markDone(CUR.id);
    $("app").innerHTML =
      '<div class="scene-head">🚪 ДВЕРЬ ОТКРЫТА!</div>' +
      '<div class="collect-panel"><div class="c-title">🗝 ' + d.title.toUpperCase() + " — пройдено!</div>" +
      '<div class="collect-item">+' + d.coins + " 💎 • +" + d.xp + " ⭐</div>" +
      (lvlUp ? '<div class="collect-item">⭐ УРОВЕНЬ ЧИТАТЕЛЯ: ' + lvlUp + "!</div>" : "") +
      '<div class="controls"><button class="primary-btn" onclick="showWorld()">К СПИСКУ УЗЛОВ ▶</button> ' +
      '<button class="back-btn" onclick="showMap()">НА КАРТУ</button></div></div>';
    refreshHud("🚪 ДВЕРЬ ОТКРЫТА");
    window.scrollTo(0, document.body.scrollHeight);
  }

  // ============================================================
  // СКАЗКИ: ТЕКСТ → ЗАДАНИЯ → МИНИ-БОСС
  // ============================================================
  function startTale(id) {
    const t = TALES.find(x => x.id === id);
    CUR = { mode: "tale", world: CUR.world, id: id, step: 0, answered: false };
    let html = '<div class="scene-head">📖 ' + t.title.toUpperCase() + "</div>";
    html += '<div class="story-panel old"><div class="story-text">📌 Читай внимательно: по этому тексту будут и задания, и бой с мини-боссом <b>' + t.boss.icon + " " + t.boss.name + "</b> (" + t.boss.hp + " ❤️).</div></div>";
    t.text.forEach(p => {
      html += '<div class="story-panel"><div class="story-text">' + (p.verse ? '<span class="verse">' + p.t + "</span>" : p.t) + "</div></div>";
    });
    html += '<div class="controls"><button class="primary-btn" onclick="taleToTasks()">▶ Я ПРОЧИТАЛ — К ЗАДАНИЯМ</button> ' +
      '<button class="back-btn" onclick="showWorld()">← К СПИСКУ</button></div>';
    $("app").innerHTML = html;
    refreshHud("📖 " + t.title.toUpperCase());
    window.scrollTo(0, 0);
  }

  function taleToTasks() { CUR.step = 0; renderTaleStep(); }

  function renderTaleStep() {
    const t = TALES.find(x => x.id === CUR.id);
    if (CUR.step >= t.tasks.length) { startMiniBoss(); return; }
    const task = t.tasks[CUR.step];
    const isBet = task.type === "bet";
    const title = isBet ? "🎲 СТАВКА: УГАДАЙ, ЧТО БУДЕТ" : "🎯 ЗАДАНИЕ " + (CUR.step + 1) + " ИЗ " + t.tasks.length;
    let html = '<div class="task-panel"><div class="task-title">' + title + "</div>" +
      '<div class="task-q">' + task.q + "</div>";
    if (task.type === "word") {
      html += '<div id="wordArea">';
      shuffle(task.words).forEach(wd => { html += '<span class="word-block" onclick="pickTaleWord(this)">' + wd + "</span>"; });
      html += "</div>";
    } else {
      CUR.opts = shuffle(task.options);
      html += '<div class="options" id="opts">';
      CUR.opts.forEach((o, i) => {
        html += '<button class="opt-btn" onclick="pickTaleOpt(' + i + ')"><span class="num">' + (i + 1) + "</span><span>" + o.t + "</span></button>";
      });
      html += "</div>";
    }
    html += '<div id="feedback" class="feedback"></div><div id="controls" class="controls"></div></div>';
    $("app").innerHTML = html;
    CUR.answered = false;
    window.scrollTo(0, document.body.scrollHeight);
  }

  function taleAnswered(ok, optText, optE, correct, isBet) {
    const fb = $("feedback");
    fb.className = "feedback show " + (ok ? "good" : "bad");
    if (ok) {
      addCoins(5);
      const lvlUp = addXp(2);
      fb.innerHTML = (isBet ? '<div class="fb-title">🎲 СТАВКА СЫГРАЛА! +5 💎</div>' : '<div class="fb-title">✅ ВЕРНО! +5 💎</div>') +
        "<div>💬 " + correct.e + ".</div>" + (lvlUp ? '<div class="fb-title">⭐ УРОВЕНЬ ЧИТАТЕЛЯ: ' + lvlUp + "!</div>" : "");
    } else {
      fb.innerHTML = '<div class="fb-title">' + (isBet ? "🎲 Ставка проиграна…" : "❌ НЕВЕРНО") + "</div>" +
        '<div>🔴 <b>Ты выбрал:</b> «' + optText + "» — " + optE + ".</div>" +
        '<div>🟢 <b>Правильный ответ:</b> «' + correct.t + "» — " + correct.e + ".</div>";
    }
    CUR.step++;
    $("controls").innerHTML = '<button class="primary-btn" onclick="renderTaleStep()">' +
      (CUR.step >= TALES.find(x => x.id === CUR.id).tasks.length ? "⚔️ К МИНИ-БОССУ" : "ДАЛЬШЕ ▶") + "</button>";
    save(); refreshHud(null);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function pickTaleOpt(i) {
    if (CUR.answered) return;
    CUR.answered = true;
    const opts = CUR.opts;
    const opt = opts[i];
    const btns = Array.from(document.querySelectorAll("#opts .opt-btn"));
    btns.forEach(b => b.classList.add("disabled"));
    btns.forEach((b, j) => { if (opts[j].ok) b.classList.add("correct"); });
    if (!opt.ok) btns[i].classList.add("wrong");
    const isBet = TALES.find(x => x.id === CUR.id).tasks[CUR.step].type === "bet";
    taleAnswered(!!opt.ok, opt.t, opt.e, opts.find(o => o.ok), isBet);
  }

  function pickTaleWord(span) {
    if (CUR.answered) return;
    const t = TALES.find(x => x.id === CUR.id);
    const q = t.tasks[CUR.step];
    if (span.textContent === q.target) {
      CUR.answered = true;
      span.classList.add("found");
      taleAnswered(true, "", "", { t: q.target, e: "«" + q.target + "» — верное слово!" }, false);
    } else {
      span.classList.add("miss");
      setTimeout(() => span.classList.remove("miss"), 500);
    }
  }

  // ============================================================
  // БОССЫ (мини-босс и босс мира) — общая механика
  // ============================================================
  function startMiniBoss() {
    const t = TALES.find(x => x.id === CUR.id);
    const pool = [];
    t.tasks.forEach(k => { if (k.type === "choice" || k.type === "bet") pool.push({ q: k.q, options: k.options }); });
    t.extra.forEach(k => pool.push({ q: k.q, options: k.options }));
    startBoss(t.id, { name: t.boss.name, icon: t.boss.icon, hp: t.boss.hp, pool: pool, isWorld: false, taleId: t.id });
  }

  function startWorldBoss() {
    const w = WORLDS[CUR.world];
    startBoss("wb_" + CUR.world, { name: w.boss.name, icon: w.boss.icon, hp: w.boss.hp, pool: w.boss.pool, isWorld: true });
  }

  function startBoss(nodeId, cfg) {
    CUR.mode = "boss";
    CUR.bossNodeId = nodeId;
    CUR.bossCfg = cfg;
    const prog = S.bossProgress[nodeId];
    CUR.bq = shuffle(cfg.pool.map((_, i) => i));
    CUR.bWrong = {};
    CUR.bHp = prog ? prog.hp : cfg.hp;
    CUR.bMax = cfg.hp;
    CUR.answered = false;
    renderBossQ();
  }

  function bossHeader() {
    const cfg = CUR.bossCfg;
    const pct = CUR.bHp / 10 * 100;
    return '<div class="scene-head">⚔️ БОСС: ' + cfg.name.toUpperCase() + "</div>" +
      '<div class="boss-wrap"><div class="boss-face" id="bossFace">' + cfg.icon + "</div>" +
      '<div class="boss-label">❤️ ЗДОРОВЬЕ: ' + CUR.bHp + " (старт — " + CUR.bMax + ", потолок 10)</div>" +
      '<div class="boss-hpbar"><div class="boss-hpfill" style="width:' + pct + '%"></div></div>' +
      '<div class="small-note">Верно: −1 ❤️ • Ошибка: +2 ❤️ (не больше 10) • Вопрос вернётся, пока не ответишь</div></div>';
  }

  function renderBossQ() {
    const cfg = CUR.bossCfg;
    if (!CUR.bq.length) {
      // пул кончился, а босс жив — перемешиваем заново, HP сохраняется
      CUR.bq = shuffle(cfg.pool.map((_, i) => i));
      CUR.bWrong = {};
    }
    const q = cfg.pool[CUR.bq[0]];
    let html = bossHeader() +
      '<div class="task-panel"><div class="task-title">⚔️ УДАР ПО ' + cfg.name.toUpperCase() + "</div>" +
      '<div class="task-q">' + q.q + "</div>" +
      '<div class="options" id="opts">';
    CUR.opts = shuffle(q.options);
    CUR.opts.forEach((o, i) => {
      html += '<button class="opt-btn" onclick="hitBoss(' + i + ')"><span class="num">' + (i + 1) + "</span><span>" + o.t + "</span></button>";
    });
    html += '</div><div id="feedback" class="feedback"></div><div id="controls" class="controls"></div></div>';
    $("app").innerHTML = html;
    CUR.answered = false;
    window.scrollTo(0, document.body.scrollHeight);
  }

  function hitBoss(i) {
    if (CUR.answered) return;
    CUR.answered = true;
    const cfg = CUR.bossCfg;
    const qi = CUR.bq[0];
    const opt = CUR.opts[i];
    const correct = CUR.opts.find(o => o.ok);
    const btns = Array.from(document.querySelectorAll("#opts .opt-btn"));
    btns.forEach(b => b.classList.add("disabled"));
    const fb = $("feedback");
    if (opt.ok) {
      CUR.bHp--;
      addCoins(5);
      const lvlUp = addXp(2);
      const face = $("bossFace");
      if (face) face.classList.add("hit");
      btns.forEach((b, j) => { if (CUR.opts[j].ok) b.classList.add("correct"); });
      fb.className = "feedback show good";
      fb.innerHTML = '<div class="fb-title">💥 ПОПАДАНИЕ! −1 ❤️ (+5 💎)</div><div>💬 ' + opt.e + ".</div>" +
        (lvlUp ? '<div class="fb-title">⭐ УРОВЕНЬ ЧИТАТЕЛЯ: ' + lvlUp + "!</div>" : "");
      $("controls").innerHTML = '<button class="primary-btn" onclick="bossNext(true)">СЛЕДУЮЩИЙ УДАР ⚔️</button>';
    } else {
      CUR.bHp = Math.min(10, CUR.bHp + 2);
      btns[i].classList.add("wrong");
      CUR.bWrong[qi] = (CUR.bWrong[qi] || 0) + 1;
      fb.className = "feedback show bad";
      fb.innerHTML = '<div class="fb-title">🛡 ' + cfg.name + " отбилась! +2 ❤️ (теперь " + CUR.bHp + ")</div>" +
        '<div>🔴 <b>Ты выбрал:</b> «' + opt.t + "» — " + opt.e + ".</div>" +
        '<div>🟢 <b>Правильный ответ:</b> «' + correct.t + "» — " + correct.e + ".</div>" +
        "<div>↩️ Вопрос вернётся ещё раз!</div>";
      $("controls").innerHTML = '<button class="primary-btn" onclick="bossNext(false)">СЛЕДУЮЩИЙ УДАР ⚔️</button>';
    }
    S.bossProgress[CUR.bossNodeId] = { hp: CUR.bHp, max: CUR.bMax };
    save(); refreshHud(null);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function bossNext(wasCorrect) {
    const qi = CUR.bq.shift();
    if (!wasCorrect && (CUR.bWrong[qi] || 0) < 2) CUR.bq.push(qi);
    if (CUR.bHp <= 0) { bossWin(); return; }
    renderBossQ();
  }

  function bossWin() {
    const cfg = CUR.bossCfg;
    delete S.bossProgress[CUR.bossNodeId];
    markDone(CUR.bossNodeId);
    let html = '<div class="scene-head">🏆 БОСС ПОВЕРЖЕН!</div><div class="collect-panel"><div class="c-title">' +
      cfg.icon + " " + cfg.name + " побеждён!</div>";
    if (cfg.isWorld) {
      addCoins(60);
      const lvlUp = addXp(40);
      addFeathers(1);
      html += '<div class="collect-item">+60 💎 • +40 ⭐ • +1 🖋 (перо — только за боссов мира!)</div>' +
        (lvlUp ? '<div class="collect-item">⭐ УРОВЕНЬ ЧИТАТЕЛЯ: ' + lvlUp + "!</div>" : "") +
        '<div class="collect-item">Мир пройден целиком. Следующий мир откроется на этапе 2 — а пока собирай карточки и «поливай» выученное!</div>';
    } else {
      const t = TALES.find(x => x.id === cfg.taleId);
      addCoins(15);
      const lvlUp = addXp(15);
      S.cards[t.id] = 1;
      html += '<div class="collect-item">+15 💎 • +15 ⭐</div>' +
        (lvlUp ? '<div class="collect-item">⭐ УРОВЕНЬ ЧИТАТЕЛЯ: ' + lvlUp + "!</div>" : "") +
        '<div class="collect-item">🃏 НОВАЯ КАРТОЧКА: <b>' + t.title + "</b><br>" + t.card + "</div>" +
        '<div class="collect-item">В коллекции карточек: ' + Object.keys(S.cards).length + " из " + TALES.length + "</div>";
    }
    save();
    html += '<div class="controls"><button class="primary-btn" onclick="showWorld()">К СПИСКУ УЗЛОВ ▶</button> ' +
      '<button class="back-btn" onclick="showMap()">НА КАРТУ</button></div></div>';
    $("app").innerHTML = html;
    refreshHud("🏆 БОСС ПОВЕРЖЕН");
    window.scrollTo(0, document.body.scrollHeight);
  }

  // ============================================================
  // ПОВТОРЕНИЕ — ДОХОД: «полив» раз в день
  // ============================================================
  function wateringPool() {
    const pool = [];
    Object.keys(S.done).forEach(id => {
      if (DOORS[id]) DOORS[id].q.forEach(q => { if (q.type === "choice") pool.push(q); });
      else {
        const t = TALES.find(x => x.id === id);
        if (t) {
          t.tasks.forEach(k => { if (k.type === "choice" || k.type === "bet") pool.push({ q: k.q, options: k.options }); });
          t.extra.forEach(k => pool.push({ q: k.q, options: k.options }));
        }
      }
    });
    return pool;
  }

  function startWatering() {
    const pool = wateringPool();
    if (!pool.length) { showMap(); return; }
    CUR = { mode: "water", world: CUR.world, q: pool[Math.floor(Math.random() * pool.length)], answered: false };
    const q = CUR.q;
    let html = '<div class="scene-head">💧 ПОЛИВ ВЫУЧЕННОГО</div>' +
      '<div class="task-panel"><div class="task-title">💧 ПОВТОРЕНИЕ — ДОХОД (1 РАЗ В ДЕНЬ)</div>' +
      '<div class="task-q">' + q.q + "</div>" +
      '<div class="options" id="opts">';
    CUR.opts = shuffle(q.options);
    CUR.opts.forEach((o, i) => {
      html += '<button class="opt-btn" onclick="pickWater(' + i + ')"><span class="num">' + (i + 1) + "</span><span>" + o.t + "</span></button>";
    });
    html += '</div><div id="feedback" class="feedback"></div><div id="controls" class="controls"></div></div>';
    $("app").innerHTML = html;
    refreshHud("💧 ПОЛИВ ВЫУЧЕННОГО");
    window.scrollTo(0, document.body.scrollHeight);
  }

  function pickWater(i) {
    if (CUR.answered) return;
    CUR.answered = true;
    const opt = CUR.opts[i];
    const correct = CUR.opts.find(o => o.ok);
    const btns = Array.from(document.querySelectorAll("#opts .opt-btn"));
    btns.forEach(b => b.classList.add("disabled"));
    btns.forEach((b, j) => { if (CUR.opts[j].ok) b.classList.add("correct"); });
    if (!opt.ok) btns[i].classList.add("wrong");
    const fb = $("feedback");
    let msg;
    if (opt.ok) {
      addCoins(5);
      const lvlUp = addXp(3);
      msg = '<div class="fb-title">✅ ПОМНИШЬ! +5 💎 +3 ⭐</div><div>💬 ' + opt.e + ".</div>" +
        (lvlUp ? '<div class="fb-title">⭐ УРОВЕНЬ ЧИТАТЕЛЯ: ' + lvlUp + "!</div>" : "");
    } else {
      addCoins(1);
      msg = '<div class="fb-title">💧 Чуть забылось — +1 💎 за старание</div>' +
        '<div>🟢 <b>Правильный ответ:</b> «' + correct.t + "» — " + correct.e + ".</div>";
    }
    fb.className = "feedback show " + (opt.ok ? "good" : "bad");
    fb.innerHTML = msg;
    S.water = todayKey();
    save(); refreshHud(null);
    $("controls").innerHTML = '<button class="primary-btn" onclick="showMap()">НА КАРТУ 🗺</button>';
    window.scrollTo(0, document.body.scrollHeight);
  }

  // ============================================================
  // СТАРТ
  // ============================================================
  // Enter нажимает главную зелёную кнопку (удобно учителю)
  document.addEventListener("keydown", e => {
    if (e.code !== "Enter") return;
    const btn = Array.from(document.querySelectorAll("#app .primary-btn")).find(b => b.offsetParent !== null);
    if (btn) btn.click();
  });

  showMap();
</script>
