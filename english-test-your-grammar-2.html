<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test your grammar 2 — уроки</title>
<style>
  :root{
    --paper:#fff8ec;
    --ink:#3b2f1e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:"Comic Sans MS","Segoe Print","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 480px at 50% -120px, #ffe9c0, rgba(255,255,255,0)),
      var(--paper);
    min-height:100vh;
    touch-action:manipulation;
  }
  body.grabbing, body.grabbing *{cursor:grabbing !important;}
  [hidden]{display:none !important;}

  h1{font-size:23px; margin:10px 0 2px; line-height:1.3; text-align:center;}
  h1 .appname{color:#2563eb;}
  .stage{max-width:980px; margin:0 auto; padding:0 14px;}
  .stage h2{text-align:center; font-size:23px; margin:14px 0 4px;}
  .stage .sub{text-align:center; color:#8b7d5e; font-size:15px; margin:0 0 12px;}
  .stage-foot{display:flex; gap:12px; justify-content:center; align-items:center; padding:6px 0 30px; flex-wrap:wrap;}

  .btn{
    border:none; border-radius:999px; padding:12px 28px;
    font:inherit; font-weight:bold; font-size:18px; cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.18); transition:transform .1s, box-shadow .1s;
  }
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .btn.primary{background:linear-gradient(#34d399,#10b981); color:#fff;}
  .btn.ghostbtn{background:#fff; color:#7c6f57; border:2px solid #e3d3ae; box-shadow:0 3px 0 #e3d3ae;}
  .btn.warn{background:linear-gradient(#f87171,#ef4444); color:#fff;}
  .btn.small{padding:8px 16px; font-size:15px;}
  #soundBtn{padding:10px 16px; font-size:20px;}

  /* ---------- карта ---------- */
  .map-top{
    display:flex; align-items:center; justify-content:center; gap:12px;
    flex-wrap:wrap; margin:12px auto 2px; max-width:980px; padding:0 12px;
  }
  .progress{
    background:#fff; border-radius:999px; padding:7px 18px;
    box-shadow:0 2px 6px rgba(0,0,0,.08); font-size:15px; font-weight:bold;
  }
  .progress b{color:#10b981;}
  .map-legend{
    text-align:center; color:#a08b5f; font-size:13px; margin:6px auto 0; max-width:900px; padding:0 12px;
  }
  #mapWrap{position:relative; max-width:1020px; margin:8px auto 30px;}
  #mapSvg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .circle{
    position:absolute; border-radius:999px; border:none;
    font-family:inherit; font-weight:bold; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    line-height:1.05; box-shadow:0 4px 10px rgba(0,0,0,.18);
    transition:transform .15s;
  }
  .circle:hover{transform:scale(1.08);}
  .circle .num{font-size:calc(var(--cs) * .38);}
  .circle .pct{font-size:calc(var(--cs) * .26);}
  .circle.pass{background:linear-gradient(#34d399,#10b981); color:#fff; box-shadow:0 4px 10px rgba(16,185,129,.4);}
  .circle.open{
    background:linear-gradient(#60a5fa,#2563eb); color:#fff;
    box-shadow:0 4px 14px rgba(37,99,235,.5);
    animation:circle-pulse 1.6s infinite;
  }
  .circle.lock{
    background:#efe6cf; color:#b6a988; border:2px dashed #d9c9a3;
    box-shadow:none; cursor:default;
  }
  .circle.lock:hover{transform:none;}
  @keyframes circle-pulse{
    0%,100%{box-shadow:0 4px 14px rgba(37,99,235,.5);}
    50%{box-shadow:0 0 0 8px rgba(37,99,235,.18);}
  }
  .teacher-flag{
    text-align:center; font-size:14px; font-weight:bold; color:#b45309;
    background:#fff3d6; border:2px dashed #e3c98b; border-radius:12px;
    max-width:520px; margin:8px auto 0; padding:7px 14px;
  }
  .teacher-tools{display:flex; gap:10px; justify-content:center; margin-top:8px; flex-wrap:wrap;}

  /* ---------- урок: верхняя панель ---------- */
  .lesson-top{
    display:flex; align-items:center; justify-content:center; gap:8px;
    flex-wrap:wrap; padding:10px 12px 2px;
  }
  .lesson-title{font-size:17px; font-weight:bold; color:#2563eb; margin-right:6px;}
  .stage-dots{display:flex; gap:5px; align-items:center; flex-wrap:wrap;}
  .stage-dots b{
    font-size:12px; font-weight:bold; color:#a08b5f;
    border:2px solid #e3d3ae; border-radius:999px; padding:3px 10px; background:#fff;
    white-space:nowrap;
  }
  .stage-dots b.cur{background:#2563eb; color:#fff; border-color:#1d4ed8;}
  .stage-dots i{color:#d9c9a3; font-style:normal; font-size:12px;}
  .home{
    border:none; background:#fff; border:2px solid #e3d3ae; border-radius:999px;
    width:38px; height:38px; font-size:19px; cursor:pointer; color:#7c6f57;
    box-shadow:0 2px 0 #e3d3ae;
  }

  /* ---------- словарик ---------- */
  #dictCards{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:8px auto 6px; max-width:900px;}
  .dcard{
    background:#fff; border:2px solid #e3d3ae; border-radius:14px;
    padding:9px 15px; text-align:center; cursor:pointer;
    box-shadow:0 2px 0 #d9c9a3, 0 4px 10px rgba(0,0,0,.08);
    transition:transform .15s;
  }
  .dcard:hover{transform:translateY(-3px);}
  .dcard .en{font-size:24px; font-weight:bold; color:#4a3b22;}
  .dcard .ru{font-size:13px; color:#8b7d5e; margin-top:3px;}
  .dcard.say{animation:popin .3s;}
  .dict-group{
    text-align:center; color:#2563eb; font-weight:bold; font-size:16px;
    margin:10px auto 2px; max-width:900px;
  }

  /* ---------- правило ---------- */
  .rule{
    max-width:780px; margin:6px auto 10px; background:#fffdf4;
    border:2px dashed #dcc99b; border-radius:18px; padding:18px 26px;
  }
  .rule-block{margin:14px 0; font-size:19px; line-height:1.55;}
  .rule-block .cond{font-weight:bold;}
  .ex{font-size:24px; font-weight:bold; margin:8px 0 4px; line-height:1.6;}
  .ex-line{white-space:nowrap;}
  .hl{font-size:1.08em;}
  .hl-s{color:#2563eb;}
  .hl-es{color:#dc2626;}
  .hl-ies{color:#7c3aed;}
  .hl-x{color:#64748b;}

  /* ---------- задание ---------- */
  .task{
    max-width:820px; margin:12px auto 2px; background:#fffdf4;
    border:2px dashed #dcc99b; border-radius:14px; padding:9px 18px;
    font-size:16px; line-height:1.45; text-align:center;
  }
  .bar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    flex-wrap:wrap; margin:8px auto 0; max-width:860px; padding:0 12px;
  }
  .stat{
    background:#fff; border-radius:999px; padding:5px 14px;
    box-shadow:0 2px 6px rgba(0,0,0,.08); font-size:14px; white-space:nowrap;
  }
  .stat b{color:#b45309;}

  #wrongBanner{
    max-width:840px; margin:8px auto 0; background:#ffe9e9;
    border:2px solid #f87171; color:#7f1d1d; font-weight:bold;
    border-radius:14px; padding:9px 16px; text-align:center; font-size:16px;
  }

  #bank{
    display:flex; flex-wrap:wrap; gap:9px; justify-content:center; align-items:center;
    max-width:930px; margin:8px auto 12px; padding:10px 12px;
    background:#fff; border-radius:16px; border:2px solid #eee0bf;
    box-shadow:0 4px 14px rgba(0,0,0,.06); min-height:56px;
  }
  #bank:empty::after{
    content:'Все слова разложены! Жми «Проверить» ✔';
    color:#10b981; font-weight:bold; font-size:17px; padding:8px;
  }

  .chip{
    display:inline-flex; align-items:baseline; gap:6px;
    padding:8px 13px; border-radius:12px;
    background:linear-gradient(#ffffff,#fdf3dd);
    border:2px solid #e3d3ae;
    font-size:17px; font-weight:bold; color:#4a3b22;
    box-shadow:0 2px 0 #d9c9a3, 0 4px 10px rgba(0,0,0,.08);
    cursor:grab; user-select:none; -webkit-user-select:none;
    touch-action:none; position:relative;
    transition:transform .15s, box-shadow .15s, background .2s, border-color .2s;
  }
  .chip .w{text-transform:uppercase;}
  .chip:hover{transform:translateY(-2px);}
  .chip.selected{
    border-color:#f59e0b;
    box-shadow:0 0 0 3px #fde68a, 0 6px 14px rgba(245,158,11,.35);
    transform:scale(1.06);
  }
  .chip.dragging{opacity:.35;}
  .chip.ghost{
    position:fixed; left:0; top:0; z-index:1000; pointer-events:none;
    cursor:grabbing; opacity:.95;
    box-shadow:0 12px 26px rgba(0,0,0,.28); transform:scale(1.05);
  }
  .chip.locked{
    cursor:default;
    background:linear-gradient(#e9fbef,#d7f5e3);
    border-color:#86dca3;
    box-shadow:0 2px 0 #86dca3, 0 3px 8px rgba(16,185,129,.18);
  }
  .chip.wrong{
    background:#ffe3e3; border-color:#f87171; color:#7f1d1d;
    animation:shake .5s;
  }
  .chip.say{cursor:pointer;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-7px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  @keyframes popin{from{transform:scale(.6); opacity:.3;} to{transform:scale(1); opacity:1;}}
  .chip.pop-in, .dcard.pop-in{animation:popin .3s;}

  /* корзинки (урок 1) */
  .baskets{
    display:flex; gap:18px; justify-content:center; align-items:stretch;
    flex-wrap:wrap; padding:0 14px 16px; max-width:1020px; margin:0 auto;
  }
  .col{
    flex:1 1 250px; max-width:310px; min-width:240px;
    display:flex; flex-direction:column; align-items:center;
    border-radius:20px; padding:10px 10px 12px;
    border:3px dashed var(--bc,#ddd);
    transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .col.s  {--bc:#e9cf96; background:#fff7e0;}
  .col.es {--bc:#ccd6a3; background:#f2f5e4;}
  .col.ies{--bc:#ddc4a4; background:#f7efe4;}
  .col.hover{
    border-style:solid; border-color:#f59e0b;
    box-shadow:0 0 0 5px rgba(245,158,11,.30);
    transform:translateY(-3px);
  }
  .col.hover .bwrap img{transform:scale(1.07) rotate(-3deg);}
  .bwrap{position:relative; margin-bottom:8px;}
  .bwrap img{
    width:112px; display:block; pointer-events:none;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.18));
    transition:transform .18s;
  }
  .count{
    position:absolute; right:-10px; top:-8px;
    background:#e11d48; color:#fff; border-radius:999px;
    min-width:28px; height:28px; padding:0 6px;
    display:grid; place-items:center; font-weight:bold; font-size:15px;
    border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .chips{
    min-height:120px; width:100%;
    display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center;
    gap:7px; padding-top:2px;
  }

  /* предложения (урок 2) */
  #sentences{max-width:920px; margin:4px auto 0; padding:0 12px;}
  .srow{
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
    background:#fff; border:2px solid #eee0bf; border-radius:14px;
    padding:8px 14px; margin-bottom:8px; font-size:17px; line-height:1.5;
    transition:background .2s, border-color .2s;
  }
  .srow .num{font-weight:bold; color:#a08b5f; min-width:26px;}
  .srow .text{flex:1 1 auto; min-width:200px;}
  .srow.row-ok{background:#e9fbef; border-color:#86dca3;}
  .srow.row-wrong{
    background:#ffe9e9; border-color:#f87171;
    animation:pulse 1.2s infinite; cursor:pointer;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0);}
    50%{box-shadow:0 0 0 5px rgba(239,68,68,.25);}
  }
  .wordcap{
    display:inline-flex; padding:5px 12px; border-radius:10px;
    background:#f2f5e4; border:2px solid #ccd6a3;
    font-weight:bold; font-size:15px; letter-spacing:.04em; color:#4a3b22;
    cursor:pointer; user-select:none; -webkit-user-select:none;
    text-transform:uppercase;
  }

  /* составление предложений (порядок слов) */
  .wrow{
    background:#fff; border:2px solid #eee0bf; border-radius:14px;
    padding:8px 14px; margin-bottom:8px; font-size:17px;
    transition:background .2s, border-color .2s;
  }
  .wrow .num{font-weight:bold; color:#a08b5f; min-width:26px; display:inline-block;}
  .wrow.row-ok{background:#e9fbef; border-color:#86dca3;}
  .wrow.row-wrong{
    background:#ffe9e9; border-color:#f87171;
    animation:pulse 1.2s infinite; cursor:pointer;
  }
  .wo-built{
    min-height:40px; background:#fffdf4; border:2px dashed #d9c9a3; border-radius:10px;
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:4px 10px; margin:6px 0;
  }
  .wo-built .punct{color:#a08b5f; font-weight:bold;}
  .wo-pool{display:flex; flex-wrap:wrap; gap:6px; min-height:34px; align-items:center;}
  .tok{
    display:inline-flex; padding:4px 12px; border-radius:10px;
    background:linear-gradient(#ffffff,#fdf3dd); border:2px solid #e3d3ae;
    font-weight:bold; font-size:15px; color:#4a3b22; cursor:pointer; user-select:none;
    box-shadow:0 2px 0 #d9c9a3; transition:transform .1s;
  }
  .tok:hover{transform:translateY(-2px);}
  .tok.inpool{opacity:.35;}

  /* выбор варианта */
  .optbtn{
    display:inline-flex; margin:0 4px; padding:3px 14px; border-radius:10px;
    background:#f2f5e4; border:2px solid #ccd6a3;
    font:inherit; font-weight:bold; font-size:16px; color:#4a3b22; cursor:pointer;
    transition:transform .1s;
  }
  .optbtn:hover{transform:translateY(-2px);}
  .optbtn.sel{background:#fde68a; border-color:#f59e0b;}
  .optbtn.ok{background:#e9fbef; border-color:#86dca3; color:#147a4a;}
  .optbtn.err{background:#ffe3e3; border-color:#f87171; color:#7f1d1d; animation:shake .4s;}

  /* картинки (урок 11) */
  .prow{
    display:flex; align-items:center; gap:14px;
    background:#fff; border:2px solid #eee0bf; border-radius:14px;
    padding:8px 14px; margin-bottom:8px;
    transition:background .2s, border-color .2s;
  }
  .prow .num{font-weight:bold; color:#a08b5f; min-width:26px;}
  .prow img{
    height:86px; border-radius:10px; background:#fff; border:1px solid #eee0bf;
    pointer-events:none;
  }
  .prow.row-ok{background:#e9fbef; border-color:#86dca3;}
  .prow.row-wrong{
    background:#ffe9e9; border-color:#f87171;
    animation:pulse 1.2s infinite; cursor:pointer;
  }
  .winput.wide{width:17ch;}
  .stem{
    display:inline-flex; padding:3px 10px; margin-right:2px;
    background:#f2f5e4; border:2px solid #ccd6a3; border-radius:10px;
    font-weight:bold; font-size:16px; color:#4a3b22;
  }
  .digits{
    display:inline-block; min-width:64px; text-align:center;
    font-size:44px; font-weight:bold; color:#2563eb;
    background:#fffdf4; border:2px solid #eee0bf; border-radius:12px; padding:4px 10px;
  }
  .wordbank{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    max-width:840px; margin:8px auto 4px; padding:10px;
    background:#fff; border-radius:14px; border:2px dashed #e3d3ae;
  }
  .wordchip{
    padding:5px 14px; border-radius:10px; background:#fdf3dd;
    border:2px solid #e3d3ae; font-weight:bold; font-size:16px; color:#4a3b22;
  }
  .wordcap:hover{transform:translateY(-2px);}
  .winput{
    font:inherit; font-weight:bold; color:#4a3b22;
    width:10.5ch; padding:5px 6px; margin:0 4px;
    background:#fffdf4; border:none; border-bottom:2px dashed #b45309;
    outline:none; text-align:center;
  }
  .winput:focus{border-bottom-style:solid;}
  .winput.ok{color:#147a4a; border-bottom:2px solid #86dca3; background:#fff;}
  .winput.bad{
    color:#7f1d1d; border-bottom:2px solid #f87171; background:#fff;
    animation:shake .5s;
  }

  .controls{
    position:sticky; bottom:10px; z-index:50;
    display:flex; gap:14px; justify-content:center; align-items:center;
    padding:8px 12px 14px;
  }

  /* ---------- проверка слов прошлого урока ---------- */
  .rv-wrap{max-width:620px; margin:8px auto 0; padding:0 14px;}
  .rv-card{
    background:#fffdf4; border:2px dashed #dcc99b; border-radius:20px;
    padding:22px 26px; text-align:center;
  }
  .rv-q{color:#8b7d5e; font-size:15px; margin-bottom:8px;}
  .rv-word{font-size:44px; font-weight:bold; color:#4a3b22; line-height:1.2;}
  .rv-word .say{
    display:inline-block; margin-left:10px; font-size:20px; cursor:pointer;
    background:#fff; border:2px solid #e3d3ae; border-radius:999px;
    width:40px; height:40px; vertical-align:middle;
  }
  .rv-opts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 0;}
  .rv-opt{
    font:inherit; font-weight:bold; font-size:17px; color:#4a3b22;
    background:#fff; border:2px solid #e3d3ae; border-radius:14px;
    padding:12px 10px; cursor:pointer; box-shadow:0 2px 0 #d9c9a3;
    transition:transform .1s;
  }
  .rv-opt:hover{transform:translateY(-2px);}
  .rv-opt.ok{background:#e9fbef; border-color:#86dca3; color:#147a4a;}
  .rv-opt.err{background:#ffe3e3; border-color:#f87171; color:#7f1d1d; animation:shake .4s;}
  .rv-score{font-size:16px; font-weight:bold; color:#8b7d5e; margin-top:14px;}

  .controls-static{display:flex; gap:12px; justify-content:center; align-items:center; padding:14px 12px 30px; flex-wrap:wrap;}

  /* ---------- кнопки листания (для учителя) ---------- */
  .teacher-nav{position:fixed; right:14px; bottom:14px; z-index:90; display:flex; gap:8px;}
  .teacher-nav button{
    width:46px; height:46px; border-radius:999px; border:2px solid #e3d3ae;
    background:#fff; color:#7c6f57; font-size:24px; font-weight:bold; line-height:1;
    cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.15); transition:transform .1s;
  }
  .teacher-nav button:hover{transform:translateY(-2px);}
  .teacher-nav button:disabled{opacity:.35; cursor:default; transform:none;}

  #toast{
    position:fixed; left:50%; bottom:88px; z-index:1200;
    transform:translateX(-50%) translateY(16px);
    background:#312e81; color:#fff; font-weight:bold; font-size:16px;
    padding:12px 22px; border-radius:999px;
    opacity:0; pointer-events:none; transition:.25s;
    box-shadow:0 8px 20px rgba(0,0,0,.3); max-width:90vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:1150; overflow:hidden;}
  .cf{position:absolute; top:0; border-radius:2px; will-change:transform;}

  #win, #explain{
    position:fixed; inset:0; z-index:1100;
    background:rgba(59,47,30,.55); backdrop-filter:blur(2px);
    display:none; place-items:center; padding:16px;
  }
  #win.show, #explain.show{display:grid;}
  .win-card, .ex-card{
    background:#fffdf6; border-radius:26px; padding:30px 40px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35); max-width:92vw;
    animation:popin .4s;
  }
  .trophy{font-size:64px; line-height:1;}
  .win-card h2{margin:12px 0 6px; font-size:26px; color:#147a4a;}
  .win-card h2.fail{color:#dc2626;}
  .win-card p{margin:0 0 18px; font-size:17px; color:#7c6f57;}
  .win-btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}

  /* ---------- разбор ошибки ---------- */
  .ex-card{max-width:600px; width:580px;}
  .ex-word{font-size:44px; font-weight:bold; color:#4a3b22; line-height:1.25;}
  .ex-word .hl{font-size:1.08em;}
  .ex-ru{color:#8b7d5e; margin:4px 0 8px; font-size:16px;}
  .ex-note{font-size:18px; font-weight:bold; color:#b45309; margin:8px 0 2px; line-height:1.45;}
  .ex-qa{text-align:left; margin:10px 0 2px;}
  .ex-q{font-size:18px; margin:10px 0;}
  .ex-a{display:none; font-weight:bold; font-size:21px;}
  .ex-a.rev{display:inline-block; animation:popin .3s;}
  .ex-plural{display:none; font-size:28px; font-weight:bold; margin:12px 0 2px;}
  .ex-plural.rev{display:block; animation:popin .3s;}
  .ex-sentence{display:none; font-size:21px; font-weight:bold; margin:12px 0 2px; line-height:1.5;}
  .ex-sentence.rev{display:block; animation:popin .3s;}
  .ex-btns{margin-top:16px; display:flex; gap:10px; justify-content:center;}

const TOTAL_LESSONS = 38;   /* по числу тестов в сборнике */
const PASS_PCT = 80;        /* порог сдачи, % */

/* ---------- грамматика ---------- */
function wordInfo(w){
  if(/[bcdfghjklmnpqrstvwxz]y$/.test(w))
    return {group:'ies', last:'y', endLen:1, rule:'«y» после согласной меняется на «i» и добавляется «es»'};
  if(/[aeiou]y$/.test(w))
    return {group:'s', last:'y', endLen:1, rule:'«y» после гласной не меняется — просто добавляется «s»'};
  const m = w.match(/(ch|sh|ss|x|s|o)$/);
  if(m)
    return {group:'es', last:m[1], endLen:m[1].length, rule:'После «' + m[1] + '» добавляется «es»'};
  return {group:'s', last:w.slice(-1), endLen:1, rule:'Большинству слов просто добавляется «s»'};
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function hlSpan(text, group){
  return '<b class="hl hl-' + group + '">' + text + '</b>';
}
function hlTail(word, len, group){
  return escapeHtml(word.slice(0, -len)) + hlSpan(escapeHtml(word.slice(-len)), group);
}
function pluralHl(word, plural, type){
  if(type === 'regular'){
    const g = wordInfo(word);
    return hlTail(plural, g.group.length, g.group);
  }
  if(type === 'invariant')
    return '<b class="hl hl-x">' + escapeHtml(plural) + '</b>';
  return '<b class="hl hl-ies">' + escapeHtml(plural) + '</b>';
}
function taskNote(type, word){
  if(type === 'irregular') return 'Это слово-исключение! Форму надо запомнить.';
  if(type === 'invariant') return '«fish» во множественном числе не меняется!';
  return wordInfo(word).rule;
}

  let k = 0;
  for(let i = 1; i <= TOTAL_LESSONS; i++) if(bestOf(i) >= PASS_PCT) k++;

/* ---------- звук ---------- */
function actx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
let audioCtx = null;
function tone(freq, delay, dur, type, gain){
  if(muted) return;
  try{
    const a = actx();
    const t = a.currentTime + delay;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}
const sPick  = () => tone(700, 0, .07, 'triangle', .06);
const sDrop  = () => { tone(520, 0, .09, 'triangle', .10); tone(780, .07, .12, 'triangle', .10); };
const sBack  = () => tone(420, 0, .08, 'triangle', .08);
const sDeny  = () => tone(180, 0, .18, 'square', .05);
const sWrong = () => { tone(300, 0, .15, 'sawtooth', .06); tone(220, .16, .22, 'sawtooth', .06); };
const sWin   = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .13, .22, 'triangle', .12));

let voicesCache = [];
function loadVoices(){
  try{
    voicesCache = speechSynthesis.getVoices()
      .filter(v => v.lang && v.lang.toLowerCase().indexOf('en') === 0);
  }catch(e){}
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
let speakTimer = null;
function speak(text){
  if(muted) return;
  try{
    clearTimeout(speakTimer);
    speechSynthesis.cancel();
    speakTimer = setTimeout(() => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.7;
      if(voicesCache.length) u.voice = voicesCache[Math.random() * voicesCache.length | 0];
      speechSynthesis.speak(u);
    }, 250);
  }catch(e){}
}

/* ---------- утилиты ---------- */
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.random() * (i + 1) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function wiggle(el){
  el.animate(
    [{transform:'rotate(0)'},{transform:'rotate(-4deg)'},{transform:'rotate(4deg)'},{transform:'rotate(0)'}],
    {duration:300}
  );
}
function popIn(el){

const mapWrap = document.getElementById('mapWrap');
const TOTAL = TOTAL_LESSONS;

function circleState(n){
  if(bestOf(n) >= PASS_PCT) return 'pass';
  if(n === 1 || bestOf(n - 1) >= PASS_PCT) return 'open';
  return 'lock';
}
function renderMap(){
  document.getElementById('mapPassed').textContent = passedCount();
  mapWrap.querySelectorAll('.circle').forEach(c => c.remove());
  const svg = document.getElementById('mapSvg');
  svg.innerHTML = '';
  const pts = layoutMap();
  /* путь-линия по центрам кружков */
  svg.setAttribute('viewBox', '0 0 ' + mapWrap.clientWidth + ' ' + mapWrap.clientHeight);
  svg.style.height = mapWrap.clientHeight + 'px';
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p.x + ' ' + p.y).join(' ');
  svg.innerHTML = '<path d="' + d + '" fill="none" stroke="#d9c9a3" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>';
}
function layoutMap(){
  const W = mapWrap.clientWidth || 900;
  const cols = W >= 960 ? 8 : W >= 700 ? 6 : 4;
  const colW = W / cols;
  const compact = window.innerHeight <= 520;
  const rowH = compact ? 72 : 94;
  const rows = Math.ceil(TOTAL / cols);
  const size = Math.max(40, Math.min(colW - 18, rowH - 22, 66));
  mapWrap.style.height = (rows * rowH) + 'px';
  const pts = [];
  for(let i = 0; i < TOTAL; i++){
    const r = Math.floor(i / cols);
    const pos = i % cols;
    const c = (r % 2 === 0) ? pos : (cols - 1 - pos);   /* змейка */
    const x = c * colW + colW / 2;
    const y = r * rowH + rowH / 2;
    pts.push({x, y});
    let st = circleState(i + 1);
    if(store.teacher) st = bestOf(i + 1) >= PASS_PCT ? 'pass' : 'open';
    const b = document.createElement('button');
    b.className = 'circle ' + st;
    b.style.setProperty('--cs', size + 'px');
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = (x - size / 2) + 'px';
    b.style.top = (y - size / 2) + 'px';
    b.innerHTML = '<span class="num">' + (i + 1) + '</span>' +
      (bestOf(i + 1) >= PASS_PCT ? '<span class="pct">' + bestOf(i + 1) + '%</span>' : '');
    b.title = 'Урок ' + (i + 1) + (bestOf(i + 1) ? ' · лучший результат ' + bestOf(i + 1) + '%' : '');
    b.addEventListener('click', () => {
      const can = store.teacher || circleState(i + 1) !== 'lock';
      if(!can){
        toast('Сначала сдай урок ' + i + '!');
        sDeny();
        return;
      }
      sPick();
      openLesson(i + 1);
    });
    mapWrap.appendChild(b);
  }
  return pts;
}

/* =====================================================================
   ЭТАП: проверка слов прошлого урока
===================================================================== */
function buildReview(sec, L){
  const poolPrev = [];
  const prev = LESSONS[L.n - 2];
  prev.dict.forEach(d => poolPrev.push({w:d.w, ru:d.ru}));
  prev.sentenceVocab.forEach(d => poolPrev.push({w:d.w, ru:d.ru}));
  const poolOlder = [];
  for(let i = 0; i < L.n - 2; i++){
    LESSONS[i].dict.forEach(d => poolOlder.push({w:d.w, ru:d.ru}));
    LESSONS[i].sentenceVocab.forEach(d => poolOlder.push({w:d.w, ru:d.ru}));
  }
  sec.innerHTML =
    '<h2>🔁 Проверка: слова прошлого урока</h2>' +
    '<p class="sub">Выбери правильный перевод. Сдаётся с 80% — тогда откроются новые слова!</p>' +
    '<div class="rv-wrap">' +
      '<div class="rv-card">' +
        '<div class="rv-q">Как переводится это слово?</div>' +
        '<div class="rv-word"><span id="rvEn"></span><button class="say" id="rvSay" title="Послушать">🔊</button></div>' +
        '<div class="rv-opts" id="rvOpts"></div>' +
        '<div class="rv-score" id="rvScore"></div>' +
      '</div>' +
      '<div class="controls-static">' +
        '<button class="btn warn" id="rvRetry" hidden>Повторить ещё раз</button>' +
        '<button class="btn primary" id="rvGo" hidden>Новые слова →</button>' +
      '</div>' +
    '</div>';

  const N = 6;
  let qs = [], qi = 0, score = 0, locked = false;

  function sample(){
    const older = shuffle(poolOlder.slice()).slice(0, Math.min(2, poolOlder.length));
    const prevPart = shuffle(poolPrev.slice()).slice(0, N - older.length);
    return shuffle(prevPart.concat(older));
  }
  function makeQ(item){
    const others = shuffle(
      poolPrev.concat(poolOlder).filter(x => x.ru !== item.ru)
    ).slice(0, 3).map(x => x.ru);
    const opts = shuffle([item.ru].concat(others));
    return {w:item.w, ru:item.ru, opts};
  }
  function showQ(){
    locked = false;
    const q = qs[qi];
    document.getElementById('rvEn').textContent = q.w;
    document.getElementById('rvScore').textContent = 'Слово ' + (qi + 1) + ' из ' + N + ' · Верно: ' + score;
    const box = document.getElementById('rvOpts');
    box.innerHTML = '';
    q.opts.forEach(o => {
      const b = document.createElement('button');
      b.className = 'rv-opt';
      b.textContent = o;
      b.addEventListener('click', () => {
        if(locked) return;
        locked = true;
        if(o === q.ru){
          b.classList.add('ok');
          score++;
          sDrop();
        } else {
          b.classList.add('err');
          Array.from(box.children).forEach(x => { if(x.textContent === q.ru) x.classList.add('ok'); });
          sWrong();
        }
        setTimeout(next, 750);
      });
      box.appendChild(b);
    });
    speak(q.w);
  }
  function next(){
    qi++;
    if(qi < N){ showQ(); return; }
    const pct = Math.round(score / N * 100);
    document.getElementById('rvScore').textContent = 'Результат: ' + score + ' из ' + N + ' (' + pct + '%)';
    if(pct >= PASS_PCT){
      document.getElementById('rvGo').hidden = false;
      sWin();
    } else {
      document.getElementById('rvRetry').hidden = false;
      sWrong();
    }
  }
  document.getElementById('rvRetry').addEventListener('click', () => {
    document.getElementById('rvRetry').hidden = true;
    start();
  });
  document.getElementById('rvGo').addEventListener('click', () => {
    const idx = cur.stages.findIndex(s => s.key === 'dict');
    showStage(idx);
  });
  function start(){
    qs = sample().map(makeQ);
    qi = 0;
    score = 0;
    document.getElementById('rvRetry').hidden = true;
    document.getElementById('rvGo').hidden = true;
    showQ();
  }
  start();
}

function buildDict(sec, L){
  sec.innerHTML = '<h2>📘 Словарик</h2>' +
    '<p class="sub">Нажми на слово — услышишь, как оно звучит. Запомни слова и перевод!</p>';
  const groups = [];
  groups.push({title:'Слова задания — поставь их во множественное число:', items:L.dict});
  if(L.sentenceVocab && L.sentenceVocab.length)
    groups.push({title:'Слова и выражения из предложений:', items:L.sentenceVocab});
  const body = document.createElement('div');
  groups.forEach(g => {
    const t = document.createElement('div');
    t.className = 'dict-group';
    t.textContent = g.title;
    const cont = document.createElement('div');
    cont.id = 'dictCards';
    g.items.forEach(item => {
      const c = document.createElement('div');
      c.className = 'dcard';
      c.innerHTML = '<div class="en"></div><div class="ru"></div>';
      c.querySelector('.en').textContent = item.w;
      c.querySelector('.ru').textContent = item.ru;
      c.addEventListener('click', () => {
        c.classList.remove('say');
        void c.offsetWidth;
        c.classList.add('say');
        speak(item.say || item.w);
        sPick();
      });
      cont.appendChild(c);
    });
    body.append(t, cont);
  });
  const foot = document.createElement('div');
  foot.className = 'stage-foot';
  const btn = document.createElement('button');
  btn.className = 'btn primary';
  const idx = cur.stages.findIndex(s => s.key === 'rule');
  btn.textContent = 'Дальше';

}

   ЭТАП: задание
===================================================================== */
function bindChip(chip, opts){
  chip.addEventListener('pointerdown', e => {
    if(chip.classList.contains('locked')){ wiggle(chip); sDeny(); return; }
    if(drag) return;
    e.preventDefault();
    drag = {chip, id:e.pointerId, sx:e.clientX, sy:e.clientY, started:false, ghost:null};
    try{ chip.setPointerCapture(e.pointerId); }catch(err){}
  });
  chip.addEventListener('pointermove', e => {
    if(!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if(!drag.started){
      if(Math.hypot(dx, dy) < 7) return;
      startDrag(e, drag);
    }
    drag.ghost.style.transform = 'translate(' + (e.clientX - drag.ox) + 'px,' + (e.clientY - drag.oy) + 'px)';
    if(opts.onHover) opts.onHover(e.clientX, e.clientY);
  });
  chip.addEventListener('pointerup', e => {
    if(!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    if(d.started) endDrag(e, d, true, opts);
    else{
      lastPointerTap = {chip:d.chip, t:Date.now()};
      opts.onTap(d.chip);
    }
  });
  chip.addEventListener('pointercancel', e => {
    if(!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    endDrag(e, d, false, opts);
  });
  chip.addEventListener('click', e => {
    e.stopPropagation();
    const lp = lastPointerTap;
    if(lp && lp.chip === chip && Date.now() - lp.t < 600) return;
    opts.onTap(chip);
  });
  chip.addEventListener('contextmenu', e => e.preventDefault());
}
function startDrag(e, d){
  d.started = true;
  const r = d.chip.getBoundingClientRect();
  d.ox = e.clientX - r.left;
  d.oy = e.clientY - r.top;
  const g = d.chip.cloneNode(true);
  g.className = 'chip ghost';
  g.style.width = r.width + 'px';
  document.body.appendChild(g);
  d.ghost = g;
  d.chip.classList.add('dragging');
  if(selected === d.chip) setSelected(null);
  document.body.classList.add('grabbing');
  sPick();
}
function endDrag(e, d, dropped, opts){
  if(d.started){
    d.ghost.remove();
    d.chip.classList.remove('dragging');
    document.body.classList.remove('grabbing');
    if(opts.onClearHover) opts.onClearHover();
    if(dropped && opts.onDrop) opts.onDrop(e, d.chip);
  }
}
function setSelected(chip){
  if(selected) selected.classList.remove('selected');
  selected = chip;
  if(selected) selected.classList.add('selected');
}

        '<div class="chips"></div>' +
      '</section>' +
    '</main>' +
    '<div class="controls">' +
      '<button class="btn primary" id="checkBtn">✔ Проверить</button>' +
      '<button class="btn ghostbtn" id="resetBtn">↺ Сбросить</button>' +
    '</div>';

  const bankEl = sec.querySelector('#bank');
  const cols = Array.from(sec.querySelectorAll('.col'));
  const banner = sec.querySelector('#wrongBanner');

  function makeChip(word){
    const d = document.createElement('div');
    d.className = 'chip';
    d.dataset.b = word.b;
    d.innerHTML = '<span class="w">' + escapeHtml(word.w) + '</span><span class="pl" style="display:none">→ ' + escapeHtml(word.plural) + '</span>';
    bindChip(d, {
      onTap: c => {
        if(c.classList.contains('locked')){ wiggle(c); sDeny(); return; }
        if(c.classList.contains('mark-wrong') && c.dataset.explained !== '1'){
          openSpellExplain(c.querySelector('.w').textContent, c);
          return;
        }
        if(c.parentElement === bankEl){
          if(selected === c){ setSelected(null); sBack(); }
          else { setSelected(c); sPick(); }
        } else {
          bankEl.appendChild(c);
          popIn(c);
          sBack();
          updateBar();
        }
      },
      onDrop: (e, chip) => {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const col = el ? el.closest('.col') : null;
        if(col) place(chip, col);
      },
      onHover: (x, y) => {
        const el = document.elementFromPoint(x, y);
        const col = el ? el.closest('.col') : null;
        if(col !== lastHover){
          cols.forEach(c => c.classList.remove('hover'));
          lastHover = col;
          if(col) col.classList.add('hover');
        }
      },
      onClearHover: () => {
        cols.forEach(c => c.classList.remove('hover'));
        lastHover = null;
      },
    });
    return d;
  }
  function place(chip, col){
    const target = col.querySelector('.chips');
    if(chip.parentElement === target) return;
    chip.classList.remove('mark-wrong');
    updateBanner();
    popIn(chip);
    target.appendChild(chip);
    setSelected(null);
    sDrop();
    updateBar();
  }
  /* клик по корзинке кладёт выбранное слово */
  cols.forEach(col => {
    col.addEventListener('click', () => {
      if(!selected) return;
      place(selected, col);
    });
  });
  function updateBar(){
    const placed = sec.querySelectorAll('.chips .chip').length;
    sec.querySelector('#placed').textContent = placed;
    cols.forEach(col => {
      col.querySelector('.count').textContent = col.querySelectorAll('.chips .chip').length;
    });
  }
  function updateBanner(){
    banner.hidden = !sec.querySelector('#bank .chip.mark-wrong');
  }
  sec.querySelector('#ruleBtn').addEventListener('click', () => {
    const idx = cur.stages.findIndex(s => s.key === 'rule');
    showStage(idx);
  });
  sec.querySelector('#soundBtn').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
  });
  sec.querySelector('#resetBtn').addEventListener('click', () => {
    cur.firstScore = null;
    sec.querySelectorAll('.chips .chip').forEach(c => c.remove());
    setSelected(null);
    bankEl.innerHTML = '';
    shuffle(L.dict.slice()).forEach(w => bankEl.appendChild(makeChip(w)));
    updateBar();
    updateStats();
    updateBanner();
  });

  function updateStats(){
    sec.querySelector('#checks').textContent = cur.checks;
    sec.querySelector('#mistakes').textContent = cur.mistakes;
  }
  sec.querySelector('#checkBtn').addEventListener('click', () => {
    const total = L.dict.length;
    const placedChips = Array.from(sec.querySelectorAll('.chips .chip'));
    if(placedChips.length < total){
      toast('Сначала разложи все слова по корзинкам!');
      sDeny();
      return;
    }
    cur.checks++;
    let wrong = 0;
    let correct = 0;
    placedChips.forEach(chip => {
      const col = chip.closest('.col');
      if(chip.dataset.b === col.dataset.b){
        correct++;
        chip.classList.add('locked');
        chip.querySelector('.pl').style.display = 'inline';
      } else {
        wrong++;
        chip.classList.add('wrong');
        delete chip.dataset.explained;
        const c = chip;
        setTimeout(() => {
          c.classList.remove('wrong');
          c.classList.add('mark-wrong');
          bankEl.appendChild(c);
          popIn(c);
          updateBanner();
          updateBar();
        }, 700);
      }
    });
    cur.mistakes += wrong;
    if(cur.firstScore === null) cur.firstScore = correct;
    updateStats();
    if(wrong === 0){
      finishTask(Math.round(cur.firstScore / total * 100));
    } else {
      sWrong();
      toast('Красные слова вернулись — нажми на них, чтобы разобраться!');
    }
  });
  /* красное слово → разбор правописания */
  let explainChipRef = null;
  function openSpellExplain(word, chip){
    explainChipRef = chip;
    const entry = L.dict.find(x => x.w === word);
    const info = wordInfo(entry.w);
    resetExplain();
    document.getElementById('exWord').innerHTML = hlTail(entry.w, info.endLen, info.group);
    document.getElementById('exRu').textContent = entry.ru;
    document.getElementById('exA1').innerHTML = '«' + escapeHtml(info.last) + '»';
    document.getElementById('exA2').innerHTML = escapeHtml(info.rule);
    document.getElementById('exA3').innerHTML = hlSpan('-' + info.group, info.group);
    document.getElementById('exPlural').innerHTML =
      escapeHtml(entry.w) + ' → ' + hlTail(entry.plural, info.group.length, info.group);
    explainEl.classList.add('show');
    speak(entry.w);
  }
  fillBankInit();
  function fillBankInit(){
    bankEl.innerHTML = '';
    shuffle(L.dict.slice()).forEach(w => bankEl.appendChild(makeChip(w)));
  }
  updateBar();
  updateStats();
  updateBanner();
}

/* ---------- задание типа «предложения» (уроки 2, 3…) ---------- */
function buildSentencesTask(sec, L){
  const ruCol = L.taskLang === 'ru';
  const instruct = L.instruct || (ruCol
    ? '📖 Напиши слова из правой колонки по-английски и заполни пропуски. Особое внимание — исключениям!'
    : '📖 Поставь слово из правой колонки в форму множественного числа и заполни пропуски. Особое внимание — исключениям!');
  sec.innerHTML =
    '<p class="task">' + instruct + '</p>' +
    '<div class="bar">' +
      '<span class="stat">Заполнено: <b id="filled">0</b>/' + L.sentences.length + '</span>' +
      '<span class="stat">Проверок: <b id="checks">0</b></span>' +
      '<span class="stat">Ошибок: <b id="mistakes">0</b></span>' +
      '<button class="btn ghostbtn small" id="ruleBtn">📖 Правило</button>' +
      '<button class="btn ghostbtn" id="soundBtn" title="Звук вкл/выкл">🔊</button>' +
    '</div>' +
    '<div id="wrongBanner" hidden>⚠️ Есть ошибки! Нажми на красное предложение — разберём, в чём дело.</div>' +
    (L.wordBank ? '<div class="wordbank">' + L.wordBank.map(w => '<span class="wordchip">' + escapeHtml(w) + '</span>').join('') + '</div>' : '') +
    '<div id="sentences"></div>' +
    '<div class="controls">' +
      '<button class="btn primary" id="checkBtn">✔ Проверить</button>' +
      '<button class="btn ghostbtn" id="resetBtn">↺ Сбросить</button>' +
    '</div>';

  const sentEl = sec.querySelector('#sentences');
  const banner = sec.querySelector('#wrongBanner');

  L.sentences.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'srow';
    row.dataset.n = i;
    /* parts: массив строк (готовый HTML) и null — на месте пропуска.
       Старый формат (pre/post) превращаем в такой же массив. */
    const parts = t.parts || (t.stem
      ? [(t.pre || '') + '<span class="stem">' + escapeHtml(t.stem) + '</span>@@' + (t.post || '')]
      : [escapeHtml(t.pre || '') + '@@' + escapeHtml(t.post || '')]);
    let inner = '<span class="num">' + (i + 1) + '.</span><span class="text">';
    let ii = 0;
    parts.forEach(p => {
      if(p === null){
        inner += '<input class="winput" data-i="' + ii + '" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false">';
        ii++;
      } else if(p.indexOf('@@') !== -1){
        inner += p.replace('@@', '<input class="winput" data-i="' + ii + '" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false">');
        ii++;
      } else {
        inner += p;
      }
    });
    inner += '</span>';
    const capText = ruCol ? t.ru : t.word;
    if(capText) inner += '<span class="wordcap" title="Послушать">' + escapeHtml(capText) + '</span>';
    row.innerHTML = inner;
    sentEl.appendChild(row);
    const capBtn = row.querySelector('.wordcap');
    if(capBtn) capBtn.addEventListener('click', function(){
      speak(t.word);
      sPick();
      this.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}], {duration:250});
    });
    row.addEventListener('click', e => {
      if(e.target.tagName === 'INPUT' || e.target.classList.contains('wordcap')) return;
      if(!row.classList.contains('row-wrong')) return;
      openRowExplain(t);
    });
  });

  function norm(v){ return v.trim().replace(/[\u2019'\u0301`]/g, '').replace(/[.,!?]+$/, '').toLowerCase(); }
  function updateFilled(){
    sec.querySelector('#filled').textContent =
      Array.from(sec.querySelectorAll('.winput')).filter(i => i.value.trim()).length;
  }
  function updateBanner(){
    banner.hidden = !sec.querySelector('.srow.row-wrong');
  }
  function updateStats(){
    sec.querySelector('#checks').textContent = cur.checks;
    sec.querySelector('#mistakes').textContent = cur.mistakes;
  }
  sec.querySelectorAll('.winput').forEach(i => i.addEventListener('input', updateFilled));
  sec.querySelector('#ruleBtn').addEventListener('click', () => {
    const idx = cur.stages.findIndex(s => s.key === 'rule');
    showStage(idx);
  });
  sec.querySelector('#soundBtn').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
  });
  sec.querySelector('#resetBtn').addEventListener('click', () => {
    cur.firstScore = null;
    sec.querySelectorAll('.winput').forEach(i => {
      i.value = '';
      i.disabled = false;
      i.classList.remove('ok', 'bad');
    });
    sec.querySelectorAll('.srow').forEach(r => {
      r.classList.remove('row-ok', 'row-wrong');
      delete r.dataset.reason;
    });
    updateFilled();
    updateStats();
    updateBanner();
  });
  sec.querySelector('#checkBtn').addEventListener('click', () => {
    const inputs = Array.from(sec.querySelectorAll('.winput'));
    if(!L.allowEmpty && inputs.some(i => !i.value.trim())){
      toast('Сначала заполни все пропуски!');
      sDeny();
      return;
    }
    cur.checks++;
    let wrong = 0;
    let correct = 0;
    sec.querySelectorAll('.srow').forEach(row => {
      const t = L.sentences[+row.dataset.n];
      const inputs = Array.from(row.querySelectorAll('.winput'));
      const exps = t.answers || [ruCol ? t.answer : (t.plural || t.answer)];
      row.classList.remove('row-wrong');
      delete row.dataset.reason;
      let rowOk = true;
      inputs.forEach((input, j) => {
        const okVal = norm(input.value) === norm(exps[j] || '');
        row.classList.remove('row-wrong');
        input.classList.remove('bad', 'ok');
        input.disabled = false;
        if(okVal){
          input.classList.add('ok');
          input.disabled = true;
        } else {
          rowOk = false;
          input.classList.add('bad');
        }
      });
      if(rowOk){
        correct++;
        row.classList.add('row-ok');
      } else {
        wrong++;
        row.classList.add('row-wrong');
        row.dataset.reason = 'spell';
      }
    });
    cur.mistakes += wrong;
    if(cur.firstScore === null) cur.firstScore = correct;
    updateStats();
    updateBanner();
    if(wrong === 0){
      finishTask(Math.round(cur.firstScore / L.sentences.length * 100));
    } else {
      sWrong();
      toast('Красные предложения — нажми на них, чтобы разобраться!');
    }
  });
  function openRowExplain(t){
    resetExplain();
    if(t.parts || t.note || t.pair){
      /* новый формат: записка + пара + модельное предложение */
      document.getElementById('exWord').innerHTML =
        t.pair || (t.word ? escapeHtml(t.word) + ' → ' + hlSpan(escapeHtml(t.answer || ''), 's') : '');
      document.getElementById('exRu').textContent = t.ru || '';
      document.getElementById('exNote').textContent = t.note || '';
      document.getElementById('exNote').hidden = !t.note;
      document.getElementById('exQa').hidden = true;
      document.getElementById('exNextBtn').hidden = true;
      document.getElementById('exOkBtn').hidden = false;
      if(t.model){
        const sen = document.getElementById('exSentence');
        sen.innerHTML = t.model;
        sen.hidden = false;
        sen.classList.add('rev');
      }
      explainEl.classList.add('show');
      if(t.word) speak(t.word);
      return;
    }
    /* уроки 2–3: пары word → plural */
    if(t.type !== 'regular'){
      document.getElementById('exWord').innerHTML =
        escapeHtml(t.word) + ' → ' + pluralHl(t.word, t.plural, t.type);
      document.getElementById('exRu').textContent = t.ru;
      let note = taskNote(t.type, t.word);
      if(ruCol && t.form){
        note += ' В этом предложении нужно ' +
          (t.form === 'singular' ? 'единственное число' : 'множественное число') +
          ' — «' + escapeHtml(t.answer) + '».';
      }
      document.getElementById('exNote').textContent = note;
      document.getElementById('exNote').hidden = false;
      document.getElementById('exQa').hidden = true;
      document.getElementById('exNextBtn').hidden = true;
      document.getElementById('exOkBtn').hidden = false;
    } else {
      const info = wordInfo(t.word);
      document.getElementById('exWord').innerHTML = hlTail(t.word, info.endLen, info.group);
      document.getElementById('exRu').textContent = t.ru;
      document.getElementById('exA1').innerHTML = '«' + escapeHtml(info.last) + '»';
      document.getElementById('exA2').innerHTML = escapeHtml(info.rule);
      document.getElementById('exA3').innerHTML = hlSpan('-' + info.group, info.group);
      document.getElementById('exPlural').innerHTML =
        escapeHtml(t.word) + ' → ' + pluralHl(t.word, t.plural, t.type);
    }
    if(ruCol){
      const sen = document.getElementById('exSentence');
      sen.innerHTML = escapeHtml(t.pre) + ' ' +
        hlSpan(escapeHtml(t.answer), 's') + escapeHtml(t.post);
      sen.hidden = false;
      sen.classList.add('rev');
    }
    explainEl.classList.add('show');
    speak(t.word);
  }
  updateFilled();
  updateStats();
  updateBanner();
}

/* выбор движка задания */
function buildTask(sec, L){
  if(L.taskType === 'baskets') buildBasketsTask(sec, L);
  else if(L.taskType === 'wordorder') buildWordOrderTask(sec, L);
  else if(L.taskType === 'choice') buildChoiceTask(sec, L);
  else if(L.taskType === 'pictures') buildPicturesTask(sec, L);
  else buildSentencesTask(sec, L);
}

/* ---------- задание типа «составь предложение» (урок 8) ---------- */
function buildWordOrderTask(sec, L){
  sec.innerHTML =
    '<p class="task">📖 Составь предложения: расставь слова в правильном порядке. Нажимай на слова по очереди!</p>' +
    '<div class="bar">' +
      '<span class="stat">Составлено: <b id="filled">0</b>/10</span>' +
      '<span class="stat">Проверок: <b id="checks">0</b></span>' +
      '<span class="stat">Ошибок: <b id="mistakes">0</b></span>' +
      '<button class="btn ghostbtn small" id="ruleBtn">📖 Правило</button>' +
      '<button class="btn ghostbtn" id="soundBtn" title="Звук вкл/выкл">🔊</button>' +
    '</div>' +
    '<div id="wrongBanner" hidden>⚠️ Есть ошибки! Нажми на красное предложение — разберём, в чём дело.</div>' +
    '<div id="sentences"></div>' +
    '<div class="controls">' +
      '<button class="btn primary" id="checkBtn">✔ Проверить</button>' +
      '<button class="btn ghostbtn" id="resetBtn">↺ Сбросить</button>' +
    '</div>';

  const sentEl = sec.querySelector('#sentences');
  const banner = sec.querySelector('#wrongBanner');

  L.sentences.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'wrow';
    row.dataset.n = i;
    row.innerHTML =
      '<span class="num">' + (i + 1) + '.</span>' +
      '<div class="wo-built"><span class="punct">' + (t.q ? '?' : '.') + '</span></div>' +
      '<div class="wo-pool">' +
        t.scrambled.map((w, j) => '<span class="tok" data-p="' + j + '">' + escapeHtml(w) + '</span>').join('') +
      '</div>';
    sentEl.appendChild(row);

    row.addEventListener('click', e => {
      const tok = e.target.closest('.tok');
      if(!tok){
        if(!row.classList.contains('row-wrong')) return;
        openWordOrderExplain(t);
        return;
      }
      const built = row.querySelector('.wo-built');
      const pool = row.querySelector('.wo-pool');
      if(tok.parentElement === pool){
        tok.classList.add('inpool');
        built.insertBefore(tok, built.querySelector('.punct'));
        sPick();
      } else {
        pool.appendChild(tok);
        tok.classList.remove('inpool');
        sBack();
      }
      updateFilled();
    });
  });

  function norm(w){ return w.replace(/[.?!,]+$/, '').toLowerCase(); }
  function updateFilled(){
    let full = 0;
    sec.querySelectorAll('.wrow').forEach(row => {
      const built = row.querySelectorAll('.wo-built .tok').length;
      if(built === row.querySelectorAll('.tok').length) full++;
    });
    sec.querySelector('#filled').textContent = full;
  }
  function updateBanner(){
    banner.hidden = !sec.querySelector('.wrow.row-wrong');
  }
  function updateStats(){
    sec.querySelector('#checks').textContent = cur.checks;
    sec.querySelector('#mistakes').textContent = cur.mistakes;
  }
  sec.querySelector('#ruleBtn').addEventListener('click', () => {
    const idx = cur.stages.findIndex(s => s.key === 'rule');
    showStage(idx);
  });
  sec.querySelector('#soundBtn').addEventListener('click', function(){
    muted = !muted;
    this.textContent = muted ? '🔇' : '🔊';
  });
  sec.querySelector('#resetBtn').addEventListener('click', () => {
    cur.firstScore = null;
    sec.querySelectorAll('.wrow').forEach(row => {
      const built = row.querySelectorAll('.wo-built .tok');
      const pool = row.querySelector('.wo-pool');
      built.forEach(tok => { tok.classList.remove('inpool'); pool.appendChild(tok); });
      /* вернуть исходный перемешанный порядок */
      const toks = Array.from(pool.querySelectorAll('.tok'));
      toks.sort((a, b) => (+a.dataset.p) - (+b.dataset.p));
      toks.forEach(tok => pool.appendChild(tok));
      row.classList.remove('row-ok', 'row-wrong');
      delete row.dataset.reason;
    });
    updateFilled();
    updateStats();
    updateBanner();
  });
  sec.querySelector('#checkBtn').addEventListener('click', () => {
    const incomplete = Array.from(sec.querySelectorAll('.wrow')).some(row => {
      const total = row.querySelectorAll('.tok').length;
      return row.querySelectorAll('.wo-built .tok').length < total;
    });
    if(incomplete){
      toast('Сначала собери все предложения!');
      sDeny();
      return;
    }
    cur.checks++;
    let wrong = 0;
    let correct = 0;
    sec.querySelectorAll('.wrow').forEach(row => {
      const t = L.sentences[+row.dataset.n];
      const built = Array.from(row.querySelectorAll('.wo-built .tok'))
        .map(tok => norm(tok.textContent));
      row.classList.remove('row-wrong');
      const ok = built.length === t.answer.length &&
        t.answer.every((w, j) => norm(w) === built[j]);
      if(ok){
        correct++;
        row.classList.add('row-ok');
      } else {
        wrong++;
        row.classList.add('row-wrong');
      }
    });
    cur.mistakes += wrong;
    if(cur.firstScore === null) cur.firstScore = correct;
    updateStats();
    updateBanner();
    if(wrong === 0){
      finishTask(Math.round(cur.firstScore / L.sentences.length * 100));
    } else {
      sWrong();
      toast('Красные предложения — нажми на них, чтобы увидеть правильный порядок!');
    }
  });
  function openWordOrderExplain(t){
    resetExplain();
    document.getElementById('exWord').innerHTML = hlSpan(escapeHtml(t.answer.join(' ')), 's') + (t.q ? '?' : '.');
    document.getElementById('exNote').textContent = t.note || '';
    document.getElementById('exNote').hidden = false;
    document.getElementById('exQa').hidden = true;
    document.getElementById('exNextBtn').hidden = true;
    document.getElementById('exOkBtn').hidden = false;
    explainEl.classList.add('show');
    speak(t.answer.join(' '));
  }
  updateFilled();
  updateStats();
  updateBanner();
}

    updateStats();
    updateBanner();
    if(wrong === 0){
      finishTask(Math.round(cur.firstScore / L.sentences.length * 100));
    } else {
      sWrong();
      toast('Красные предложения — нажми на них, чтобы разобраться!');
    }
  });
  function openChoiceExplain(t){
    resetExplain();
    document.getElementById('exWord').innerHTML = hlSpan(escapeHtml(t.answer), 's');
    document.getElementById('exNote').textContent = t.note || '';
    document.getElementById('exNote').hidden = false;
    document.getElementById('exQa').hidden = true;
    document.getElementById('exNextBtn').hidden = true;
    document.getElementById('exOkBtn').hidden = false;
    const sen = document.getElementById('exSentence');
    sen.innerHTML = escapeHtml(t.pre) + ' <b class="hl hl-es">' + escapeHtml(t.answer) + '</b>' + escapeHtml(t.post);
    sen.hidden = false;
    sen.classList.add('rev');
    explainEl.classList.add('show');
    speak(t.answer.replace(/ it$/i, ' it').replace(/ they$/i, ' they'));
  }
  updateFilled();
  updateStats();
  updateBanner();
}

/* =====================================================================
   завершение задания: сдал / не сдал
===================================================================== */
function finishTask(pct){
  const best = Math.max(bestOf(cur.L.n), pct);
  store.best[cur.L.n] = best;
  saveStore();
  const ok = pct >= PASS_PCT;
  document.getElementById('winIcon').textContent = ok ? '🏆' : '💪';
  document.getElementById('winTitle').textContent = ok
    ? 'Урок сдан! ' + pct + '%'
    : 'Почти! Результат ' + pct + '%';
  document.getElementById('winTitle').className = ok ? '' : 'fail';
  document.getElementById('winStats').textContent = ok
    ? 'Для сдачи нужно ' + PASS_PCT + '% — ты справился' + (ok ? '' : '') + '! Следующий урок открыт.'
    : 'Для сдачи нужно ' + PASS_PCT + '%. Пройди задание ещё раз — всё получится!';
  document.getElementById('winRetryBtn').hidden = !ok ? false : false;
  if(ok) sWin(); else sWrong();
  if(ok) confetti();
  document.getElementById('win').classList.add('show');
}
document.getElementById('winMapBtn').addEventListener('click', () => {
  document.getElementById('win').classList.remove('show');
  backToMap();
});
document.getElementById('winRetryBtn').addEventListener('click', () => {
  document.getElementById('win').classList.remove('show');
  const n = cur.L.n;
  openLesson(n);
});

/* =====================================================================
   разбор ошибки (модалка)
===================================================================== */
const explainEl = document.getElementById('explain');
function resetExplain(){
  document.getElementById('exNote').hidden = true;
  document.getElementById('exQa').hidden = false;
  document.getElementById('exSentence').hidden = true;
  document.getElementById('exSentence').classList.remove('rev');
  document.getElementById('exPlural').style.display = '';
  document.getElementById('exPlural').classList.remove('rev');
  ['exA1','exA2','exA3'].forEach(id => document.getElementById(id).classList.remove('rev'));
  explainStep = 0;
  document.getElementById('exNextBtn').hidden = false;
  document.getElementById('exOkBtn').hidden = true;
}
let explainStep = 0;
document.getElementById('exNextBtn').addEventListener('click', () => {
  explainStep++;
  const answers = ['exA1','exA2','exA3'];
  if(explainStep <= 3){
    document.getElementById(answers[explainStep - 1]).classList.add('rev');
    sPick();
  }
  if(explainStep === 3){
    document.getElementById('exPlural').classList.add('rev');
    document.getElementById('exNextBtn').hidden = true;
    document.getElementById('exOkBtn').hidden = false;
    sDrop();
  }
});
document.getElementById('exOkBtn').addEventListener('click', () => {
  explainEl.classList.remove('show');
  if(explainChipRef){ explainChipRef.dataset.explained = '1'; explainChipRef = null; }
  sBack();
});

/* ---------- конфетти ---------- */
function confetti(){
  const cont = document.getElementById('confetti');
  const colors = ['#f59e0b','#10b981','#3b82f6','#ef4444','#8b5cf6','#f472b6'];
  for(let i = 0; i < 90; i++){
    const p = document.createElement('div');
    p.className = 'cf';
    const size = 6 + Math.random() * 8;
    p.style.background = colors[i % colors.length];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.width = size + 'px';
    p.style.height = size * (0.5 + Math.random()) + 'px';
    cont.appendChild(p);
    const anim = p.animate([
      {transform:'translateY(-40px) rotate(0deg)'},
      {transform:'translateY(' + (window.innerHeight + 80) + 'px) rotate(' + (360 + Math.random() * 720) + 'deg)'}
    ], {
      duration: 2200 + Math.random() * 1800,
      delay: Math.random() * 600,
      easing: 'cubic-bezier(.2,.6,.4,1)'
    });
    anim.onfinish = () => p.remove();
  }
}

/* =====================================================================
   старт
===================================================================== */
applyTeacherUI();
