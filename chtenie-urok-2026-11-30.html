<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{margin:0;font-family:Verdana,"Segoe UI",Arial,sans-serif;background:#eef4fb;color:#16222f;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:3px solid #d5e2f2;flex-wrap:wrap}
#tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1}
#tabs button{font-size:19px;font-weight:bold;padding:9px 16px;border-radius:12px;border:2px solid #c9d9ec;background:#fff;cursor:pointer;color:#24425f}
#tabs button.active{background:#2f6fd6;border-color:#2f6fd6;color:#fff}
#stars{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:bold;background:#fff8e1;border:2px solid #f1d27a;border-radius:12px;padding:6px 10px}
#stars button{font-size:18px;font-weight:bold;border:none;border-radius:8px;padding:6px 12px;cursor:pointer}
#addStar{background:#f5b301;color:#fff}
#resetStars{background:#ececec;color:#666}
main{flex:1;min-height:0}
main>section{display:none;height:100%;overflow:auto;padding:16px 20px}
main>section.active{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.cnt{font-size:22px;color:#41546b;font-weight:bold}
.word{font-weight:bold;line-height:1.05}
#wBig{font-size:clamp(64px,14vw,210px);min-height:1.1em}
#wBig.target{color:#c2410c}
.badge{font-size:20px;font-weight:bold;color:#c2410c;min-height:26px}
.pic{line-height:1.15;min-height:1.25em}
.pic img{height:clamp(110px,20vw,220px);border-radius:14px;border:3px solid #d5e2f2;background:#fff}
.pic span{font-size:clamp(70px,15vw,190px)}
.btnrow{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.bigbtn{font-size:24px;padding:14px 30px;border-radius:14px;border:none;background:#2f6fd6;color:#fff;font-weight:bold;cursor:pointer}
.bigbtn:disabled{background:#aec3dd;cursor:default}
.ghostbtn{font-size:20px;padding:12px 20px;border-radius:12px;border:2px solid #c9d9ec;background:#fff;cursor:pointer;color:#24425f}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:110px}
.tile{font-size:clamp(38px,6.5vw,84px);width:1.55em;height:1.55em;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid #9db7dd;border-radius:14px;cursor:pointer;font-weight:bold}
.tile:hover{border-color:#2f6fd6;transform:translateY(-2px)}
.slots{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:110px}
.slot{font-size:clamp(38px,6.5vw,84px);width:1.55em;height:1.55em;display:flex;align-items:center;justify-content:center;border-radius:14px;border:3px dashed #b9c8da;background:#fbfdff;cursor:pointer;font-weight:bold}
.slot.filled{border-style:solid;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.msg{font-size:32px;font-weight:bold;color:#15803d;min-height:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;width:100%;max-width:1500px}
.chip{font-size:clamp(26px,3.6vw,46px);padding:12px 4px;text-align:center;background:#fff;border:3px solid #c9d9ec;border-radius:14px;cursor:pointer;font-weight:bold}
.chip:hover{border-color:#2f6fd6}
.chip.read{background:#dcfce7;border-color:#16a34a;color:#166534}
.subbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.subbtns button{font-size:20px;font-weight:bold;padding:10px 18px;border-radius:12px;border:2px solid #c9d9ec;background:#fff;cursor:pointer;color:#24425f}

#pzEmoji{font-size:clamp(80px,16vw,200px);line-height:1.1}

.label{font-size:18px;color:#5c6f83}

'use strict';
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function el(id){return document.getElementById(id);}

var stars=0;
try{stars=parseInt(localStorage.getItem('misarStars')||'0',10)||0;}catch(e){}
function drawStars(){el('starCount').textContent=stars;}
function saveStars(){try{localStorage.setItem('misarStars',String(stars));}catch(e){}drawStars();}
el('addStar').onclick=function(){stars++;saveStars();};
el('resetStars').onclick=function(){stars=0;saveStars();};
drawStars();

var curTab='t1';
var tabBtns=document.querySelectorAll('#tabs button');
for(var tb=0;tb<tabBtns.length;tb++){
  (function(b){b.onclick=function(){showTab(b.getAttribute('data-tab'));};})(tabBtns[tb]);
}
function showTab(id){
  curTab=id;
  for(var k=0;k<tabBtns.length;k++){
    tabBtns[k].className=(tabBtns[k].getAttribute('data-tab')===id)?'active':'';
  }
  var secs=document.querySelectorAll('main>section');
  for(var m=0;m<secs.length;m++){
    secs[m].className=(secs[m].id===id)?'active':'';
  }
  if(document.activeElement&&document.activeElement.blur){document.activeElement.blur();}
}

function renderTable(){
  var arr=shuffle(SYL).slice(0,20);
  var g=el('slogGrid');
  g.innerHTML='';
  for(var i=0;i<arr.length;i++){
    (function(s){
      var d=document.createElement('div');
      d.className='chip';
      d.textContent=s;
      d.onclick=function(){d.className=(d.className==='chip')?'chip read':'chip';};
      g.appendChild(d);
    })(arr[i]);
  }
}
el('subShuffle').onclick=renderTable;

var seq2=[],ti2=0,rev2=false;
function buildSeq2(){
  seq2=[];
  var ts=shuffle(TRIPLETS);
  for(var i=0;i<ts.length;i++){seq2=seq2.concat(ts[i]);}
}
function showWord2(){
  rev2=false;
  var c=seq2[ti2];
  el('wBig').textContent=c.w;
  el('wBig').className=c.t?'word target':'word';
  el('wBadge').textContent=c.t?'новое слово ⭐':'';
  el('wPic').textContent='';
  el('wNext').textContent='Показать картинку 🖼';
  el('wCnt').textContent=(ti2+1)+' / '+seq2.length;
}
el('wNext').onclick=function(){
  if(!rev2){
    rev2=true;
    var c=seq2[ti2];
    var b64=IMGS[c.w];
    if(b64){el('wPic').innerHTML='<img alt="">';el('wPic').firstChild.src=b64;}
    else if(c.e){el('wPic').innerHTML='<span>'+c.e+'</span>';}
    else{el('wPic').textContent='';}
    el('wNext').textContent='Дальше →';
  }else{
    ti2++;if(ti2>=seq2.length){ti2=0;buildSeq2();}
    showWord2();
  }
};
el('wBack').onclick=function(){if(ti2>0){ti2--;showWord2();}};

var b5=[],i5=0,placed5=[],order5=[];
function newBatch5(){var sh=shuffle(WORDS9);b5=sh.slice(0,5);i5=0;load5();}
function load5(){
  placed5=[];
  var c=b5[i5];
  var ident5=c.map(function(_,k){return k;});
  order5=shuffle(ident5);
  var guard5=0;
  while(order5.join()===ident5.join()&&guard5<20){order5=shuffle(ident5);guard5++;}
  el('sCnt').textContent='Слово '+(i5+1)+' из 5';
  el('sMsg').textContent='';
  el('sPicBox').textContent='';
  el('sPic').disabled=true;
  var nb=el('sNext');
  nb.disabled=true;
  nb.textContent=(i5===4)?'Ещё? Новые 5 слов 🔄':'Следующее слово →';
  render5();
}
function render5(){
  var syl=b5[i5];
  var remaining=order5.filter(function(k){return placed5.indexOf(k)<0;});
  var tEl=el('sTiles');
  tEl.innerHTML='';
  for(var i=0;i<remaining.length;i++){
    (function(k){
      var d=document.createElement('div');
      d.className='tile';
      d.style.background=SLOT_COLORS[k];
      d.style.borderColor=SLOT_COLORS[k];
      d.style.color='#fff';
      d.style.textShadow='0 1px 2px rgba(0,0,0,.35)';
      d.textContent=syl[k];
      d.onclick=function(){if(placed5.length<syl.length){placed5.push(k);render5();}};
      tEl.appendChild(d);
    })(remaining[i]);
  }
  var slEl=el('sSlots');
  slEl.innerHTML='';
  for(var j=0;j<syl.length;j++){
    (function(pos){
      var d=document.createElement('div');
      d.style.borderColor=SLOT_COLORS[pos];
      if(pos<placed5.length){
        d.className='slot filled';
        d.style.background=SLOT_COLORS[pos];
        d.textContent=syl[placed5[pos]];
        d.onclick=function(){placed5.splice(pos,1);render5();};
      }else{
        d.className='slot';
        d.style.background=SLOT_COLORS[pos]+'55';
        d.style.borderStyle='solid';
      }
      slEl.appendChild(d);
    })(j);
  }
  if(placed5.length===syl.length){
    el('sMsg').textContent='✅ Собрали! Читай слово!';
    el('sNext').disabled=false;
  }
}
el('sNext').onclick=function(){i5++;if(i5>4){newBatch5();}else{load5();}};
