function shuffleArray(array) {
  const shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function getCaseForm(word, declension, caseName) {
  const endings = {
    1: {
      "Р.п": { а: "ы", я: "и" },
      "Д.п": { а: "е", я: "е" },
      "В.п": { а: "у", я: "ю" },
      "Т.п": { а: "ой", я: "ей" },
      "П.п": { а: "е", я: "е" }
    },
    2: {
      "Р.п": { о: "а", е: "я", "∅": "а" },
      "Д.п": { о: "у", е: "ю", "∅": "у" },
      "В.п": { о: "о", е: "е", "∅": "" },
      "Т.п": { о: "ом", е: "ем", "∅": "ом" },
      "П.п": { о: "е", е: "е", "∅": "е" }
    },
    3: {
      "Р.п": { ь: "и" },
      "Д.п": { ь: "и" },
      "В.п": { ь: "∅" },
      "Т.п": { ь: "ью" },
      "П.п": { ь: "и" }
    }
  };
  
  const lastChar = word.slice(-1);
  const ending = endings[declension]?.[caseName]?.[lastChar];
  
  if (ending === undefined) return word;
  if (ending === "∅") return word.slice(0, -1);
  return word.slice(0, -1) + ending;
}

function generateRound1Tasks() {
  const tasks = [];
  const nouns = shuffleArray(wordDatabase.nouns).slice(0, 10);
  nouns.forEach(n => {
    tasks.push({ word: n.word, correct: true, hint: `${n.word} — это предмет. Отвечает на вопрос КТО? или ЧТО?` });
  });
  const others = [
    ...shuffleArray(wordDatabase.adjectives).slice(0, 2),
    ...shuffleArray(wordDatabase.verbs).slice(0, 2),
    ...shuffleArray(wordDatabase.pronouns).slice(0, 2),
    ...shuffleArray(wordDatabase.prepositions).slice(0, 2),
    ...shuffleArray(wordDatabase.conjunctions).slice(0, 2),
    ...shuffleArray(wordDatabase.adverbs).slice(0, 2)
  ];
  others.forEach(w => {
    let question = "";
    if (w.type === "adjective") question = "КАКОЙ?";
    else if (w.type === "verb") question = "ЧТО ДЕЛАЕТ?";
    else if (w.type === "pronoun") question = "указывает на предмет";
    else if (w.type === "preposition") question = "служит для связи слов";
    else if (w.type === "conjunction") question = "соединяет слова";
    else if (w.type === "adverb") question = "КАК?";
    tasks.push({ word: w.word, correct: false, hint: `${w.word} — не существительное. Отвечает на вопрос ${question}.` });
  });
  return shuffleArray(tasks);
}

function generateRound2Tasks() {
  const nouns = shuffleArray(wordDatabase.nouns.filter(n => n.number === "sg")).slice(0, 12);
  return nouns.map(n => ({
    word: n.word,
    correct: n.gender,
    hint: `${n.gender === 'm' ? 'ОН' : n.gender === 'f' ? 'ОНА' : 'ОНО'} мой/моя/моё — ${n.word}. ${n.gender === 'm' ? 'Мужской' : n.gender === 'f' ? 'Женский' : 'Средний'} род.`
  }));
}

function generateRound3Tasks() {
  const nouns = shuffleArray(wordDatabase.nouns).slice(0, 12);
  return nouns.map(n => ({
    word: n.word,
    correct: n.number,
    onlySpecial: n.onlySingular || n.onlyPlural,
    hint: n.number === 'sg' ? `Один ${n.word} — единственное число.` : `Много ${n.word} — множественное число.`
  }));
}

function generateRound4Tasks() {
  const cases = [
    { name: "Р.п", question: "кого? чего?", helper: "нет" },
    { name: "Д.п", question: "кому? чему?", helper: "дать" },
    { name: "В.п", question: "кого? что?", helper: "вижу" },
    { name: "Т.п", question: "кем? чем?", helper: "доволен" },
    { name: "П.п", question: "о ком? о чём?", helper: "думаю" }
  ];
  
  const nouns = shuffleArray(wordDatabase.nouns.filter(n => n.number === "sg" && n.declension > 0)).slice(0, 12);
  
  return nouns.map((n, i) => {
    const c = cases[i % cases.length];
    const declinedWord = getCaseForm(n.word, n.declension, c.name);
    return {
      phrase: `(${c.helper}) ${declinedWord}`,
      correct: c.name,
      hint: `(${c.helper.toUpperCase()}) ${c.question} — ${declinedWord}. ${c.name}`
    };
  });
}

function generateRound5Tasks() {
  const nouns = shuffleArray(wordDatabase.nouns.filter(n => n.number === "sg" && n.declension > 0)).slice(0, 12);
  return nouns.map(n => ({
    word: n.word,
    correct: String(n.declension),
    hint: getDeclensionHint(n)
  }));
}

function getDeclensionHint(noun) {
  if (noun.declension === 1) {
    return `${noun.word} — ${noun.gender === 'f' ? 'женский' : 'мужской'} род, оканчивается на -А/-Я. I склонение.`;
  } else if (noun.declension === 2) {
    return `${noun.word} — ${noun.gender === 'm' ? 'мужской' : 'средний'} род, ${noun.word.endsWith('о') || noun.word.endsWith('е') ? 'оканчивается на -О/-Е' : 'нулевое окончание'}. II склонение.`;
  } else {
    return `${noun.word} — женский род, оканчивается на -Ь. III склонение.`;
  }
}

function generateRound6Tasks() {
  return shuffleArray(endingWords).slice(0, 15);
}

function checkAnswer(answer, correct) {
  const feedback = document.getElementById('feedback');
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);
  
  totalTasks++;
  
  if (String(answer) === String(correct)) {
    feedback.className = 'feedback show success';
    feedback.innerHTML = '✓ ВЕРНО! ' + currentRoundTasks[currentTask].hint;
    score += 10;
    totalCorrect++;
  } else {
    feedback.className = 'feedback show error';
    feedback.innerHTML = '✗ ОШИБКА. ' + currentRoundTasks[currentTask].hint;
  }
  
  document.getElementById('score').textContent = score;
  
  setTimeout(() => {
    currentTask++;
    if (currentTask >= currentRoundTasks.length) {
      currentTask = 0;
      currentRoundTasks = [];
      currentRound++;
      if (currentRound >= rounds.length) {
        showFinalScreen();
        return;
      }
    }
    renderRound();
  }, 2500);
}

function checkEnding() {
  const input = document.getElementById('endingInput');
  const answer = input.value.trim().toLowerCase();
  const correct = currentRoundTasks[currentTask].answer.toLowerCase();
  
  const feedback = document.getElementById('feedback');
  totalTasks++;
  
  if (answer === correct) {
    feedback.className = 'feedback show success';
    feedback.innerHTML = `✓ ВЕРНО! Правильный ответ: <b>${correct}</b>. ${currentRoundTasks[currentTask].hint}`;
    score += 10;
    totalCorrect++;
  } else {
    feedback.className = 'feedback show error';
    feedback.innerHTML = `✗ ОШИБКА. Правильный ответ: <b>${correct}</b>. ${currentRoundTasks[currentTask].hint}`;
  }
  
  input.disabled = true;
  document.getElementById('score').textContent = score;
  
  setTimeout(() => {
    currentTask++;
    if (currentTask >= currentRoundTasks.length) {
      currentTask = 0;
      currentRoundTasks = [];
      currentRound++;
      if (currentRound >= rounds.length) {
        showFinalScreen();
        return;
      }
    }
    renderRound();
  }, 3000);
}

function showFinalScreen() {
  const percent = Math.round((totalCorrect / totalTasks) * 100);
  let rank, rankTitle;
  
  if (percent >= 90) { rank = "S"; rankTitle = "ЭЛИТНЫЙ СПЕЦИАЛИСТ"; }
  else if (percent >= 75) { rank = "A"; rankTitle = "СТАРШИЙ БОЕЦ"; }
  else if (percent >= 60) { rank = "B"; rankTitle = "БОЕЦ"; }
  else if (percent >= 40) { rank = "C"; rankTitle = "НОВИЧОК"; }
  else { rank = "D"; rankTitle = "СТАЖЁР"; }
  
  document.getElementById('content').innerHTML = `
    <div class="final-screen">
      <div class="final-rank">РАНГ ${rank}</div>
      <div class="final-title">${rankTitle}</div>
      <div class="final-stats">
        <div class="final-stat">
          <div class="final-stat-value">${totalCorrect}</div>
          <div class="final-stat-label">ВЕРНЫХ ОТВЕТОВ</div>
        </div>
        <div class="final-stat">
          <div class="final-stat-value">${totalTasks}</div>
          <div class="final-stat-label">ВСЕГО ЗАДАНИЙ</div>
        </div>
        <div class="final-stat">
          <div class="final-stat-value">${percent}%</div>
          <div class="final-stat-label">ТОЧНОСТЬ</div>
        </div>
      </div>
      <div style="text-align: left; padding: 20px; background: #0f0f0f; border: 1px solid #444; border-radius: 3px; margin-bottom: 20px;">
        <div style="color: #ff8c00; margin-bottom: 10px; font-size: 14px;">ИТОГОВАЯ СВОДКА ПО ТЕМЕ:</div>
        <div style="color: #ccc; font-size: 13px; line-height: 1.8;">
          ✓ <b>Имя существительное</b> — часть речи, обозначает предмет, вопросы КТО? ЧТО?<br>
          ✓ <b>Род:</b> мужской (он), женский (она), средний (оно)<br>
          ✓ <b>Число:</b> единственное и множественное<br>
          ✓ <b>6 падежей:</b> И.п., Р.п., Д.п., В.п., Т.п., П.п.<br>
          ✓ <b>3 склонения:</b> I (ж.р. на -А/-Я, м.р. на -А/-Я), II (м.р. с 0 оконч., ср.р. на -О/-Е), III (ж.р. на -Ь)<br>
          ✓ <b>Безударные окончания</b> проверяются через определение склонения и падежа
        </div>
      </div>
      <button class="btn" onclick="restartMission()">ПОВТОРИТЬ МИССИЮ</button>
    </div>
  `;
  
  for (let i = 1; i <= 6; i++) {
    document.getElementById('dot' + i).classList.remove('active');
    document.getElementById('dot' + i).classList.add('completed');
  }
}

function restartMission() {
  currentRound = 0;
  currentTask = 0;
  score = 0;
  totalCorrect = 0;
  totalTasks = 0;
  currentRoundTasks = [];
  document.getElementById('score').textContent = 0;
  renderRound();
}

// Функция открытия меню выбора раунда
function openRoundMenu() {
  const modal = document.getElementById('roundMenu');
  const grid = document.getElementById('roundSelectGrid');
  
  const roundNames = [
    "ИДЕНТИФИКАЦИЯ",
    "РОД",
    "ЧИСЛО",
    "ПАДЕЖ",
    "СКЛОНЕНИЕ",
    "ОКОНЧАНИЯ"
  ];
  
  grid.innerHTML = '';
  rounds.forEach((round, index) => {
    const btn = document.createElement('button');
    btn.className = 'round-select-btn';
    if (index < currentRound) btn.classList.add('completed');
    if (index === currentRound) btn.classList.add('current');
    btn.innerHTML = `
      <span class="round-num">${index + 1}</span>
      <span class="round-name">${roundNames[index]}</span>
    `;
    btn.onclick = () => {
      goToRound(index);
      closeRoundMenu();
    };
    grid.appendChild(btn);
  });
  
  modal.classList.add('show');
}

// Функция закрытия меню
function closeRoundMenu() {
  document.getElementById('roundMenu').classList.remove('show');
}

// Функция перехода к конкретному раунду
function goToRound(roundIndex) {
  currentRound = roundIndex;
  currentTask = 0;
  currentRoundTasks = [];
  renderRound();
}

// Функция пропуска раунда
function skipRound() {
  currentTask = 0;
  currentRoundTasks = [];
  currentRound++;
  if (currentRound >= rounds.length) {
    showFinalScreen();
  } else {
    renderRound();
  }
}

// Закрытие модального окна при клике вне его
document.getElementById('roundMenu').addEventListener('click', function(e) {
  if (e.target === this) {
    closeRoundMenu();
  }
});
