<!--
Интерактивная игра «МАГАЗИН + КАФЕ» (дизайн по мотивам лабиринта с сундуком).
- УРОВЕНЬ 1 — МАГАЗИН: у игрока 100 р. На витрине 12 игрушек, цены у всех РАЗНЫЕ,
  всегда ДВУЗНАЧНЫЕ и «неровные». Клик по игрушке -> вопрос кассира-мишки:
  сколько сдачи? (деньги − цена, для 100 р. всегда с переходом через десяток).
  Игрушка попадает в пакет 🛍, покупать можно несколько, пока хватает денег.
  Кнопка «Идти в кафе» появляется после первой покупки.
- УРОВЕНЬ 2 — КАФЕ «Сладкоежка»: 6 напитков и 12 вкусняшек, цены тоже двузначные
  «неровные». ОБЯЗАТЕЛЬНО купить и напиток, и вкусняшку: сначала считаем сумму
  (сложение с переходом через десяток), потом оплату и сдачу.
  Кнопка «👩 Попросить у мамы»: если денег не хватает, мама просит ПОСЧИТАТЬ,
  сколько рублей не хватает (вычитание), и добавляет ровно эту сумму.
- За каждый верный ответ — звёздочка (общая копилка sashaStars, как в других играх).
- После двух неверных попыток появляется подсказка (десятки/единицы, пучок).
- Куплены игрушка(-ки), напиток и вкусняшка -> чек, фейерверк, конфетти, фанфары.
- Прогресс сохраняется (localStorage). Кнопка ↺ — новая игра с новыми ценами.
-->

<script>
'use strict';
/* ================= данные ================= */
var DKEY='sasha2-shop-v1';
var PAL=['#7c5cff','#2f8fff','#ff9f1c','#ff5da2','#12b5cb','#97b900'];
var PRAISE=['Молодец! 🎉','Отлично! ⭐','Супер! 💪','Здорово! 🌟','Умница! 🏆','В точку! ✨'];
var ENC=['Подумай ещё! 🤔','Почти-почти! 💫','Попробуй снова! 🙂','Ещё разок, внимательно! 🔍'];
var BUY_THANKS=['Носи на здоровье!','Отличный выбор!','Спасибо за покупку!','Прекрасная игрушка!'];
var BEAR_DEF='Здравствуйте! Выбирайте игрушку! 🧸';
var FOX_DEF='Выбери напиток и вкусняшку! ☕🧁';
var TOYS=[{e:'🧸',n:'Мишка'},{e:'🪆',n:'Матрёшка'},{e:'🚂',n:'Паровозик'},{e:'🦄',n:'Единорог'},
 {e:'🚗',n:'Машинка'},{e:'🐰',n:'Зайка'},{e:'🎨',n:'Краски'},{e:'🪀',n:'Йо-йо'},
 {e:'⚽',n:'Мяч'},{e:'🧩',n:'Пазл'},{e:'🪁',n:'Воздушный змей'},{e:'🎀',n:'Заколки'}];
var DRINKS=[{e:'🍋',n:'Лимонад'},{e:'🥤',n:'Апельсиновый сок'},{e:'☕',n:'Какао'},
 {e:'🥛',n:'Молочный коктейль'},{e:'🍹',n:'Тропический коктейль'},{e:'🍒',n:'Вишнёвый морс'}];
var TREATS=[{e:'🧁',n:'Капкейк'},{e:'🍩',n:'Пончик'},{e:'🍪',n:'Печенье'},{e:'🍰',n:'Торт'},
 {e:'🍫',n:'Шоколадка'},{e:'🍭',n:'Леденец'},{e:'🍦',n:'Мороженое'},{e:'🥐',n:'Круассан'},
 {e:'🍓',n:'Клубника'},{e:'🍬',n:'Конфеты'},{e:'🧇',n:'Вафля'},{e:'🥞',n:'Блинчик'}];

/* ================= утилиты ================= */
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[(Math.random()*arr.length)|0];}
var stageEl=document.getElementById('stage'),curScale=1;
function fit(){
  curScale=Math.min(window.innerWidth/1280,window.innerHeight/820);
  stageEl.style.transform='translate(-50%,-50%) scale('+curScale+')';
}
function toStage(el){
  var r=el.getBoundingClientRect(),s=stageEl.getBoundingClientRect();
  return {x:(r.left+r.width/2-s.left)/curScale,y:(r.top+r.height/2-s.top)/curScale};
}
/* цены: двузначные, «неровные», у всех разные */
function genPrices(n,lo,hi,used,units){
  var out=[],guard=0;
  while(out.length<n&&guard++<5000){
    var p=rnd(lo,hi);
    if(p%10===0)continue;
    if(units&&units.indexOf(p%10)<0)continue;
    if(used[p])continue;
    used[p]=1;out.push(p);
  }
  return out;
}

/* ================= состояние ================= */
var S=null;
function newState(){
  var used={},i;
  /* сначала узкие пулы (напитки, вкусняшки), потом игрушки — чтобы цен хватило всем */
  var dp=genPrices(6,16,38,used,[6,7,8]);
  var xp=genPrices(12,14,49,used,[4,5,6,7,8,9]);
  var tp=genPrices(12,12,89,used,null);
  var toys=[],drinks=[],treats=[];
  for(i=0;i<12;i++)toys.push({e:TOYS[i].e,n:TOYS[i].n,p:tp[i],sold:false});
  for(i=0;i<6;i++)drinks.push({e:DRINKS[i].e,n:DRINKS[i].n,p:dp[i]});
  for(i=0;i<12;i++)treats.push({e:TREATS[i].e,n:TREATS[i].n,p:xp[i]});
  return {scene:'shop',money:100,toys:toys,drinks:drinks,treats:treats,bag:[],
    drink:-1,treat:-1,total:0,totalKnown:false,momGiven:0,stars:0,muted:false,done:false};
}

/* ================= подсказки ================= */
function hintAdd(a,b){
  var tA=a-a%10,tB=b-b%10,uA=a%10,uB=b%10,u=uA+uB,tS=tA+tB,ans=a+b;
  if(u>=10)return 'Десятки: '+tA+' + '+tB+' = '+tS+'; единицы: '+uA+' + '+uB+' = '+u+
    ' = 10 и '+(u-10)+'. Пучок переходит к десяткам: '+tS+' + 10 + '+(u-10)+' = '+ans;
  return 'Десятки: '+tA+' + '+tB+' = '+tS+'; единицы: '+uA+' + '+uB+' = '+u+
    '. Ответ: '+tS+' + '+u+' = '+ans;
}
function hintSub(a,b){
  var ans=a-b,tA=a-a%10,uA=a%10,tB=b-b%10,uB=b%10;
  if(a===100)return '100 — это 90 и 10: единицы: 10 − '+uB+' = '+(10-uB)+
    '; десятки: 90 − '+tB+' = '+(90-tB)+'. Ответ: '+(90-tB)+' + '+(10-uB)+' = '+ans;
  if(uA>=uB)return 'Десятки: '+tA+' − '+tB+' = '+(tA-tB)+'; единицы: '+uA+' − '+uB+
    ' = '+(uA-uB)+'. Ответ: '+(tA-tB)+' + '+(uA-uB)+' = '+ans;
  var u2=uA+10-uB,tS=tA-10-tB;
  return 'Единиц не хватает — открываем пучок: '+(uA+10)+' − '+uB+' = '+u2+
    '; десятков стало меньше: '+(tA-10)+' − '+tB+' = '+tS+'. Ответ: '+tS+' + '+u2+' = '+ans;
}

/* ================= звук ================= */
var AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(fr,at,dur,type,vol){
  if(S&&S.muted)return;
  var c=ac(); if(!c)return;
  var t=c.currentTime+(at||0);
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine'; o.frequency.value=fr;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);
  o.start(t);o.stop(t+dur+0.05);
}
function sClick(){tone(640,0,.06,'sine',.06);}
function sType(){tone(500+Math.random()*300,0,.04,'sine',.05);}
function sCorrect(){tone(523,0,.14,'sine',.14);tone(659,.09,.14,'sine',.14);tone(784,.18,.22,'sine',.15);}
function sWrong(){tone(200,0,.18,'triangle',.1);tone(150,.1,.22,'triangle',.1);}
function sCoins(){for(var i=0;i<7;i++)tone(1400+Math.random()*1300,i*.09,.1,'sine',.08);}
function sFanfare(){
  var m=[[523,0,.16],[523,.16,.16],[523,.32,.16],[659,.5,.4],[523,.92,.16],[659,1.08,.16],[784,1.24,.6]];
  for(var i=0;i<m.length;i++)tone(m[i][0],m[i][1],m[i][2],'triangle',.15);
}

var fx=document.getElementById('fx'),fctx=fx.getContext('2d'),parts=[],confettiUntil=0;
var FCOL=['#ffd166','#ff6b6b','#4cc9f0','#ff9f1c','#f72585','#8ac926','#ffb703','#c77dff'];
function burst(x,y,n,pow){
  n=n||34;pow=pow||1;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=(2+Math.random()*5)*pow;
    parts.push({t:Math.random()<.45?'star':'spark',x:x,y:y,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,g:.12,
      r:4+Math.random()*7*pow,rot:Math.random()*6.3,vr:(Math.random()-.5)*.3,
      col:FCOL[(Math.random()*FCOL.length)|0],life:1,dl:.012+Math.random()*.014});
  }
}
function burstAtEl(el,n,pow){var p=toStage(el);burst(p.x,p.y,n,pow);}
function confettiRain(ms){confettiUntil=Date.now()+ms;}
function drawStarC(x,y,r,rot,col,alpha){
  fctx.save();fctx.translate(x,y);fctx.rotate(rot);fctx.globalAlpha=alpha;fctx.fillStyle=col;
  fctx.beginPath();
  for(var i=0;i<10;i++){
    var rr=(i%2? r*.45:r),an=i*Math.PI/5-Math.PI/2;
    if(i)fctx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);else fctx.moveTo(Math.cos(an)*rr,Math.sin(an)*rr);
  }
  fctx.closePath();fctx.fill();fctx.restore();
}
function fxLoop(){
  fctx.clearRect(0,0,fx.width,fx.height);
  if(Date.now()<confettiUntil && parts.length<600){
    for(var k=0;k<3;k++)parts.push({t:'conf',x:Math.random()*fx.width,y:-30,
      vx:(Math.random()-.5)*1.6,vy:2+Math.random()*2.5,g:.02,
      w:8+Math.random()*8,h:10+Math.random()*12,rot:Math.random()*6.3,vr:(Math.random()-.5)*.2,
      col:FCOL[(Math.random()*FCOL.length)|0],life:1,dl:.004,ph:Math.random()*6.3});
  }
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=p.vr||0;p.life-=p.dl;
    if(p.t==='conf'){p.ph+=.06;p.x+=Math.sin(p.ph)*1.2;}
    if(p.life<=0||p.y>fx.height+60){parts.splice(i,1);continue;}
    var al=Math.max(0,Math.min(1,p.life));
    if(p.t==='conf'){
      fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);
      fctx.globalAlpha=al;fctx.fillStyle=p.col;fctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      fctx.restore();
    }else if(p.t==='star'){drawStarC(p.x,p.y,p.r,p.rot,p.col,al);}
    else{fctx.globalAlpha=al;fctx.fillStyle=p.col;
      fctx.beginPath();fctx.arc(p.x,p.y,p.r*.5,0,6.3);fctx.fill();}
  }
  fctx.globalAlpha=1;
  requestAnimationFrame(fxLoop);
}

/* ================= карточка с вопросом ================= */
var overlay=document.getElementById('overlay'),qcard=document.getElementById('qcard'),
    eqA=document.getElementById('eqA'),eqOp=document.getElementById('eqOp'),
    eqB=document.getElementById('eqB'),eqAns=document.getElementById('eqAns'),
    hint=document.getElementById('hint'),praise=document.getElementById('praise'),
    qnum=document.getElementById('qnum'),qmascot=document.getElementById('qmascot'),
    keypad=document.getElementById('keypad');
var curQ=null,buffer='',attempts=0,done=false;
function setAns(s){
  if(s===''){eqAns.textContent='?';eqAns.classList.add('empty');}
  else{eqAns.textContent=s;eqAns.classList.remove('empty');}
}
['1','2','3','4','5','6','7','8','9','⌫','0','✓'].forEach(function(t){
  var b=document.createElement('button');
  if(t==='⌫')b.className='fn';
  if(t==='✓')b.className='okb';
  b.textContent=t;
  b.addEventListener('click',function(){keyPress(t);});
  keypad.appendChild(b);
});
function keyPress(t){
  if(!curQ||done)return;
  if(t==='⌫'){buffer=buffer.slice(0,-1);setAns(buffer);return;}
  if(t==='✓'){check();return;}
  if(buffer.length>=2)return;
  buffer+=t;setAns(buffer);sType();
}
function openQ(o){
  curQ=o;buffer='';attempts=0;done=false;
  qnum.textContent=o.num;
  qmascot.textContent=o.mascot;
  praise.textContent=o.prompt;
  eqA.textContent=o.a;eqOp.textContent=o.op>0?'+':'−';eqB.textContent=o.b;
  setAns('');
  hint.classList.add('hidden');hint.textContent='';
  qcard.classList.remove('ok','err','shake');
  overlay.classList.remove('hidden');
}
function closeModal(){
  if(done)return;
  overlay.classList.add('hidden');curQ=null;
}
function check(){
  if(!curQ||done||buffer==='')return;
  var ans=parseInt(buffer,10);
  if(ans===curQ.a+curQ.op*curQ.b){
    done=true;
    qcard.classList.remove('err');qcard.classList.add('ok');
    praise.textContent=PRAISE[(Math.random()*PRAISE.length)|0];
    sCorrect();
    S.stars++;starCnt.textContent=S.stars;
    addSharedStar();
    var f=curQ.onOk;
    setTimeout(function(){overlay.classList.add('hidden');curQ=null;f(ans);},650);
  }else{
    attempts++;
    qcard.classList.remove('shake','err');void qcard.offsetWidth;
    qcard.classList.add('shake','err');
    setTimeout(function(){qcard.classList.remove('err');},700);
    praise.textContent=ENC[(Math.random()*ENC.length)|0];
    sWrong();
    buffer='';setAns('');
    if(attempts>=2){
      hint.textContent='💡 '+curQ.hintFn();
      hint.classList.remove('hidden');
    }
  }
}
document.getElementById('qclose').addEventListener('click',closeModal);
document.addEventListener('keydown',function(e){
  if(!overlay.classList.contains('hidden')){
    if(/^[0-9]$/.test(e.key)){keyPress(e.key);e.preventDefault();}
    else if(e.key==='Backspace'){keyPress('⌫');e.preventDefault();}
    else if(e.key==='Enter'||e.key===' '){keyPress('✓');e.preventDefault();}
    else if(e.key==='Escape'){closeModal();}
  }
});

function buyToy(i){

function startPay(viaMom){
  if(S.scene!=='cafe'||S.done)return;
  if(S.drink<0||S.treat<0){
    foxSay('Сначала выбери и напиток, и вкусняшку! 🙂');
    sWrong();return;
  }
  if(!S.totalKnown){
    var d=S.drinks[S.drink],x=S.treats[S.treat];
    openQ({num:'☕ Кафе',mascot:'🦊',
      prompt:'Сколько стоят вкусняшки вместе?',
      a:d.p,op:1,b:x.p,
      hintFn:function(){return hintAdd(d.p,x.p);},
      onOk:function(sum){
        S.total=sum;S.totalKnown=true;
        save();renderAll();
        afterTotal(viaMom);

  }else afterTotal(viaMom);

function afterTotal(viaMom){
  if(S.money>=S.total){

      foxSay('👩 Мама: «Да у тебя же хватает! У тебя '+S.money+' р., а покупка всего '+S.total+' р.» 😄');
      return;

    if(S.money===S.total){finishCafe();return;}
    openQ({num:'☕ Кафе',mascot:'🦊',
      prompt:'У тебя '+S.money+' р. Сколько сдачи?',
      a:S.money,op:-1,b:S.total,
      hintFn:function(){return hintSub(S.money,S.total);},
      onOk:function(ch){
        S.money=ch;
        save();renderAll();
        finishCafe();
