// ---- генерация примеров: новые при каждом открытии страницы ----
function poolFor(n) {
  const P = DATA.preset || 'easy';
  const plus = [], minus = [];
  if (P === 'hard') {
    // двузначные некруглые с переходом через десяток
    for (let a = 11; a <= 98; a++) {
      const b = n - a;
      if (b >= 11 && b <= 99 && b !== a && a % 10 && b % 10 && (a % 10) + (b % 10) >= 10)
        plus.push([a, b, '+']);
    }
    for (let c = n + 11; c <= 99; c++) {
      const d = c - n;
      if (d >= 11 && d <= 99 && d !== c && c % 10 && d % 10 && c % 10 < d % 10)
        minus.push([c, d, '\u2212']);
    }
    return { plus, minus };
  }
  if (P === 'mid') {
    // переход через десяток, всё в пределах 30
    for (let a = 2; a <= 9; a++) {
      const b = n - a;
      if (b >= 2 && b <= 9 && a + b >= 10) plus.push([a, b, '+']);
    }
    for (let a = 11; a <= 29; a++) {
      if (a % 10 === 0) continue;
      const b = n - a;
      if (b >= 2 && b <= 9 && (a % 10) + b >= 10 && a + b <= 30) plus.push([a, b, '+']);
    }
    for (let c = 11; c <= 30; c++) {
      const d = c - n;
      if (d >= 2 && d <= 9 && c % 10 < d) minus.push([c, d, '\u2212']);
    }
    return { plus, minus };
  }
  // лёгкий уровень: однозначные / круглые десятки / двузначное некруглое + однозначное
  const small = [2, 3, 4, 5, 6, 7, 8, 9, 10, 20];
  for (const a of small) {
    const b = n - a;
    if ((b >= 2 && b <= 9) || b === 10 || b === 20) {
      if (!(a >= 10 && b >= 10)) plus.push([a, b, '+']);
    }
  }
  for (let a = 11; a <= 25; a++) {
    if (a % 10 === 0) continue;
    const b = n - a;
    if (b >= 2 && b <= 9 && a + b <= 30) plus.push([a, b, '+']);
  }
  for (let c = 10; c <= 30; c++) {
    const d = c - n;
    if ((d >= 2 && d <= 9) || d === 10 || d === 20) minus.push([c, d, '\u2212']);
  }
  return { plus, minus };
}

function genExamples() {
  const byColor = {};
  for (const [id, r] of Object.entries(regions)) if (r.q) (byColor[r.a] ||= []).push(id);
  for (const aStr of Object.keys(byColor)) {
    const n = answers[+aStr].n;
    const { plus, minus } = poolFor(n);
    const all = plus.concat(minus);
    const used = new Set();
    let wantPlus = Math.random() < 0.5;
    for (const id of byColor[aStr]) {
      let ex = null;
      for (let t = 0; t < 80 && !ex; t++) {
        wantPlus = !wantPlus;
        const pool = wantPlus ? plus : minus;
        if (!pool.length) continue;
        const [x, y, op] = pool[Math.floor(Math.random() * pool.length)];
        const s = x + op + y;
        if (!used.has(s)) { ex = s; used.add(s); }
      }
      if (!ex) ex = all[Math.floor(Math.random() * all.length)].join('');
      regions[id].ex = ex;
    }
  }
}

function init() {
  genExamples(); // свежие примеры при каждом открытии страницы
  cxBase.drawImage(img, 0, 0);

  // карта регионов: id = R + G*256
  const mc = document.createElement('canvas');
  mc.width = W; mc.height = H;
  const mx = mc.getContext('2d', {willReadFrequently: true});
  mx.drawImage(mapImg, 0, 0);
  const md = mx.getImageData(0, 0, W, H).data;
  const counts = new Map();
  ids = new Uint16Array(W * H);
  for (let i = 0, p = 0; i < W * H; i++, p += 4) {
    const id = md[p] | (md[p+1] << 8);
    ids[i] = id;
    if (id) counts.set(id, (counts.get(id) || 0) + 1);
  }
  const arrays = new Map();
  for (const [id, n] of counts) {
    // микроточки без примера и ответа не закрашиваем вовсе
    if (regions[String(id)]) arrays.set(id, new Int32Array(n));
  }
  const pos = new Map();
  for (let i = 0; i < W * H; i++) {
    const id = ids[i];
    if (!id || !arrays.has(id)) continue;
    const arr = arrays.get(id), k = pos.get(id) || 0;
    arr[k] = i; pos.set(id, k + 1);
  }
  regionPixels = arrays;

  // палитра
  const pal = document.getElementById('palbtns');

  });

  // подписи-примеры
  for (const [id, r] of Object.entries(regions)) {
    if (!r.ex) continue;
    const sp = document.createElement('span');
    sp.dataset.id = id;
    if (r.ln === 2) {
      const m = r.ex.match(/^(\d+)([+\u2212])(\d+)$/);
      sp.innerHTML = m ? `${m[1]}${m[2]}<br>${m[3]}` : r.ex;
    } else sp.textContent = r.ex;
    sp.style.left = (r.tx / W * 100) + '%';
    sp.style.top = (r.ty / H * 100) + '%';
    sp.style.setProperty('--fs', r.fs + 'px');
    labelsBox.appendChild(sp);
    labelEls.set(id, sp);
  }

  addEventListener('resize', fit);
  fit();
  wrap.addEventListener('pointermove', onMove);
  wrap.addEventListener('pointerdown', onDown);
  wrap.addEventListener('pointerleave', () => { clearHover(); hoverId = 0; });

  restore();
  updateProgress();
}

function fit() {
  // ширина: вписать в доступное место с сохранением пропорций
  const avail = document.getElementById('left');
  const maxW = Math.min(avail.clientWidth, 760);
  const maxH = Math.max(260, innerHeight - 210);
  let w = maxW;
  if (w * H / W > maxH) w = maxH * W / H;
  wrap.style.width = Math.max(240, Math.floor(w)) + 'px';
  wrap.style.height = Math.floor(w * H / W) + 'px';
  wrap.style.setProperty('--u', (w / W).toFixed(4));
}

function pxColor(idx, alpha) {
  const a = answers[idx], r = parseInt(a.c.slice(1,3),16), g = parseInt(a.c.slice(3,5),16), b = parseInt(a.c.slice(5,7),16);
  return [r, g, b, alpha];
}

function paintTo(ctx, data, id, rgba) {
  const arr = regionPixels.get(Number(id));
  if (!arr) return;
  const d = data.data;
  for (let k = 0; k < arr.length; k++) {
    const p = arr[k] * 4;
    if (rgba) { d[p] = rgba[0]; d[p+1] = rgba[1]; d[p+2] = rgba[2]; d[p+3] = rgba[3]; }
    else d[p+3] = 0;
  }
  ctx.putImageData(data, 0, 0);
}

function paintRegion(id, colorIdx) {
  paintTo(cxFill, fillData, id, colorIdx === null ? null : pxColor(colorIdx, 255));
  fillColors.set(String(id), colorIdx);
  const el = labelEls.get(String(id));
  if (el) el.classList.toggle('lt', colorIdx !== null && LUM[colorIdx] < 140);
}

function idAt(x, y) {
  // координаты события -> пиксель карты
  const rect = wrap.getBoundingClientRect();
  const px = Math.max(0, Math.min(W - 1, Math.round((x - rect.left) * W / rect.width)));
  const py = Math.max(0, Math.min(H - 1, Math.round((y - rect.top) * H / rect.height)));
  // карта не хранится в JS-массиве после init — берём из ids через замыкание
  return ids ? ids[py * W + px] : 0;
}

let ids = null;                 // id пикселей карты регионов (числа)

function selectColor(i) {
  selected = (selected === i) ? -1 : i;
  document.querySelectorAll('#palbtns button').forEach((b, k) => b.classList.toggle('sel', k === selected));
  if (selected >= 0) say(`Выбран цвет: ${answers[selected].n} — ${answers[selected].name}. Нажимай на части картинки!`);
  else say('Выбери цвет справа, а потом нажимай на части картинки');
  clearHover();
}

function onMove(e) {
  if (selected < 0) { clearHover(); hoverId = 0; return; }
  const id = idAt(e.clientX, e.clientY);
  if (id === hoverId) return;
  hoverId = id;
  clearHover();
  if (!id || !regionPixels.has(id)) return;
  const key = String(id);
  const reg = regions[key];
  // решённые примеры не подсвечиваем — клик по ним ничего не делает
  if (reg && reg.ex && (fillColors.get(key) ?? null) !== null) return;
  paintTo(cxHover, hoverData, id, [125, 125, 125, 110]);
}

function clearHover() {
  if (flashTimer) return; // во время мигания слой занят
  hoverData.data.fill(0);
  cxHover.putImageData(hoverData, 0, 0);
}

function onDown(e) {
  e.preventDefault();
  if (selected < 0) { showToast('Сначала выбери цвет справа 👉'); return; }
  const id = idAt(e.clientX, e.clientY);
  if (!id || !regionPixels.has(id)) return;
  const key = String(id);
  const cur = fillColors.get(key) ?? null;
  const reg = regions[key];
  // решённый пример неизменен — клик ничего не делает
  if (reg && reg.ex && cur !== null) return;
  if (cur === selected) return;
  // фаза примеров: закрасится только правильным цветом, неверные считаются
  if (!freeMode && (!reg || reg.a !== selected)) {
    errorCount++;
    updateErrors();
    saveStore();
    showToast('Не сходится — реши пример ещё раз 🤔');
    say('Неверно. Посчитай внимательно и попробуй другой цвет', 'bad');
    flash([id], 2);
    return;
  }
  paintRegion(id, selected);
  if (!freeMode) {
    const PRAISE = ['Верно ✓', 'Точно ✓', 'Супер ✓', 'Правильно ✓'];
    say(PRAISE[Math.floor(Math.random() * PRAISE.length)], 'ok');
  }
  updateProgress();
  saveStore();
  clearHover();
  hoverId = 0;
}

function say(t, cls) { msg.className = cls || ''; msg.textContent = t; }

function updateErrors() {
  document.getElementById('errors').textContent = 'Ошибки: ' + errorCount;
}

function exStats() {
  let need = 0, done = 0;
  for (const [id, r] of Object.entries(regions)) if (r.ex) {
    need++;
    if ((fillColors.get(id) ?? null) !== null) done++;
  }
  return { need, done };
}

let celebrated = false;
function updateProgress() {
  let done = 0;
  for (const id of regionPixels.keys()) if (fillColors.get(String(id)) != null) done++;
  const ex = exStats();
  if (!freeMode && ex.need && ex.done === ex.need) {
    freeMode = true;
    document.getElementById('bDecor').style.display = '';
    say('🎉 Все примеры решены! Мелкие детали крась как хочешь или нажми «✨ Закрасить красиво»', 'ok');
    showToast('Декор открыт ✨');
  }
  progress.textContent = freeMode
    ? `Закрашено: ${done} из ${regionPixels.size}`
    : `Закрашено: ${done} из ${ex.need}`;
  if (done === regionPixels.size && regionPixels.size && !celebrated) {
    celebrated = true;
    say('🎉 Ура! Вся картинка раскрашена! 🎉', 'ok pop');
    celebrate();
  }
  if (done < regionPixels.size) celebrated = false;
}

function flash(list, times) {
  clearHoverSafe();
  let on = false;
  const drawSet = () => {
    hoverData.data.fill(0);
    if (on) for (const id of list) paintToLite(id);
    cxHover.putImageData(hoverData, 0, 0);
  };
  const paintToLite = (id) => {
    const arr = regionPixels.get(Number(id));
    if (!arr) return;
    const d = hoverData.data;
    for (let k = 0; k < arr.length; k++) {
      const p = arr[k] * 4;
      d[p] = 10; d[p+1] = 10; d[p+2] = 10; d[p+3] = 120;
    }
  };
  flashTimer = setInterval(() => {
    on = !on;
    if (on && times-- <= 0) {
      clearInterval(flashTimer); flashTimer = null;
      hoverData.data.fill(0); cxHover.putImageData(hoverData, 0, 0);
      return;
    }
    drawSet();
  }, 420);
}
function clearHoverSafe() { if (flashTimer) { clearInterval(flashTimer); flashTimer = null; } hoverData.data.fill(0); cxHover.putImageData(hoverData, 0, 0); hoverId = 0; }

function celebrate() {
  const em = ['🎉','⭐','🎈','✨','🥇'];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('div');
    s.textContent = em[i % em.length];
    s.style.cssText = `position:fixed;z-index:98;font-size:${18+Math.random()*22}px;left:${Math.random()*96}vw;top:-40px;pointer-events:none;transition:transform ${2.2+Math.random()*1.5}s linear`;
    document.body.appendChild(s);
    requestAnimationFrame(() => { s.style.transform = `translateY(${innerHeight + 80}px) rotate(${Math.random()*360}deg)`; });
    setTimeout(() => s.remove(), 4200);
  }
}

// ---------- кнопки ----------
// ✨ дорисовать мелкие детали правильными цветами (открывается после всех примеров)
document.getElementById('bDecor').onclick = () => {
  for (const [id, r] of Object.entries(regions)) {
    if ((fillColors.get(id) ?? null) === null) paintRegion(id, r.a);
  }
  updateProgress();
  saveStore();
  showToast('Мелкие детали закрашены ✨');
};

let resetArmed = 0;
document.getElementById('bReset').onclick = () => {
  const b = document.getElementById('bReset');
  const now = Date.now();
  if (now - resetArmed > 3000) {
    resetArmed = now;
    b.textContent = '❗ Точно стереть?';
    b.style.borderColor = '#c026d3';
    b.style.color = '#c026d3';
    showToast('Нажмите ещё раз, чтобы стереть всё');
    setTimeout(() => {
      if (Date.now() - resetArmed >= 2900) {
        b.textContent = '🗑️ Сначала';
        b.style.borderColor = '';
        b.style.color = '';
      }
    }, 3100);
    return;
  }
  resetArmed = 0;
  b.textContent = '🗑️ Сначала';
  b.style.borderColor = '';
  b.style.color = '';
  for (const id of regionPixels.keys()) paintRegion(id, null);
  errorCount = 0;
  updateErrors();
  freeMode = false;
  document.getElementById('bDecor').style.display = 'none';
  celebrated = false;
  updateProgress();
  saveStore();
  say('Начинаем заново! Выбери цвет справа');
};

// 💾 сохранение на листе А4 (300 dpi, поля 2 см) в jpg
document.getElementById('bSave').onclick = () => {
  const k = 300 / 25.4;                                   // пикселей на мм
  const AW = Math.round(210 * k), AH = Math.round(297 * k);
  const M = Math.round(20 * k);                           // поле 2 см
  const out = document.createElement('canvas');
  out.width = AW; out.height = AH;
  const cx = out.getContext('2d');
  cx.fillStyle = '#ffffff';
  cx.fillRect(0, 0, AW, AH);
  const s = Math.min((AW - 2 * M) / W, (AH - 2 * M) / H);
  const ox = Math.round((AW - W * s) / 2), oy = Math.round((AH - H * s) / 2);
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(cvBase, ox, oy, W * s, H * s);
  cx.drawImage(cvFill, ox, oy, W * s, H * s);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const [id, r] of Object.entries(regions)) {
    if (!r.ex) continue;
    const el = labelEls.get(id);
    const light = el && el.classList.contains('lt');
    cx.fillStyle = light ? '#fff' : '#161616';
    cx.font = `bold ${Math.max(10, Math.round(r.fs * s))}px Verdana, Arial, sans-serif`;
    const x = ox + r.tx * s, y = oy + r.ty * s;
    if (r.ln === 2) {
      const m = r.ex.match(/^(\d+)([+\u2212])(\d+)$/);
      cx.fillText(m[1] + m[2], x, y - r.fs * s * 0.55);
      cx.fillText(m[3], x, y + r.fs * s * 0.55);
    } else cx.fillText(r.ex, x, y);
  }
  const a = document.createElement('a');
  a.download = DATA.save || 'раскраска-А4.jpg';
  a.href = out.toDataURL('image/jpeg', 0.92);
  a.click();
  showToast('Лист А4 сохранён 💾');
};

// ---------- хранение прогресса ----------
function saveStore() {
  try {
    const f = [];
    for (const [id, c] of fillColors) if (c != null) f.push([id, c]);
    localStorage.setItem(STORE_KEY, JSON.stringify({ f, e: errorCount }));
  } catch (e) {}
}
function restore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    for (const [id, c] of (d.f || [])) if (regionPixels.has(+id)) paintRegion(id, c);
    errorCount = d.e || 0;
    updateErrors();
    updateProgress();
    if (!freeMode && fillColors.size) say('Продолжаем раскрашивать! Прогресс сохранён 🎨');
  } catch (e) {}
}

let toastTimer = null;
function showToast(t) {
  toast.textContent = t;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}
