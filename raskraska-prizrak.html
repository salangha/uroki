<title>Раскраска-считалка: Призрак читает книжку — выбор уровня</title>
<!--
Интерактивная раскраска по примерам (2 класс). Перед раскрашиванием выбирается
уровень сложности; примеры генерируются заново при каждом открытии.
Палитра — реалистичные цвета (уютная осень).
Клик по области закрашивает её выбранным цветом (карта регионов предрассчитана).
-->
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{margin:0;font-family:Verdana,"Segoe UI",Arial,sans-serif;background:#fdf2f8;color:#3b2340;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#fff;border-bottom:3px solid #f3d7ea;flex-wrap:wrap}
h1{margin:0;font-size:22px;color:#a21caf}
.sub{font-size:13px;color:#8a5a7d}
#steps{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;color:#6b4a63;margin-left:auto}
#steps b{color:#c026d3}
main{flex:1;min-height:0;display:flex;gap:12px;padding:10px 12px;overflow:auto}
#left{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
#toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
#toolbar button,#palbtns button{
  font-family:inherit;font-size:15px;font-weight:bold;color:#7a2f63;background:#fff;
  border:2px solid #ecc9e2;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.07)}
#toolbar button:hover{background:#fce7f3}
#toolbar button:active{transform:translateY(2px);box-shadow:none}
#progress{font-size:15px;font-weight:bold;background:#fff8e1;border:2px solid #f1d27a;border-radius:12px;padding:7px 12px}
#errors{font-size:15px;font-weight:bold;background:#fee2e2;border:2px solid #fca5a5;border-radius:12px;padding:7px 12px;color:#b91c1c}
#bDecor{border-color:#86efac !important;color:#15803d !important;background:#f0fdf4 !important}
#msg{font-size:17px;font-weight:bold;min-height:26px;text-align:center;color:#3b2340}
#msg.ok{color:#15803d}
#msg.bad{color:#b91c1c}
#wrap{position:relative;flex:0 1 auto;max-width:100%;cursor:crosshair;touch-action:none}
#wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#wrap canvas:first-of-type{position:relative}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels span{
  position:absolute;transform:translate(-50%,-50%);font-weight:bold;color:#161616;
  line-height:1.06;text-align:center;white-space:nowrap;
  font-size:calc(var(--fs) * var(--u));text-shadow:0 0 2px rgba(255,255,255,.55)}
#labels span.lt{color:#fff;text-shadow:0 0 2px rgba(0,0,0,.4)}
#right{width:230px;flex:0 0 auto;display:flex;flex-direction:column;gap:10px;align-items:stretch}
#right h2{margin:0;font-size:16px;color:#a21caf;text-align:center}
#palbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#palbtns button{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:14px}
#palbtns button .dot{width:44px;height:44px;border-radius:50%;border:3px solid rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:bold}
#palbtns button .nm{font-size:11px;color:#6b4a63}
#palbtns button.sel{border-color:#c026d3;background:#fce7f3;transform:scale(1.04);box-shadow:0 0 0 3px #f0abfc}
#palbtns button.sel .nm{color:#a21caf;font-weight:bold}
#hint{font-size:12px;color:#8a5a7d;background:#fff;border:2px solid #ecc9e2;border-radius:12px;padding:8px 10px}
#hint b{color:#c026d3}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#3b2340;color:#fff;font-size:16px;font-weight:bold;padding:10px 18px;border-radius:14px;
  opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes pop{50%{transform:scale(1.18)}}
#msg.pop{animation:pop .45s}
@media (max-width:760px){
  main{flex-direction:column;align-items:center}
  #right{width:100%;max-width:520px}
}

/* ---------- выбор уровня ---------- */
#lvlOverlay{position:fixed;inset:0;background:rgba(59,35,64,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#lvlOverlay.hide{display:none}
#lvlCard{position:relative;background:#fff;border-radius:22px;border:3px solid #f3d7ea;box-shadow:0 14px 40px rgba(59,35,64,.35);padding:22px 24px;max-width:540px;width:100%;max-height:92vh;overflow:auto}
#lvlCard h2{margin:0 0 4px;color:#a21caf;font-size:24px}
#lvlCard .lnote{font-size:13px;color:#8a5a7d;margin:2px 0 12px}
#lvlClose{position:absolute;top:10px;right:12px;border:none;background:none;font-size:20px;cursor:pointer;color:#8a5a7d;padding:4px}
.lvlBtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;background:#fff;border:2px solid #ecc9e2;border-radius:14px;padding:10px 14px;margin:8px 0;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.07)}
.lvlBtn:hover{background:#fce7f3}
.lvlBtn .ic{font-size:26px;flex:0 0 auto}
.lvlBtn .tt{font-size:16px;font-weight:bold;color:#7a2f63}
.lvlBtn .hh{font-size:13px;color:#8a5a7d}
.lvlBtn .em{margin-left:auto;font-size:12px;color:#c026d3;font-weight:bold;white-space:nowrap}
#bTeacher.on{border-color:#86efac !important;color:#15803d !important;background:#f0fdf4 !important}
</style>

  });

function buildAnswers(L) {
  if (L.palette === 'same') {
    for (const id of Object.keys(regions)) regions[id].a = ORIG_A[id];
    if (!L.nums) return BASE_ANSWERS;
    return BASE_ANSWERS.map((a, i) => ({ n: (L.nums[i] !== undefined ? L.nums[i] : a.n), c: a.c, name: a.name, hidden: a.hidden }));
  }
  const order = GROUP_ORDER.filter(g => BY_NAME[g]);
  const na = order.map((g, i) => ({ n: (L.nums || [])[i], c: BY_NAME[g], name: g }));
  const gi = {};
  order.forEach((g, i) => { gi[g] = i; });
  for (const h of BASE_ANSWERS) if (h.hidden) { h._m = na.length; na.push({ n: h.n, c: h.c, name: h.name, hidden: 1 }); }
  for (const id of Object.keys(regions)) {
    const base = BASE_ANSWERS[ORIG_A[id]];
    regions[id].a = base.hidden ? base._m : gi[MERGE_GROUPS[base.name] || base.name];
  }
  return na;
}

      // двузначное ± однозначное без перехода
      for (let b = 1; b <= 9; b++) { const a = n - b; if (a >= 11 && a <= 99 && a % 10 !== 0 && (a % 10) + b <= 9) plus.push([a, b, '+']); }
      for (let b = 1; b <= 9; b++) { const c = n + b; if (c <= 20 && c % 10 !== 0 && c % 10 >= b) minus.push([c, b, '\u2212']); }
    }
  } else if (G === 'l20') {
    if (n >= 11) {
      // сумма однозначных с переходом: 8+5=13
      for (let a = 1; a <= 9; a++) { const b = n - a; if (b >= 1 && b <= 9) plus.push([a, b, '+']); }
      // вычитание из двузначного с переходом: 13−5=8
      for (let b = 1; b <= 9; b++) { const c = n + b; if (c <= 20 && c % 10 < b) minus.push([c, b, '\u2212']); }
    } else {
      // ответ меньше 10 — только вычитание с переходом: 12−9=3
      for (let c = 11; c <= 19; c++) { const d = c - n; if (d >= 1 && d <= 9 && c % 10 < d) minus.push([c, d, '\u2212']); }
    }
  } else if (G === 'l10s') {
    for (let a = 10; a <= 90; a += 10) { const b = n - a; if (b >= 10 && b <= 100) plus.push([a, b, '+']); }
    for (let c = 20; c <= 100; c += 10) { const d = c - n; if (d >= 10) minus.push([c, d, '\u2212']); }
  } else if (G === 'l2d1') {
    // двузначное ± однозначное (с переходом и без)
    for (let b = 1; b <= 9; b++) { const a = n - b; if (a >= 11 && a <= 98 && a % 10 !== 0) plus.push([a, b, '+']); }
    for (let b = 1; b <= 9; b++) { const c = n + b; if (c <= 99 && c % 10 !== 0) minus.push([c, b, '\u2212']); }
  } else if (G === 'l2d10') {
    // двузначное + круглое: 24+30
    for (let r = 10; r <= n - 11; r += 10) plus.push([n - r, r, '+']);
    // двузначное − круглое: 54−30
    for (let r = 10; n + r <= 99; r += 10) minus.push([n + r, r, '\u2212']);
    // круглое − двузначное: 50−26
    for (let c = 20; c <= 99; c += 10) { const d = c - n; if (d >= 11) minus.push([c, d, '\u2212']); }
  } else if (G === 'l2d2') {
    // двузначное + двузначное с переходом: 43+19
    for (let a = 11; a <= 88; a++) {
      const b = n - a;
      if (b >= 11 && b <= 98 && a % 10 !== 0 && b % 10 !== 0 && (a % 10) + (b % 10) >= 10) plus.push([a, b, '+']);
    }
    // двузначное − двузначное с переходом: 72−26
    for (let c = 21; c <= 99; c++) {
      const d = c - n;
      if (d >= 11 && d <= 98 && c % 10 !== 0 && d % 10 !== 0 && c % 10 < d % 10) minus.push([c, d, '\u2212']);
    }
  } else if (G === 'lmul') {
    // табличное умножение и деление
    for (let a = 2; a <= 9; a++) { const b = n / a; if (Number.isInteger(b) && b >= 2 && b <= 9) plus.push([a, b, '\u00D7']); }
    for (let d = 2; d <= 9; d++) { const c = n * d; if (c <= 81) minus.push([c, d, '\u00F7']); }
  }
  return { plus, minus };
}

function genExamples() {
  const byColor = {};
  for (const [id, r] of Object.entries(regions))
    if (r.q && (fillColors.get(id) ?? null) === null) (byColor[r.a] ||= []).push(id);
  for (const aStr of Object.keys(byColor)) {
    const n = answers[+aStr].n;
    const { plus, minus } = poolFor(n);
    const all = plus.concat(minus);
    if (!all.length) continue;
    const used = new Set();
    let wantPlus = Math.random() < 0.5;
    for (const id of byColor[aStr]) {
      let ex = null;
      for (let t = 0; t < 80 && !ex; t++) {
        wantPlus = !wantPlus;
        const pool = wantPlus ? plus : minus;
        if (!pool.length) continue;
        let [x, y, op] = pool[Math.floor(Math.random() * pool.length)];
        // «круглое + двузначное» иногда в другом порядке: 30+24
        if (op === '+' && x >= 10 && y <= 9 && Math.random() < 0.5) { const t2 = x; x = y; y = t2; }
        const str = x + op + y;
        if (!used.has(str)) { ex = str; used.add(str); }
      }
      if (!ex) { const [x, y, op] = all[Math.floor(Math.random() * all.length)]; ex = x + op + y; }
      regions[id].ex = ex;
    }
  }
}

function buildPalette() {
  const pal = document.getElementById('palbtns');
  pal.innerHTML = '';
  answers.forEach((a, i) => {
    if (a.hidden) return;
    const b = document.createElement('button');
    const txt = LUM[i] < 140 ? '#fff' : '#1a1a1a';
    b.innerHTML = `<span class="dot" style="background:${a.c};color:${txt}">${a.n}</span><span class="nm">${a.name}</span>`;
    b.title = `${a.n} — ${a.name}`;
    b.onclick = () => selectColor(i);
    pal.appendChild(b);
  });
}

function buildLabels() {
  labelsBox.innerHTML = '';
  labelEls.clear();
  for (const [id, r] of Object.entries(regions)) {
    if (!r.ex) continue;
    const sp = document.createElement('span');
    sp.dataset.id = id;
    if (r.ln === 2) {
      const m = r.ex.match(/^(\d+)([+\u2212\u00D7\u00F7])(\d+)$/);
      sp.innerHTML = m ? `${m[1]}${m[2]}<br>${m[3]}` : r.ex;
    } else sp.textContent = r.ex;
    sp.style.left = (r.tx / W * 100) + '%';
    sp.style.top = (r.ty / H * 100) + '%';
    sp.style.setProperty('--fs', r.fs + 'px');
    labelsBox.appendChild(sp);
    labelEls.set(id, sp);
  }
}

function init() {
  cxBase.drawImage(img, 0, 0);
  fillData = cxFill.createImageData(W, H);
  hoverData = cxHover.createImageData(W, H);

  // карта регионов: id = R + G*256
  const mc = document.createElement('canvas');
  mc.width = W; mc.height = H;
  const mx = mc.getContext('2d', { willReadFrequently: true });
  mx.drawImage(mapImg, 0, 0);
  const md = mx.getImageData(0, 0, W, H).data;
  const counts = new Map();
  ids = new Uint16Array(W * H);
  for (let i = 0, p = 0; i < W * H; i++, p += 4) {
    const id = md[p] | (md[p + 1] << 8);
    ids[i] = id;
    if (id) counts.set(id, (counts.get(id) || 0) + 1);
  }
  const arrays = new Map();
  for (const [id, n] of counts) {
    // микроточки без примера и ответа не закрашиваем вовсе
    if (regions[String(id)]) arrays.set(id, new Int32Array(n));
  }
  const pos = new Map();
  for (let i = 0; i < W * H; i++) {
    const id = ids[i];
    if (!id || !arrays.has(id)) continue;
    const arr = arrays.get(id), k = pos.get(id) || 0;
    arr[k] = i; pos.set(id, k + 1);
  }
  regionPixels = arrays;

  addEventListener('resize', fit);
  fit();
  wrap.addEventListener('pointermove', onMove);
  wrap.addEventListener('pointerdown', onDown);
  wrap.addEventListener('pointerleave', () => { clearHover(); hoverId = 0; });

  buildLevelButtons();
  showLevelOverlay(false);
}

function loadStoreIntoMemory() {
  try {
    let raw = localStorage.getItem(STORE_KEY);
    // уровни с исходной палитрой наследуют прогресс базовой версии страницы
    if (!raw && (curLevel.gen === 'l2d1' || curLevel.gen === 'l2d10')) {
      const base = localStorage.getItem(STORE_KEY_BASE);
      if (base) { try { localStorage.setItem(STORE_KEY, base); } catch (e) {} raw = base; }
    }
    if (!raw) return;
    const d = JSON.parse(raw);
    for (const [id, c] of (d.f || [])) if (regionPixels.has(+id)) fillColors.set(String(id), c);
    // примеры закрашенных областей сохранены — возвращаем их, чтобы метки совпадали с цветом
    for (const [id, e] of Object.entries(d.ex || {})) if (regions[id]) regions[id].ex = e;
    errorCount = d.e || 0;
    updateErrors();
  } catch (e) {}
}

function setLevel(id) {
  const L = LEVELS.find(l => l.id === id);
  if (!L) return;
  curLevel = L;
  curGen = L.gen;
  answers = buildAnswers(L);
  recomputeLum();
  STORE_KEY = STORE_KEY_BASE + '-' + L.id;

  selected = -1;
  errorCount = 0;
  freeMode = false;
  celebrated = false;
  fillColors.clear();
  fillData.data.fill(0); cxFill.putImageData(fillData, 0, 0);
  hoverData.data.fill(0); cxHover.putImageData(hoverData, 0, 0);
  clearHoverSafe();
  document.getElementById('bDecor').style.display = 'none';
  document.getElementById('errors').textContent = 'Ошибки: 0';
  previewSaved = null;
  labelsBox.style.display = '';
  const tb = document.getElementById('bTeacher');
  tb.classList.remove('on');
  tb.textContent = '👩‍🏫 Готовый рисунок';

  loadStoreIntoMemory();
  genExamples();        // только для незакрашенных областей
  buildPalette();
  buildLabels();
  for (const [id2, c] of fillColors) if (c != null) paintRegion(id2, c);

  document.querySelector('.sub').textContent = (DATA.subtitle || '') + ' · уровень: ' + L.desc;
  hideLevelOverlay();
  updateProgress();
  const hadSave = fillColors.size > 0;
  say(hadSave ? `Уровень «${L.title}». Продолжаем — прогресс сохранён 🎨` : `Уровень «${L.title}». Выбери цвет справа и решай примеры!`);
}

// ---------- оверлей выбора уровня ----------
function buildLevelButtons() {
  const box = document.getElementById('lvlBtns');

  for (const L of LEVELS) {

    b.innerHTML = `<span class="ic">${L.icon}</span><span><span class="tt">${L.title}</span><br>` +
      `<span class="hh">например: ${L.hint}</span></span>` +
      (L.star ? '<span class="em">на вырост ⭐</span>' : '');
    b.onclick = () => setLevel(L.id);
    box.appendChild(b);

}
function showLevelOverlay(canClose) {
  const cont = document.getElementById('lvlContinue');

document.getElementById('bLevel').onclick = () => showLevelOverlay(!!curLevel);
document.getElementById('lvlClose').onclick = () => { if (curLevel) hideLevelOverlay(); };
document.getElementById('lvlContinue').onclick = () => hideLevelOverlay();

// ---------- 👩‍🏫 готовый рисунок (кнопка для учителя) ----------
// первое нажатие — подтверждение, второе — показывает полностью

let previewSaved = null;
let teacherArmed = 0;
document.getElementById('bTeacher').onclick = () => {

    if (now - teacherArmed > 3000) {

    }

function fit() {
  // ширина: вписать в доступное место с сохранением пропорций
  const avail = document.getElementById('left');
  const maxW = Math.min(avail.clientWidth, 760);
  const maxH = Math.max(260, innerHeight - 210);
  let w = maxW;
  if (w * H / W > maxH) w = maxH * W / H;
  wrap.style.width = Math.max(240, Math.floor(w)) + 'px';
  wrap.style.height = Math.floor(w * H / W) + 'px';
  wrap.style.setProperty('--u', (w / W).toFixed(4));
}

function pxColor(idx, alpha) {
  const a = answers[idx], r = parseInt(a.c.slice(1,3),16), g = parseInt(a.c.slice(3,5),16), b = parseInt(a.c.slice(5,7),16);
  return [r, g, b, alpha];
}

function paintTo(ctx, data, id, rgba) {
  const arr = regionPixels.get(Number(id));
  if (!arr) return;
  const d = data.data;
  for (let k = 0; k < arr.length; k++) {
    const p = arr[k] * 4;
    if (rgba) { d[p] = rgba[0]; d[p+1] = rgba[1]; d[p+2] = rgba[2]; d[p+3] = rgba[3]; }
    else d[p+3] = 0;
  }
  ctx.putImageData(data, 0, 0);
}

function paintRegion(id, colorIdx) {
  paintTo(cxFill, fillData, id, colorIdx === null ? null : pxColor(colorIdx, 255));
  fillColors.set(String(id), colorIdx);
  const el = labelEls.get(String(id));
  if (el) el.classList.toggle('lt', colorIdx !== null && LUM[colorIdx] < 140);
}

function idAt(x, y) {
  // координаты события -> пиксель карты
  const rect = wrap.getBoundingClientRect();
  const px = Math.max(0, Math.min(W - 1, Math.round((x - rect.left) * W / rect.width)));
  const py = Math.max(0, Math.min(H - 1, Math.round((y - rect.top) * H / rect.height)));
  // карта не хранится в JS-массиве после init — берём из ids через замыкание
  return ids ? ids[py * W + px] : 0;
}

let ids = null;                 // id пикселей карты регионов (числа)

function selectColor(i) {
  selected = (selected === i) ? -1 : i;
  document.querySelectorAll('#palbtns button').forEach((b, k) => b.classList.toggle('sel', k === selected));
  if (selected >= 0) say(`Выбран цвет: ${answers[selected].n} — ${answers[selected].name}. Нажимай на части картинки!`);
  else say('Выбери цвет справа, а потом нажимай на части картинки');
  clearHover();
}

function onMove(e) {
  if (selected < 0) { clearHover(); hoverId = 0; return; }
  const id = idAt(e.clientX, e.clientY);
  if (id === hoverId) return;
  hoverId = id;
  clearHover();
  if (!id || !regionPixels.has(id)) return;
  const key = String(id);
  const reg = regions[key];
  // решённые примеры не подсвечиваем — клик по ним ничего не делает
  if (reg && reg.ex && (fillColors.get(key) ?? null) !== null) return;
  paintTo(cxHover, hoverData, id, [125, 125, 125, 110]);
}

function clearHover() {
  if (flashTimer) return; // во время мигания слой занят
  hoverData.data.fill(0);
  cxHover.putImageData(hoverData, 0, 0);
}

function onDown(e) {
  e.preventDefault();
  if (previewSaved !== null) return;   // режим показа готового рисунка
  if (selected < 0) { showToast('Сначала выбери цвет справа 👉'); return; }
  const id = idAt(e.clientX, e.clientY);
  if (!id || !regionPixels.has(id)) return;
  const key = String(id);
  const cur = fillColors.get(key) ?? null;
  const reg = regions[key];
  // решённый пример неизменен — клик ничего не делает
  if (reg && reg.ex && cur !== null) return;
  if (cur === selected) return;
  if (reg && reg.hid && !freeMode) { showToast('Эта мелкая деталь раскрасится позже ✨'); return; }
  // фаза примеров: закрасится только правильным цветом, неверные считаются
  if (!freeMode && (!reg || reg.a !== selected)) {
    errorCount++;
    updateErrors();
    saveStore();
    showToast('Не сходится — реши пример ещё раз 🤔');
    say('Неверно. Посчитай внимательно и попробуй другой цвет', 'bad');
    flash([id], 2);
    return;
  }
  paintRegion(id, selected);
  if (!freeMode) {
    const PRAISE = ['Верно ✓', 'Точно ✓', 'Супер ✓', 'Правильно ✓'];
    say(PRAISE[Math.floor(Math.random() * PRAISE.length)], 'ok');
  }
  updateProgress();
  saveStore();
  clearHover();
  hoverId = 0;
}

function say(t, cls) { msg.className = cls || ''; msg.textContent = t; }

function updateErrors() {
  document.getElementById('errors').textContent = 'Ошибки: ' + errorCount;
}

function exStats() {
  let need = 0, done = 0;
  for (const [id, r] of Object.entries(regions)) if (r.ex) {
    need++;
    if ((fillColors.get(id) ?? null) !== null) done++;
  }
  return { need, done };
}

let celebrated = false;
function updateProgress() {
  let done = 0;
  for (const id of regionPixels.keys()) if (fillColors.get(String(id)) != null) done++;
  const ex = exStats();
  if (!freeMode && ex.need && ex.done === ex.need) {
    freeMode = true;
    document.getElementById('bDecor').style.display = '';
    say('🎉 Все примеры решены! Мелкие детали крась как хочешь или нажми «✨ Закрасить красиво»', 'ok');
    showToast('Декор открыт ✨');
  }
  progress.textContent = freeMode
    ? `Закрашено: ${done} из ${regionPixels.size}`
    : `Закрашено: ${done} из ${ex.need}`;
  if (done === regionPixels.size && regionPixels.size && !celebrated) {
    celebrated = true;
    say('🎉 Ура! Вся картинка раскрашена! 🎉', 'ok pop');
    celebrate();
  }
  if (done < regionPixels.size) celebrated = false;
}

function flash(list, times) {
  clearHoverSafe();
  let on = false;
  const drawSet = () => {
    hoverData.data.fill(0);
    if (on) for (const id of list) paintToLite(id);
    cxHover.putImageData(hoverData, 0, 0);
  };
  const paintToLite = (id) => {
    const arr = regionPixels.get(Number(id));
    if (!arr) return;
    const d = hoverData.data;
    for (let k = 0; k < arr.length; k++) {
      const p = arr[k] * 4;
      d[p] = 10; d[p+1] = 10; d[p+2] = 10; d[p+3] = 120;
    }
  };
  flashTimer = setInterval(() => {
    on = !on;
    if (on && times-- <= 0) {
      clearInterval(flashTimer); flashTimer = null;
      hoverData.data.fill(0); cxHover.putImageData(hoverData, 0, 0);
      return;
    }
    drawSet();
  }, 420);
}
function clearHoverSafe() { if (flashTimer) { clearInterval(flashTimer); flashTimer = null; } hoverData.data.fill(0); cxHover.putImageData(hoverData, 0, 0); hoverId = 0; }

function celebrate() {
  const em = ['🎉','⭐','🎈','✨','🥇'];
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('div');
    s.textContent = em[i % em.length];
    s.style.cssText = `position:fixed;z-index:98;font-size:${18+Math.random()*22}px;left:${Math.random()*96}vw;top:-40px;pointer-events:none;transition:transform ${2.2+Math.random()*1.5}s linear`;
    document.body.appendChild(s);
    requestAnimationFrame(() => { s.style.transform = `translateY(${innerHeight + 80}px) rotate(${Math.random()*360}deg)`; });
    setTimeout(() => s.remove(), 4200);
  }
}

// 💾 сохранение на листе А4 (300 dpi, поля 2 см) в jpg
document.getElementById('bSave').onclick = () => {
  const k = 300 / 25.4;                                   // пикселей на мм
  const AW = Math.round(210 * k), AH = Math.round(297 * k);
  const M = Math.round(20 * k);                           // поле 2 см
  const out = document.createElement('canvas');
  out.width = AW; out.height = AH;
  const cx = out.getContext('2d');
  cx.fillStyle = '#ffffff';
  cx.fillRect(0, 0, AW, AH);
  const s = Math.min((AW - 2 * M) / W, (AH - 2 * M) / H);
  const ox = Math.round((AW - W * s) / 2), oy = Math.round((AH - H * s) / 2);
  cx.imageSmoothingEnabled = true;
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(cvBase, ox, oy, W * s, H * s);
  cx.drawImage(cvFill, ox, oy, W * s, H * s);
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const [id, r] of Object.entries(regions)) {
    if (!r.ex) continue;
    const el = labelEls.get(id);
    const light = el && el.classList.contains('lt');
    cx.fillStyle = light ? '#fff' : '#161616';
    cx.font = `bold ${Math.max(10, Math.round(r.fs * s))}px Verdana, Arial, sans-serif`;
    const x = ox + r.tx * s, y = oy + r.ty * s;
    if (r.ln === 2) {
      const m = r.ex.match(/^(\d+)([+\u2212\u00D7\u00F7])(\d+)$/);
      cx.fillText(m[1] + m[2], x, y - r.fs * s * 0.55);
      cx.fillText(m[3], x, y + r.fs * s * 0.55);
    } else cx.fillText(r.ex, x, y);
  }
  const a = document.createElement('a');
  a.download = DATA.save || 'раскраска-А4.jpg';
  a.href = out.toDataURL('image/jpeg', 0.92);
  a.click();
  showToast('Лист А4 сохранён 💾');
};

// ---------- хранение прогресса ----------
function saveStore() {
  try {
    const f = [];
    const ex = {};
    for (const [id, c] of fillColors) if (c != null) {
      f.push([id, c]);
      if (regions[id] && regions[id].ex) ex[id] = regions[id].ex;
    }
    localStorage.setItem(STORE_KEY, JSON.stringify({ f, e: errorCount, ex }));
  } catch (e) {}
}
let toastTimer = null;
function showToast(t) {
  toast.textContent = t;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}
</script>
