<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жизнь египетского вельможи — урок-тренажёр (§8)</title>
<meta property="og:title" content="Жизнь египетского вельможи — история 5 класс">
<meta property="og:description" content="Интерактивный урок от репетитора Ивановой — открывается прямо в браузере, на телефоне или компьютере.">
<meta property="og:image" content="https://salangha.github.io/uroki/logo.jpg">
<meta property="og:type" content="website">
<style>
:root{
  --bg1:#f7eed8; --bg2:#eedeae;
  --ink:#3a2d1e; --ink2:#7a6a4f;
  --card:#fffdf4; --line:#e2d0a2;
  --gold:#c8901c; --goldsoft:#faf0cf;
  --blue:#1f4e6b; --terracotta:#b3542e;
  --red:#b23a2e; --redsoft:#fdeeea;
  --green:#42713e; --greensoft:#eef5e6;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  font-family:"Segoe UI","Segoe UI Emoji",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:16.5px; line-height:1.45;
}
.frieze{height:12px;background:repeating-linear-gradient(90deg,#c8901c 0 26px,#b3542e 26px 52px,#1f4e6b 52px 78px)}
.wrap{max-width:940px;margin:0 auto;padding:14px 16px 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 12px;flex-wrap:wrap}
.steplabel{font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.bar{height:8px;background:#e6d7ae;border-radius:99px;flex:1;min-width:110px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--terracotta));border-radius:99px;transition:width .3s}
.score{background:var(--card);border:2px solid var(--gold);border-radius:99px;padding:3px 12px;font-weight:700;font-size:14.5px;white-space:nowrap}
.bubble{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:none}
.bubble p{margin:0}
h1{font-size:27px;margin:12px 0 4px;line-height:1.15}
h2{font-size:21px;margin:14px 0 6px}
.sub{color:var(--ink2);margin:0 0 12px}
.intro-img{width:100%;height:210px;object-fit:cover;border-radius:18px;border:2px solid var(--line);display:block}
.rules{background:var(--card);border:2px dashed var(--gold);border-radius:14px;padding:12px 16px;font-size:14.5px;margin:14px 0}
.rules ol{margin:8px 0 0;padding-left:22px}
.rules li{margin:4px 0}
.ex{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0}
.ex-title{font-weight:700;font-size:17px;margin:0 0 6px}
.instr{font-size:14.5px;color:var(--ink2);margin:0 0 10px}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;background:#f6ecd2;border:2px dashed var(--line);border-radius:12px;margin-bottom:12px}
.tray-label{font-size:12.5px;color:var(--ink2);width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #d8c48c;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:600;color:var(--ink);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;text-align:left;font-family:inherit;line-height:1.3}
.chip:active{cursor:grabbing}
.chip.picked{border-color:var(--gold);background:var(--goldsoft);box-shadow:0 0 0 2px var(--gold) inset}
.chip.dragging{opacity:.5}
.chip.wrongflash{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.bin{border:2px solid #c9b26a;border-radius:14px;background:#fdf8e7;min-height:92px;padding:10px}
.bin.over{border-color:var(--gold);background:var(--goldsoft)}
.bin.done{border-color:var(--green);background:var(--greensoft)}
.bin .bin-title{font-weight:700;font-size:15px;margin-bottom:8px}
.bin .bin-inner{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.bin .chip{cursor:default;border-color:var(--green);background:#fff}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.4}
.opt:hover{border-color:var(--gold)}
.opt.good{border-color:var(--green);background:var(--greensoft);cursor:default}
.opt.bad{border-color:var(--red);background:var(--redsoft);cursor:default;opacity:.75}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14.5px;line-height:1.45;display:none}
.fb.show{display:block}
.fb.good{background:var(--greensoft);border:1px solid #bcd3a8;color:#3c5426}
.fb.bad{background:var(--redsoft);border:1px solid #e5b5ac;color:#7c2d1e}
.hintbox{display:none;background:#e8f0f4;border:1px solid #b9d0dc;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14.5px;color:var(--blue)}
.hintbox.show{display:block}
.btnhint{background:#e8f0f4;border:1px solid #b9d0dc;color:var(--blue);border-radius:99px;padding:5px 14px;font-size:13.5px;cursor:pointer;font-weight:600;font-family:inherit}
.order-slots{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.oslot{display:flex;align-items:center;gap:10px;border:2px solid #c9b26a;border-radius:12px;background:#fdf8e7;padding:6px 10px;min-height:52px}
.oslot.over{border-color:var(--gold);background:var(--goldsoft)}
.oslot.done{border-color:var(--green);background:var(--greensoft)}
.oslot .num{font-weight:700;color:var(--terracotta);font-size:17px;width:24px;flex:none}
.oslot .oslot-inner{flex:1;display:flex;flex-wrap:wrap;gap:6px;min-height:36px;align-items:center}
.slot-inline{display:inline-block;min-width:110px;min-height:30px;border:2px dashed var(--gold);border-radius:10px;background:#fdf8e7;vertical-align:middle;text-align:center;padding:2px 6px;margin:0 3px}
.slot-inline.over{background:var(--goldsoft)}
.slot-inline.done{border-style:solid;border-color:var(--green);background:var(--greensoft)}
.checkbtn{background:#e8f0f4;border:2px solid #b9d0dc;color:var(--blue);border-radius:12px;padding:9px 18px;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;font-family:inherit}
.fig{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;margin:12px 0}
.fig img{max-width:100%;max-height:250px;border-radius:8px}
.fig.tall img{max-height:300px}
.fig .cap{font-size:12.5px;color:var(--ink2);margin-top:6px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.btnbig{background:linear-gradient(180deg,#d9a02c,#b9821a);border:none;color:#3a2503;font-weight:700;font-size:17px;padding:12px 28px;border-radius:14px;cursor:pointer;box-shadow:0 3px 8px rgba(120,80,10,.25);font-family:inherit}
.btnbig:hover:not(:disabled){filter:brightness(1.06)}
.btnbig:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btnsec{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 18px;font-size:15px;cursor:pointer;font-weight:600;color:var(--ink);font-family:inherit}
.btnsec:hover{border-color:var(--gold)}
.seasonchip{display:inline-block;background:#e8f0f4;border:1px solid #b9d0dc;color:var(--blue);border-radius:99px;padding:3px 12px;font-size:13.5px;font-weight:600;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:10px 0 4px}
.card{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;font:inherit;color:inherit;transition:transform .15s,border-color .15s,background .15s;box-shadow:0 2px 6px rgba(90,70,20,.08)}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.card .em{font-size:30px;display:block;margin-bottom:6px}
.card b{display:block;margin-bottom:6px;font-size:16px;line-height:1.25}
.card .txt{font-size:14px;color:var(--ink2);line-height:1.45}
.card.sel{border-color:var(--gold);background:var(--goldsoft)}
.card.bad{border-color:var(--red);background:var(--redsoft)}
.tick{position:absolute;top:8px;right:12px;font-size:19px}
.why{margin-top:10px;font-size:13.5px;padding:8px 10px;border-radius:10px;line-height:1.4;text-align:left}
.why.ok{background:#eef5e6;border:1px solid #bcd3a8;color:#3c5426}
.why.bad{background:#fff;border:1px solid #e5b5ac;color:#7c2d1e}
.hint{font-size:13.5px;color:var(--ink2);margin:4px 0 8px}
.rank{display:inline-block;background:linear-gradient(180deg,#fdf3d3,#f7e3b0);border:2px solid var(--gold);border-radius:14px;padding:10px 16px;font-weight:700;font-size:17px;margin:10px 0}
.plan{background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:16px 18px;margin-top:8px}
.plan h2{margin:0 0 4px;font-size:21px}
.plan .seasonline{color:var(--ink2);font-size:14.5px;margin:0 0 10px}
.plan .part h3{margin:14px 0 6px;color:var(--terracotta);font-size:16.5px}
.motif{background:var(--goldsoft);border-radius:12px;padding:10px 12px;margin:8px 0}
.motif .start{font-style:italic;margin-top:3px}
.motif .fact{font-size:13px;color:var(--ink2);margin-top:5px}
.tips{margin-top:14px;font-size:14px;background:#eef5e6;border:1px solid #bcd3a8;padding:10px 14px;border-radius:12px}
.credit{font-size:12px;color:var(--ink2);margin-top:20px;text-align:center;line-height:1.5}
.copyok{color:#3c5426;font-weight:600;font-size:14px;margin-left:10px}
.cardimg{width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:8px;display:block}
@media (max-width:520px){ .bubble .ava{width:38px;height:38px} h1{font-size:23px} }
@media print{
  body *{visibility:hidden}
  #plan-card,#plan-card *{visibility:visible}
  #plan-card{position:absolute;top:0;left:0;width:100%;border:none}
}
</style>

/* shuffled chip order for the sorting exercise (fixed for the whole session) */
var SHUF = {};
function shuffleInit(){
  var keys = Object.keys(DRAG);
  for (var i=0;i<keys.length;i++){
    var ex = DRAG[keys[i]], ids = ex.chips.map(function(c){return c.id;});
    for (var j=ids.length-1;j>0;j--){ var k=Math.floor(Math.random()*(j+1)); var tmp=ids[j]; ids[j]=ids[k]; ids[k]=tmp; }
    SHUF[keys[i]] = ids;
  }
}
function chipById(exId, chipId){
  var arr = DRAG[exId].chips;
  for (var i=0;i<arr.length;i++) if (arr[i].id===chipId) return arr[i];
  return null;
}
function chipInCloze(chipId){
  var arr = CLOZE.c_final.chips;
  for (var i=0;i<arr.length;i++) if (arr[i].id===chipId) return arr[i];
  return null;
}

function ptsFor(){ return S.pts; }
function maxPts(){
  var m = 0;
  for (var k in QUIZ) m += 10;
  for (var d in DRAG) m += DRAG[d].chips.length*10;
  for (var o in ORD) m += ORD[o].order.length*10;
  for (var c in CLOZE) CLOZE[c].chips.forEach(function(ch){ if (ch.why) m += 10; });
  for (var p in S.planSel) m += 20;
  return m;
}
function rankPct(){
  var pct = Math.round(S.pts/maxPts()*100);
  if (pct>=85) return "🌟 Советник фараона — материал усвоен блестяще!";
  if (pct>=70) return "📜 Хранитель печати — очень хорошо!";
  if (pct>=50) return "⚒️ Надзиратель работ — уже неплохо, пройди ещё раз!";
  return "🧒 Юный ученик писца — пройди урок ещё раз, и всё получится!";
}

function go(n){ S.step=n; PICKED=null; FB={}; render(); window.scrollTo(0,0); }
function injectFb(){
  var els = document.querySelectorAll(".fb");
  for (var i=0;i<els.length;i++){
    var d = FB[els[i].id];
    if (d){ els[i].className = "fb show "+d.cls; els[i].textContent = d.text; }
  }
}
function topbar(){
  var total = STEPINFO.length;
  var shown = Math.max(1, Math.min(S.step, total));
  var pct = Math.round(shown/total*100);
  return '<div class="topbar no-print"><span class="steplabel">'+(S.step>total?"Урок пройден":"Шаг "+shown+" из "+total+" · "+STEPINFO[shown-1].em+" "+STEPINFO[shown-1].title)+'</span>'+
    '<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
    '<span class="score" aria-live="polite">⭐ '+S.pts+' из '+maxPts()+'</span></div>';
}
function bubble(text){
  return '<div class="bubble"><img class="ava" src="'+IMG.noble+'" alt=""><p>'+text+'</p></div>';
}
function quizHtml(qid){
  var cfg = QUIZ[qid], done = S.quizAns[qid]!==undefined;
  var h = '<div class="ex"><p class="ex-title">❓ Вопрос</p><p style="margin:0 0 6px">'+cfg.q+'</p>';
  for (var i=0;i<cfg.opts.length;i++){
    var o = cfg.opts[i];
    var cls = "opt";
    var isGood = done && S.quizAns[qid]===i;
    var isBad = S.quizWrong[qid] && S.quizWrong[qid].indexOf(i)>=0;
    if (isGood) cls += " good";
    if (isBad) cls += " bad";
    h += '<button class="'+cls+'" '+(isGood||isBad?"disabled":"")+' onclick="answerQuiz(\''+qid+'\','+i+')">'+["А","Б","В"][i]+") "+o.t+'</button>';
  }
  var fbid = "fb_"+qid;
  h += '<div class="fb" id="'+fbid+'"></div>';
  h += '</div>';
  return h;
}
function answerQuiz(qid, idx){
  var cfg = QUIZ[qid], o = cfg.opts[idx];
  if (o.ok){

var ORDH = {
  start:function(ev, oid, chipId){
    ev.dataTransfer.setData("text/plain", JSON.stringify({oid:oid, chipId:chipId}));
    ev.dataTransfer.effectAllowed="move";
  },
  drop:function(ev, oid, slot){
    ev.preventDefault(); ev.currentTarget.classList.remove("over");
    var data;
    try { data = JSON.parse(ev.dataTransfer.getData("text/plain")); } catch(e){ return; }
    if (data && data.oid===oid) ordPlace(oid, data.chipId, slot);
  },
  tap:function(oid, chipId){
    PICKED = (PICKED===chipId)?null:chipId; render();
  },
  slotTap:function(oid, slot){
    if (!PICKED) return;
    var chipId = PICKED; PICKED=null;
    ordPlace(oid, chipId, slot);
  },
  validate:function(oid){
    var cfg = ORD[oid];
    var lock = S.ordLock[oid] || (S.ordLock[oid]={});
    var placed = S.ordDone[oid] || (S.ordDone[oid]=[]);
    var msgs = [];
    var changed = false;
    for (var i=0;i<cfg.order.length;i++){
      var p = placed.filter(function(x){ return x.slot===i; })[0];
      if (!p) { msgs.push("Шаг "+(i+1)+" ещё не заполнен."); continue; }
      if (p.chip===cfg.order[i]){
        if (lock[i]===undefined){ lock[i]=p.chip; S.pts+=10; changed=true; }
        placed = placed.filter(function(x){ return x!==p; });
      } else {
        msgs.push("Шаг "+(i+1)+" — не на своём месте, вернись и подумай ещё.");
        placed = placed.filter(function(x){ return x!==p; });
        changed = true;
      }
    }
    if (changed || msgs.length) S.ordDone[oid]=placed;
    var allDone = Object.keys(lock).length===cfg.order.length;
    setFb("fb_"+oid, allDone?"good":"bad", allDone ? "✅ Отлично! Порядок приёма восстановлен верно." : ("⚠️ "+msgs.join(" ")));
    render();
  }
};
function ordPlace(oid, chipId, slot){
  var cfg = ORD[oid];
  var lock = S.ordLock[oid] || {};
  if (Object.keys(lock).indexOf(String(slot))>=0) return;
  var placed = S.ordDone[oid] || (S.ordDone[oid]=[]);
  placed = placed.filter(function(p){ return p.chip!==chipId; });
  placed = placed.filter(function(p){ return p.slot!==slot; });
  placed.push({chip:chipId, slot:slot});
  S.ordDone[oid]=placed;
  render();
}

function pickCard(pid, ci){

    }
    var prev = S.step-1;
    h += '<div class="navrow"><button class="btnsec" onclick="go('+prev+')">← Назад</button>'+
      '<button class="btnbig" '+(nextOK?"":"disabled title=\"Сначала выполни задание шага\"")+' onclick="'+nextFn+'">'+nextLabel+'</button></div>';
    app.innerHTML = h; injectFb(); return;
  }
  /* финальный экран */
  h += topbar();
  h += bubble('Урок пройден! Вот твой план сочинения «Приём у фараона». Скопируй его, открой тетрадь — и напиши рассказ от имени вельможи своими словами.');
  h += '<div class="rank">'+rankPct()+' <span style="font-weight:400;font-size:14px">(⭐ '+S.pts+' из '+maxPts()+')</span></div>';
  h += '<div class="plan" id="plan-card"><h2>План сочинения: приём у фараона</h2>'+
    '<p class="seasonline">Рассказ от имени египетского вельможи · что он увидел и какие чувства испытал</p>';
  PARTS_LABELS.forEach(function(lbl){
    h += '<div class="part"><h3>'+lbl.title.toUpperCase()+'</h3>';
    var picks = S.planSel[lbl.id];
    if (!picks.length) h += '<div class="motif">— ничего не выбрано —</div>';
    picks.forEach(function(ci){
      var part = PLAN.parts.filter(function(p){ return p.id===lbl.id; })[0];
      var c = part.cards[ci];
      h += '<div class="motif"><b>'+c.em+" "+c.t+'</b><div class="start">Начни так: «'+c.start+'»</div><div class="fact">Запомни: '+c.why+'</div></div>';
    });
    h += '</div>';
  });
  h += '<div class="tips"><b>Советы по форме:</b> рассказ от первого лица, 10–15 предложений. Опиши, что увидел (дорогу, дворец, фараона, церемонию, дары) и какие чувства испытал (волнение, трепет, радость, гордость). Начни с яркой фразы и закончи чувством или мечтой.</div></div>';
  h += '<div class="navrow no-print">'+
    '<button class="btnsec" onclick="resetAll()">↩ Пройти урок заново</button>'+
    '<span><button class="btnbig" onclick="copyPlan()">📋 Скопировать план</button>'+
    '<button class="btnsec" style="margin-left:8px" onclick="window.print()">🖨 Распечатать</button>'+
    '<span id="copymsg" class="copyok"></span></span></div>';
  h += '<p class="credit no-print">Изображения — Wikimedia Commons: статуя Рамсеса II (Музей Египта, Турин, CC0); «Сад с прудом» из гробницы Небамуна (Британский музей, общ. достояние); банкетная сцена из гробницы Нахта (Метрополитен-музей, CC0); фигурка ушебти (Музей Уолтерса, общ. достояние); сцена кресла-паланкина из гробниц Меира (общ. достояние); стол с яствами из гробницы Менны (общ. достояние); деревянная статуя вельможи Каапера (Египетский музей, Каир; фото CC BY-SA 4.0).</p>';
  app.innerHTML = h; injectFb();
}
function copyPlan(){
  var msg=document.getElementById("copymsg");
  function done(ok){ if (msg) msg.textContent = ok ? "Скопировано ✔" : "Не вышло — выдели и скопируй вручную"; }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(planText()).then(function(){done(true);},function(){fallback();});
  } else fallback();
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=planText(); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
    document.body.removeChild(ta);
    done(ok);
  }
}
function resetAll(){
  S = { step:0, pts:0, quizAns:{}, quizWrong:{}, dragDone:{}, ordDone:{}, ordLock:{}, clozeDone:{}, planSel:{p1:[],p2:[],p3:[]}, planTrap:{p1:[],p2:[],p3:[]} };
  PICKED=null; FB={};
  go(0);
}
/* вставка слов в пропуски (шаг «Вывод») */
function placeCloze(cid, chipId, slotId){
  var cfg = CLOZE[cid];
  var chip = null;
  cfg.chips.forEach(function(c){ if (c.id===chipId) chip=c; });
  var slotCfg = null;
  cfg.parts.forEach(function(p){ if (p.slot===slotId) slotCfg=p; });
  if (!chip || !slotCfg) return;
  var done = S.clozeDone[cid] || (S.clozeDone[cid]={});
  if (slotCfg.slot===chipId){
    done[chipId]=true; S.pts+=10;
    setFb("fb_"+cid, "good", "✅ "+(chip.why||"Верно!"));
  } else {
    setFb("fb_"+cid, "bad", "❌ "+(chip.wwhy || "Не сюда. Подумай ещё!"));
  }
  render();
}
shuffleInit();
render();
</script>
