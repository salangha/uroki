<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ВПР-7 · Литература · Подготовка</title>
<meta property="og:title" content="ВПР-7 · Литература · Подготовка">
<meta property="og:description" content="Интерактивный урок от репетитора Ивановой — открывается прямо в браузере, на телефоне или компьютере.">
<meta property="og:image" content="https://salangha.github.io/uroki/logo.jpg">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#eef2f7; --card:#ffffff; --ink:#1c2733; --muted:#5b6b7b;
    --accent:#2b5cad; --accent-dark:#1e4382;
    --ok:#1e8e4e; --ok-bg:#e2f5ea; --bad:#c63434; --bad-bg:#fbe7e7;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:17px; line-height:1.5;
  }
  .wrap{max-width:640px; margin:0 auto; padding:14px 14px 40px;}
  .card{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:0 2px 10px rgba(30,50,80,.08); margin-top:14px;}
  h1{font-size:22px; margin:8px 0 4px;}
  .subtitle{color:var(--muted); font-size:15px; margin:0 0 6px;}
  .btn{
    display:block; width:100%; border:0; border-radius:12px; cursor:pointer;
    font-size:17px; font-family:inherit; padding:14px 16px; margin-top:12px;
    background:var(--accent); color:#fff; font-weight:600; text-align:center;
    transition:transform .06s, background .15s; touch-action:manipulation;
  }
  .btn:active{transform:scale(.985);}
  .btn.locked{background:#dde5ef; color:#93a1b3;}
  .opt{
    display:block; width:100%; text-align:left; border:2px solid #d5dce6; border-radius:12px;
    background:#fbfcfe; padding:13px 14px; margin-top:10px; cursor:pointer;
    font-size:17px; line-height:1.45; font-family:inherit; color:var(--ink); touch-action:manipulation;
  }
  .opt .letter{
    float:left; margin-right:9px; width:26px; height:26px; border-radius:50%;
    background:#e4eaf3; color:var(--accent-dark); display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:15px;
  }
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--ok); background:var(--ok-bg); font-weight:600;}
  .opt.wrong{border-color:var(--bad); background:var(--bad-bg);}
  .opt.faded{opacity:.55;}
  .topbar{display:flex; align-items:center; gap:10px; margin-top:4px;}
  .topbar .counter{font-weight:700; font-size:15px; color:var(--muted); white-space:nowrap;}
  .topbar .score{margin-left:auto; font-size:15px; color:var(--muted); white-space:nowrap;}
  .bar{height:6px; border-radius:3px; background:#d9e1ec; margin-top:8px; overflow:hidden;}
  .bar > div{height:100%; background:var(--accent); width:0%; transition:width .3s;}
  .question{font-size:18px; line-height:1.55; white-space:pre-line; margin:0;}
  .feedback{border-radius:12px; padding:14px 16px; margin-top:14px; font-size:16px; display:none;}
  .feedback.good{background:var(--ok-bg); border:2px solid var(--ok);}
  .feedback.bad{background:var(--bad-bg); border:2px solid var(--bad);}
  .feedback .verdict{font-weight:700; margin-bottom:6px;}
  .feedback .verdict.good{color:var(--ok);}
  .feedback .verdict.bad{color:var(--bad);}
  .feedback .expl{white-space:pre-line; color:var(--ink);}
  .coming-soon{margin-top:10px; padding-top:8px; border-top:1px dashed rgba(0,0,0,.15); font-size:13.5px; color:#93a1b3; text-align:center;}
  #nextBtn{display:none;}
  .result-stars{font-size:38px; text-align:center; letter-spacing:6px; min-height:46px;}
  .result-big{font-size:44px; font-weight:800; text-align:center; margin:6px 0 2px;}
  .result-sub{text-align:center; color:var(--muted); margin-bottom:8px;}
  .result-grade{font-size:20px; font-weight:800; text-align:center; margin:4px 0 6px;}
  .review-item{border-top:1px solid #e4e9f1; padding:12px 2px 2px; margin-top:12px; font-size:15.5px;}
  .review-item:first-of-type{border-top:0;}
  .review-q{white-space:pre-line;}
  .review-a{margin-top:6px; color:var(--ok); font-weight:700;}
  .hidden{display:none !important;}
  .level-card{position:relative;}
  .level-name{font-weight:700; font-size:17.5px;}
  .level-desc{color:var(--muted); font-size:14.5px; margin-top:4px;}
  .level-count{margin-top:8px; font-size:14px; color:var(--accent-dark); font-weight:600;}
</style>
</head>
<body>
<div class="wrap">

  <!-- СТАРТОВЫЙ ЭКРАН: ВЫБОР УРОВНЯ -->
  <div id="screenStart">
    <div class="card">
      <h1>Подготовка к ВПР · Литература · 7 класс</h1>
      <p class="subtitle" id="statusNote"></p>
      <div id="levelsBox"></div>
    </div>
  </div>

  <!-- ЭКРАН ВОПРОСА -->
  <div id="screenQuiz" class="hidden">
    <div class="topbar">
      <div class="counter" id="counter"></div>
      <div class="score" id="scoreLive"></div>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="card">
      <p class="question" id="qText"></p>
      <div id="options"></div>
      <div class="feedback" id="feedback">
        <div class="verdict" id="verdict"></div>
        <div class="expl" id="explText"></div>
        <div class="coming-soon">🎁 Скоро тут появится кое-что интересное!</div>
      </div>
      <button class="btn" id="nextBtn">Следующий вопрос</button>
    </div>
  </div>

  <!-- ЭКРАН РЕЗУЛЬТАТА -->
  <div id="screenResult" class="hidden">
    <div class="card">
      <div class="result-stars" id="resultStars"></div>
      <div class="result-big" id="resultPoints"></div>
      <div class="result-sub" id="resultPct"></div>
      <div class="result-grade" id="resultGrade"></div>
      <div class="result-sub" id="resultWord"></div>
      <button class="btn" id="againBtn">Пройти ещё раз</button>
      <button class="btn hidden" id="toNextLevelBtn">Перейти к следующему уровню</button>
      <button class="btn secondary hidden" id="homeBtn">К списку уровней</button>
    </div>
    <div class="card hidden" id="reviewCard">
      <h1 style="font-size:18px;">Разбор ошибок</h1>
      <div id="reviewList"></div>
    </div>
  </div>

</div>
<script>
"use strict";
var LEVELS = [{"name": "Уровень 1 · Термины и понятия", "short": "Теория литературы: сюжет, портрет, лирика, драма и др.", "questions": [{"q": "Как называется ряд событий, описанных в художественном произведении?", "a": "сюжет", "alts": ["сюжет"], "expl": "Цепочка основных событий в художественном произведении называется сюжетом."}, {"q": "Как называется цепочка основных событий, раскрывающих становление характеров в череде жизненных противоречий в художественном произведении?", "a": "сюжет", "alts": ["сюжет"], "expl": "Сюжет — цепочка основных событий, раскрывающих становление характеров в череде жизненных противоречий в художественном произведении."}, {"q": "Каким термином обозначается изображение в художественном произведении внешности человека, его лица, его одежды?", "a": "портрет", "alts": ["портрет"], "expl": "Портрет — изображение в художественном произведении внешности человека, его лица, его одежды и т. п."}, {"q": "Как называется авторская трактовка темы: то, что особенно интересует автора, является для него самым существенным вопросом жизни, поэтому этот вопрос и становится предметом изображения и размышления в литературном произведении?", "a": "проблема", "alts": ["проблема"], "expl": "Проблема — авторская трактовка темы: то, что особенно интересует автора, является для него самым существенным вопросом жизни, поэтому этот вопрос и становится предметом изображения и размышления в литературном произведении."}, {"q": "Как называется прозаический жанр, занимающий по объёму текста промежуточное место между романом и рассказом, характеризующийся хроникальным сюжетом, воспроизводящим естественное течение жизни?", "a": "повесть", "alts": ["повесть"], "expl": "Повесть — прозаический жанр, занимающий по объёму текста промежуточное место между романом и рассказом, характеризующийся хроникальным сюжетом, воспроизводящим естественное течение жизни."}, {"q": "Как называется произведение большой эпической формы, охватывающее широкий круг явлений частной и общественной жизни, изображающее в процессе развития многочисленные человеческие характеры в их противоречивых взаимоотношениях?", "a": "роман", "alts": ["роман"], "expl": "Роман — произведение большой эпической формы, охватывающее широкий круг явлений частной и общественной жизни, изображающее в процессе развития многочисленные человеческие характеры в их противоречивых взаимоотношениях."}, {"q": "Как называется жизненный материал, составляющий основу произведения или его тематику?", "a": "тема", "alts": ["тема"], "expl": "Тема — жизненный материал, составляющий основу произведения или его тематику."}, {"q": "Каким термином обозначается описание природы в художественном произведении?", "a": "пейзаж", "alts": ["пейзаж"], "expl": "Пейзаж — описание природы в художественном произведении."}, {"q": "Каким термином обозначается род литературы, в котором действительность отражается путем передачи глубоких, задушевных мыслей и чувств автора?", "a": "лирика", "alts": ["лирика"], "expl": "Лирика — это род литературы, в котором действительность отражается путем передачи глубоких, задушевных мыслей и чувств автора. То, что, как правило, в рифму, стихотворные тексты неглобального, несюжетного характера."}, {"q": "Как называется литературный род, в котором объектом изображения могут быть любые явления внешнего мира (люди, события, предметы) в их сложных отношениях и взаимосвязях, а также внутренний мир людей; основа произведений этого литературного рода — повествование, в принципе не имеющее ограничений во времени и пространстве?", "a": "эпос", "alts": ["эпос", "эпический"], "expl": "Эпос — литературный род, в котором объектом изображения могут быть любые явления внешнего мира (люди, события, предметы) в их сложных отношениях и взаимосвязях, а также внутренний мир людей. Основа эпоса — повествование, в принципе не имеющее ограничений во времени и пространстве. Возможности изображения предметного мира, психологии людей, идей и настроений самих писателей тоже практически безграничны."}, {"q": "— Я в жизни ничего подобного не слыхала, — говорила Рыжуха. — Из этих песен я узнала, что были времена, когда нас, лошадей, называли кормилицами, холили и ласкали, украшали лентами. И когда я слушала эти песни, я забывала про жару, про оводов, про удары ременки, которой то и дело лупил нас злой мужик. И мне легче, ей-богу, легче было тащить тяжелую косилку. Я спрашивала Забаву — так звали старую кобылу, — не утешает ли она меня. Не сама ли она придумала все эти красивые песни про лошадиное беспечальное житье? Но она меня уверяла, что все это сущая правда и что песни эти певала ей еще мать. Певала, когда она была сосунком. А мать их слышала от своей матери. И так эти песни про счастливые лошадиные времена из поколения в поколение передавались в ихнем роду. — И вот, — заключила свой рассказ Рыжуха, — сегодня утром, как только нас вывели на луг, я начала петь песни старой кобылы своим товаркам и товарищам, а они закричали в один голос: «Вранье все это, брехня! Замолчи! Не растравляй нам: душу. И так тошно». Рыжуха с надеждой, с мольбой подняла ко мне свои огромные, все еще мокрые, печальные глаза, в фиолетовой глубине которых я вдруг увидел себя — маленького, крохотного человечка. — Скажите мне... Вы человек, вы все знаете, вы из тех, кто всю жизнь командует нами... Скажите, были такие времена, когда нам, лошадям, жилось хорошо? Не соврала мне старая кобыла? Не обманула? Я не выдержал прямого, вопрошающего взгляда Рыжухи. Я отвел глаза в сторону и тут мне показалось, что отовсюду, со всех сторон, на меня смотрят большие и пытливые лошадиные глаза. Неужели то, о чем спрашивала меня Рыжуха, занимало и других лошадей? Во всяком случае, обычного хруста, который всегда слышится на лугу, не было. Не знаю, сколько продолжалась для меня эта молчаливая пытка на зеленой луговине под горой, — может, минуту, может, десять минут, может, час, но я взмок с головы до ног. Все, все правильно говорила старая кобыла, ничего не соврала. Были, были такие времена, и были еще недавно, на моей памяти, когда лошадью дышали и жили, когда ей скармливали самый лакомый кусок, а то и последнюю краюху хлеба — мы-то как-нибудь выдюжим, мы-то и с голодным брюхом промаемся до утра. Нам не привыкать.  \n\n( Ф. Абрамов «О чём плачут лошади» ) Как называется трехсложная стопа, в которой ударение падает на первый из трех слогов?", "a": "дактиль", "alts": ["дактиль"], "expl": "Дактиль (от греческого — палец) — трехсложная стопа, в которой ударение падает на первый из трех слогов."}, {"q": "Как называется род литературы, в котором действительность отражается путем передачи глубоких, задушевных мыслей и чувств автора?", "a": "лирика", "alts": ["лирика"], "expl": "Лирика — род литературы, в котором действительность отражается путем передачи глубоких, задушевных мыслей и чувств автора."}, {"q": "Как называется литературный род, в котором объектом изображения могут быть любые явления внешнего мира (люди, события, предметы) в их сложных отношениях и взаимосвязях, а также внутренний мир людей? Основа этого литературного рода — повествование, в принципе не имеющее ограничений во времени и пространстве.", "a": "эпос", "alts": ["эпос", "эпический"], "expl": "Эпос — литературный род, в котором объектом изображения могут быть любые явления внешнего мира (люди, события, предметы) в их сложных отношениях и взаимосвязях, а также внутренний мир людей. Основа этого литературного рода — повествование, в принципе не имеющее ограничений во времени и пространстве. Возможности изображения предметного мира, психологии людей, идей и настроений самих писателей тоже практически безграничны. Основные эпические жанры: роман, повесть, рассказ, новелла, поэма."}, {"q": "Как называется род литературы, объединяющий произведения для постановки на сцене?", "a": "драма", "alts": ["драма"], "expl": "Драма — род литературы, объединяющий произведения для постановки на сцене."}, {"q": "Как называется то, для чего написано произведение, главная мысль в раскрытии темы?", "a": "идея", "alts": ["идея"], "expl": "Идея — то, для чего написано произведение, главная мысль в раскрытии темы."}, {"q": "Как называется художественное направление, которое характеризуется неудовлетворенностью настоящим, современной действительностью, противопоставлением реального мира миру идеальному?", "a": "романтизм", "alts": ["романтизм"], "expl": "Романтизм — художественное направление, которое характеризуется неудовлетворенностью настоящим, современной действительностью. Для романтизма свойственно противопоставление реального мира миру идеальному. Герой романтического произведения — бунтарь-одиночка."}, {"q": "Как называется описание внутренней обстановки помещения в литературном произведении?", "a": "интерьер", "alts": ["интерьер"], "expl": "Интерьер — описание внутренней обстановки помещения в литературном произведении."}, {"q": "Как называется изречение, расположенное перед текстом литературного произведения и поясняющее авторский замысел или идею?", "a": "эпиграф", "alts": ["эпиграф"], "expl": "Эпиграф — изречение, расположенное перед текстом литературного произведения и поясняющее авторский замысел или идею."}, {"q": "Как называется жанр поэтического или прозаического произведения, в котором автор беспощадно, уничтожающе высмеивает, критикует действительность, человека, явления?", "a": "сатира", "alts": ["сатира"], "expl": "Сатира — жанр поэтического или прозаического произведения, в котором автор беспощадно, уничтожающе высмеивает, критикует действительность, человека, явления."}, {"q": "Как называется один из видов лиро-эпических произведений, для которого характерны сюжетность, событийность и выражение автором или лирическим героем своих чувств?", "a": "поэма", "alts": ["поэма"], "expl": "Поэма — один из видов лиро-эпических произведений, для которого характерны сюжетность, событийность и выражение автором или лирическим героем своих чувств."}, {"q": "Как называется трёхсложный стихотворный размер с ударением на первом слоге?", "a": "дактиль", "alts": ["дактиль"], "expl": "Дактиль (от греческого — «палец») — трехсложная стопа, в которой ударение падает на первый из трех слогов."}, {"q": "Как называется пафос литературного произведения, отражающий восхищение подвигами и заслугами героя (героев)?", "a": "героический пафос", "alts": ["героический пафос", "героический"], "expl": "Пафос — это эмоциональный настрой произведения. Когда произведение восхищается подвигами и героями, такой настрой называют героическим пафосом."}, {"q": "Определите жанр произведения А. С. Пушкина «Полтава».", "a": "поэма", "alts": ["поэма"], "expl": "«Полтава» — это поэма. Поэма — крупное или среднее по объёму литературное произведение, в котором повествование (эпический сюжет) соединяется с чувствами и переживаниями автора или рассказчика (лирическим началом)."}, {"q": "Каким термином обозначается основной эмоциональный настрой произведения?", "a": "пафос", "alts": ["пафос"], "expl": "Пафос — основной эмоциональный настрой произведения."}, {"q": "Каким термином обозначается крупное стихотворное произведение, в котором сочетаются признаки эпоса и лирики?", "a": "поэма", "alts": ["поэма"], "expl": "Поэма — крупное или среднее по объёму литературное произведение, в котором повествование (эпический сюжет) соединяется с чувствами и переживаниями автора или рассказчика (лирическим началом)."}, {"q": "Назовите термин, которым обозначают ведущий эмоциональный тон, настроение произведения, а также чувства, которые автор стремится вызвать у читателя.", "a": "пафос", "alts": ["пафос"], "expl": "Пафос — ведущий эмоциональный тон, настроение произведения, а также чувства, которые автор стремится вызвать у читателя."}, {"q": "Как называется образ героя стихотворения, чьи чувства, эмоции, переживания, мысли описываются в тексте?", "a": "лирический герой", "alts": ["лирический герой", "лирический"], "expl": "Такой герой называется лирическим."}, {"q": "Каким термином обозначается короткий текст, размещённый перед художественным произведением и указывающий на его главную идею?", "a": "эпиграф", "alts": ["эпиграф"], "expl": "Эпиграф — короткий текст, размещённый перед художественным произведением и указывающий на его главную идею."}, {"q": "Определите жанр произведения М. Ю. Лермонтова «Когда волнуется желтеющая нива...».", "a": "стихотворение", "alts": ["стихотворение"], "expl": "Стихотворение — написанное стихами произведение, сравнительно небольшого размера."}, {"q": "Каким термином обозначается острое осмеяние пороков в литературном произведении?", "a": "сатира", "alts": ["сатира"], "expl": "Сатира — острое осмеяние пороков в литературном произведении."}]}, {"name": "Уровень 2 · Сюжет, жанры, стихотворные размеры", "short": "Завязка, кульминация, развязка, композиция, ямб, хорей и др.", "questions": [{"q": "Каким термином обозначается изображение внешности героя в литературном произведении?", "a": "портрет", "alts": ["портрет"], "expl": "Портрет — это изображение внешности в литературном произведении."}, {"q": "Как называется созвучие окончаний в словах?", "a": "рифма", "alts": ["рифма"], "expl": "Рифма — созвучие окончаний в словах."}, {"q": "Как называется структура художественного произведения, его построение?", "a": "композиция", "alts": ["композиция"], "expl": "Композиция — это взаимная соотнесённость и расположение единиц изображаемого и художественно-речевых средств в словесно-художественном произведении. Структура, план выражения литературного произведения; построение художественного произведения."}, {"q": "Как называется двусложная стопа, в которой ударение падает первый слог?", "a": "хорей", "alts": ["хорей"], "expl": "Хорей — двусложная стопа, в которой ударение падает первый слог."}, {"q": "Как называется двусложная стопа, в которой ударение падает второй слог?", "a": "ямб", "alts": ["ямб"], "expl": "Ямб — двусложная стопа, в которой ударение падает на второй слог."}, {"q": "Как называются события, с которых завязывается конфликт в художественном произведении?", "a": "завязка", "alts": ["завязка"], "expl": "Завязка — события, с которых завязывается конфликт в художественном произведении."}, {"q": "Как называется одно из средств создания художественного образа, которое помогает представить изображаемую автором картину, предмет или характер в неповторимой индивидуальности?", "a": "художественная деталь", "alts": ["художественная деталь", "деталь"], "expl": "Художественная деталь — одно из средств создания художественного образа, которое помогает представить изображаемую автором картину, предмет или характер в неповторимой индивидуальности."}, {"q": "Как называется высшая точка напряжения, столкновение противоборствующих сил, пик эмоционального накала конфликта в художественном произведении?", "a": "кульминация", "alts": ["кульминация"], "expl": "Кульминация — называется высшая точка напряжения, столкновение противоборствующих сил, пик эмоционального накала конфликта в художественном произведении."}, {"q": "Как называется изображение в художественном произведении внешности человека, его лица, его одежды?", "a": "портрет", "alts": ["портрет"], "expl": "Портрет — изображение в художественном произведении внешности человека, его лица, его одежды."}, {"q": "— Я в жизни ничего подобного не слыхала, — говорила Рыжуха. — Из этих песен я узнала, что были времена, когда нас, лошадей, называли кормилицами, холили и ласкали, украшали лентами. И когда я слушала эти песни, я забывала про жару, про оводов, про удары ременки, которой то и дело лупил нас злой мужик. И мне легче, ей-богу, легче было тащить тяжелую косилку. Я спрашивала Забаву — так звали старую кобылу, — не утешает ли она меня. Не сама ли она придумала все эти красивые песни про лошадиное беспечальное житье? Но она меня уверяла, что все это сущая правда и что песни эти певала ей еще мать. Певала, когда она была сосунком. А мать их слышала от своей матери. И так эти песни про счастливые лошадиные времена из поколения в поколение передавались в ихнем роду. — И вот, — заключила свой рассказ Рыжуха, — сегодня утром, как только нас вывели на луг, я начала петь песни старой кобылы своим товаркам и товарищам, а они закричали в один голос: «Вранье все это, брехня! Замолчи! Не растравляй нам: душу. И так тошно». Рыжуха с надеждой, с мольбой подняла ко мне свои огромные, все еще мокрые, печальные глаза, в фиолетовой глубине которых я вдруг увидел себя — маленького, крохотного человечка. — Скажите мне... Вы человек, вы все знаете, вы из тех, кто всю жизнь командует нами... Скажите, были такие времена, когда нам, лошадям, жилось хорошо? Не соврала мне старая кобыла? Не обманула? Я не выдержал прямого, вопрошающего взгляда Рыжухи. Я отвел глаза в сторону и тут мне показалось, что отовсюду, со всех сторон, на меня смотрят большие и пытливые лошадиные глаза. Неужели то, о чем спрашивала меня Рыжуха, занимало и других лошадей? Во всяком случае, обычного хруста, который всегда слышится на лугу, не было. Не знаю, сколько продолжалась для меня эта молчаливая пытка на зеленой луговине под горой, — может, минуту, может, десять минут, может, час, но я взмок с головы до ног. Все, все правильно говорила старая кобыла, ничего не соврала. Были, были такие времена, и были еще недавно, на моей памяти, когда лошадью дышали и жили, когда ей скармливали самый лакомый кусок, а то и последнюю краюху хлеба — мы-то как-нибудь выдюжим, мы-то и с голодным брюхом промаемся до утра. Нам не привыкать.  \n\n( Ф. Абрамов «О чём плачут лошади» ) Как называется описание природы в художественном произведении?", "a": "пейзаж", "alts": ["пейзаж"], "expl": "Пейзаж — описание природы в художественном произведении."}, {"q": "Как называется трехсложная стопа, в которой ударение падает на второй слог — ударный между двумя безударными?", "a": "амфибрахий", "alts": ["амфибрахий"], "expl": "Амфибрахий (от греческого — с двух сторон) — трехсложная стопа, в которой ударение падает на второй слог — ударный между двумя безударными."}, {"q": "Как называется исходное событие, в котором обрисовывается мир, представляются герои, намечается конфликт?", "a": "экспозиция", "alts": ["экспозиция"], "expl": "Экспозиция — исходное событие, в котором обрисовывается мир, представляются герои, намечается конфликт."}, {"q": "Как называется итог кульминации в развитии действия?", "a": "развязка", "alts": ["развязка"], "expl": "Развязка — итог кульминации в развитии действия."}, {"q": "Как называются события, с которых завязывается конфликт?", "a": "завязка", "alts": ["завязка"], "expl": "Завязка — события, с которых завязывается конфликт."}, {"q": "Каким термином обозначается трёхсложный стихотворный размер с ударением на последнем слоге?", "a": "анапест", "alts": ["анапест"], "expl": "Анапест — термин, которым обозначается трёхсложный стихотворный размер с ударением на последнем слоге."}, {"q": "Каким термином обозначается трёхсложный стихотворный размер с ударением на первом слоге?", "a": "дактиль", "alts": ["дактиль"], "expl": "Дактиль — термин, обозначающий трёхсложный стихотворный размер с ударением на первом слоге."}, {"q": "Каким термином обозначается трёхсложный размер стиха с ударением на втором слоге?", "a": "амфибрахий", "alts": ["амфибрахий"], "expl": "Амфибрахий — термин, которым обозначается трёхсложный размер стиха с ударением на втором слоге."}, {"q": "Каким термином обозначается главная мысль, выраженная в художественном произведении?", "a": "идея", "alts": ["идея"], "expl": "Идея — термин, которым обозначается главная мысль, выраженная в художественном произведении."}, {"q": "Как называется описание природы в литературном произведении?", "a": "пейзаж", "alts": ["пейзаж"], "expl": "Пейзаж — описание природы в литературном произведении."}, {"q": "Каким термином обозначается внутренняя обстановка квартиры или дома, которая изображается в художественном тексте?", "a": "интерьер", "alts": ["интерьер"], "expl": "Интерьер — внутренняя обстановка квартиры или дома, которая изображается в художественном тексте."}, {"q": "Каким термином обозначается последовательность расположения частей художественного произведения?", "a": "композиц я результатом развития действия и в котором происходит разрешение конфликта?", "a": "развязка", "alts": ["развязка"], "expl": "Развязка — итог кульминации."}, {"q": "Определите жанр произведения М. Е. Салтыкова-Щедрина «Дикий помещик».", "a": "сказка", "alts": ["сказка"], "expl": "Сказка — это жанр устного народного творчества (фольклора) или авторской литературы, в основе которого всегда лежит нескрываемый вымысел, волшебство или необычные бытовые приключения."}]}];
var PASS_RATIO = 0.75;
var UNLOCK_KEY = "vpr7unlocked";

/* Краткие определения — для разбора ошибки (включая термины уровня 2) */
var DEFINITIONS = {
  "сюжет": "цепочка основных событий произведения",
  "портрет": "изображение внешности героя: лица, одежды, фигуры",
  "проблема": "главный вопрос, который волнует автора и который он исследует в произведении",
  "повесть": "прозаическое произведение среднего объёма — крупнее рассказа, но меньше романа",
  "роман": "большое эпическое произведение со многими героями и развитым сюжетом",
  "тема": "то, о чём пишет автор; жизненный материал произведения",
  "пейзаж": "описание природы в художественном произведении",
  "лирика": "род литературы, передающий чувства и переживания автора (стихотворения)",
  "эпос": "род литературы — повествование о событиях, людях и вещах",
  "дактиль": "трёхсложный стихотворный размер с ударением на первом слоге",
  "драма": "род литературы, произведения которого предназначены для постановки на сцене",
  "идея": "главная мысль произведения, то, для чего оно написано",
  "романтизм": "литературное направление, в котором реальному миру противопоставляется мир идеальный",
  "интерьер": "описание внутренней обстановки помещения",
  "эпиграф": "короткое изречение перед текстом, поясняющее замысел произведения",
  "сатира": "жанр, беспощадно высмеивающий пороки и недостатки",
  "поэма": "крупное стихотворное произведение с сюжетом — сочетает признаки эпоса и лирики",
  "героический": "пафос, выражающий восхищение подвигами и заслугами героев",
  "героический пафос": "эмоциональный настрой произведения, восхваляющий подвиги героев",
  "пафос": "основной эмоциональный настрой произведения",
  "лирический герой": "герой стихотворения, чьи чувства, мысли и переживания описаны в тексте",
  "стихотворение": "небольшое произведение, написанное стихами",
  "рифма": "созвучие окончаний стихотворных строк",
  "хорей": "двусложный стихотворный размер с ударением на первом слоге",
  "ямб": "двусложный стихотворный размер с ударением на втором слоге",
  "анапест": "трёхсложный стихотворный размер с ударением на третьем слоге",
  "амфибрахий": "трёхсложный стихотворный размер с ударением на втором слоге",
  "завязка": "события, с которых начинается конфликт в произведении",
  "кульминация": "высшая точка напряжения в развитии конфликта",
  "развязка": "завершение конфликта, итог сюжета произведения",
  "экспозиция": "знакомство с героями и обстановкой до начала действия",
  "композиция": "структура художественного произведения, его построение",
  "художественная деталь": "мелкая подробность, помогающая ярко представить образ или картину",
  "сказка": "фольклорный жанр с вымышленными, чудесными событиями",
  "рассказ": "короткое прозаическое произведение об одном событии"
};

function el(id){ return document.getElementById(id); }
function isUnlocked(){ try { return localStorage.getItem(UNLOCK_KEY) === "1"; } catch(e){ return false; } }
function unlockNext(){ try { localStorage.setItem(UNLOCK_KEY, "1"); } catch(e){} }

function shuffle(arr){
  for (var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function forbidden(answer){
  var low = answer.toLowerCase();
  var bad = [low];
  [["эпос","эпический"],["лирический герой","лирический"],["пафос","героический","героический пафос"],
   ["деталь","художественная деталь"]].forEach(function(g){
    if (g.indexOf(low) !== -1) g.forEach(function(w){ bad.push(w.toLowerCase()); });
  });
  return bad;
}
/* Пул всех ответов всех уровней — дистракторы родные и разнообразные */
var POOL = [];
LEVELS.forEach(function(lv){
  lv.questions.forEach(function(q){ if (POOL.indexOf(q.a) === -1) POOL.push(q.a); });
});
function buildOptions(q){
  var bad = forbidden(q.a);
  var cand = shuffle(POOL.slice().filter(function(w){ return bad.indexOf(w.toLowerCase()) === -1; }));
  return shuffle([q.a].concat(cand.slice(0, 3)));
}

var levelIdx = 0, round = [], cur = 0, points = 0, mistakes = [];
var maxPoints = 0, passScore = 0;

function show(screen){
  ["screenStart","screenQuiz","screenResult"].forEach(function(s){
    el(s).classList.toggle("hidden", s !== screen);
  });
}

function renderStart(){
  var totalQ = 0;
  LEVELS.forEach(function(lv){ totalQ += lv.questions.length; });
  el("statusNote").textContent = "Ты начинаешь подготовку к ВПР по литературе за 7 класс. " +
    "Приложение дорабатывается: на сегодня готово к использованию " + LEVELS.length +
    " уровней, " + totalQ + " заданий.";
  var box = el("levelsBox");
  box.innerHTML = "";
  LEVELS.forEach(function(lv, i){
    var card = document.createElement("div");
    card.className = "card level-card";
    var unlocked = (i === 0) || isUnlocked();
    var name = document.createElement("div");
    name.className = "level-name";
    name.textContent = lv.name;
    var desc = document.createElement("div");
    desc.className = "level-desc";
    desc.textContent = lv.short;
    var count = document.createElement("div");
    count.className = "level-count";
    count.textContent = unlocked
      ? "Заданий: " + lv.questions.length + " · для перехода дальше нужно 75% баллов"
      : "🔒 Откроется, когда на предыдущем уровне набрано 75% баллов";
    var btn = document.createElement("button");
    btn.className = "btn" + (unlocked ? "" : " locked");
    btn.textContent = unlocked ? "Начать: уровень " + (i + 1) : "Заблокировано";
    btn.disabled = !unlocked;
    if (unlocked) btn.addEventListener("click", function(){ startLevel(i); });
    card.appendChild(name); card.appendChild(desc); card.appendChild(count); card.appendChild(btn);
    box.appendChild(card);
  });
}

function startLevel(i){
  levelIdx = i;
  var lv = LEVELS[i];
  round = shuffle(lv.questions.slice()).map(function(q){ return {q: q, options: buildOptions(q)}; });
  cur = 0; points = 0; mistakes = [];
  maxPoints = round.length * 10;
  passScore = Math.round(maxPoints * PASS_RATIO);
  show("screenQuiz");
  renderQuestion();
}

function renderQuestion(){
  var item = round[cur];
  el("counter").textContent = "Вопрос " + (cur + 1) + " из " + round.length;
  el("scoreLive").textContent = "⭐ " + points;
  el("barFill").style.width = (100 * cur / round.length) + "%";
  el("qText").textContent = item.q.q;
  el("feedback").style.display = "none";
  el("nextBtn").style.display = "none";
  el("nextBtn").textContent = (cur === round.length - 1) ? "Показать результат" : "Следующий вопрос";

  var box = el("options");
  box.innerHTML = "";
  var letters = ["А","Б","В","Г"];
  item.options.forEach(function(opt, idx){
    var b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="letter"></span><span class="text"></span>';
    b.querySelector(".letter").textContent = letters[idx];
    b.querySelector(".text").textContent = opt;
    b.addEventListener("click", function(){ answer(opt, b); });
    box.appendChild(b);
  });
}

function answer(chosen, btn){
  var q = round[cur].q;
  var buttons = el("options").querySelectorAll(".opt");
  for (var i = 0; i < buttons.length; i++){
    buttons[i].disabled = true;
    var text = buttons[i].querySelector(".text").textContent;
    if (q.alts.indexOf(text) !== -1) buttons[i].classList.add("correct");
    else if (text !== chosen) buttons[i].classList.add("faded");
  }
  var isCorrect = q.alts.indexOf(chosen) !== -1;
  var fb = el("feedback"), verdict = el("verdict");
  fb.style.display = "block";
  if (isCorrect){
    points += 10;
    fb.className = "feedback good";
    verdict.className = "verdict good";
    verdict.textContent = "Верно! +10 баллов";
    el("explText").textContent = q.expl;
  } else {
    btn.classList.add("wrong");
    btn.classList.remove("faded");
    fb.className = "feedback bad";
    verdict.className = "verdict bad";
    verdict.textContent = "Неверно. Правильный ответ: " + q.a;
    var wrongDef = DEFINITIONS[chosen.toLowerCase()] || "";
    var rightDef = DEFINITIONS[q.a.toLowerCase()] || "";
    var msg = "Ты выбрал «" + chosen + "»";
    if (wrongDef) msg += ", но это означает: " + wrongDef;
    msg += ". Правильный ответ — «" + q.a + "».";
    if (rightDef) msg += " Отличие в том, что " + q.a + " — это " + rightDef + ".";
    el("explText").textContent = msg;
    mistakes.push({q: q.q, a: q.a, chosen: chosen});
  }
  el("scoreLive").textContent = "⭐ " + points;
  el("nextBtn").style.display = "block";
}

function next(){
  cur++;
  if (cur < round.length){ renderQuestion(); }
  else { showResult(); }
}

function showResult(){
  show("screenResult");
  var n = round.length;
  var pct = Math.round(100 * points / maxPoints);
  el("resultStars").textContent = pct >= 90 ? "⭐⭐⭐" : (pct >= 70 ? "⭐⭐" : (pct >= 50 ? "⭐" : ""));
  el("resultPoints").textContent = points + " баллов";
  el("resultPct").textContent = "Верно " + (points / 10) + " из " + n + " (" + pct + "%)";
  var grade = pct >= 90 ? 5 : (pct >= 70 ? 4 : (pct >= 50 ? 3 : 2));
  el("resultGrade").textContent = "Оценка: " + grade;

  var passedLevel = points >= passScore;
  var hasNext = levelIdx + 1 < LEVELS.length;
  var toNext = el("toNextLevelBtn");
  var home = el("homeBtn");
  var word;
  if (passedLevel){
    if (hasNext) unlockNext();
    if (!hasNext){
      word = "Это пока последний готовый уровень — следующие дорабатываются. Отличная работа!";
      toNext.classList.add("hidden");
    } else {
      word = "Уровень пройден! Следующий уровень открыт — переходи и продолжай.";
      toNext.classList.remove("hidden");
      toNext.textContent = "Перейти к уровню " + (levelIdx + 2);
    }
  } else {
    word = "Для перехода дальше нужно " + passScore + " баллов (" + Math.round(PASS_RATIO * 100) +
      "%). Пройди ещё раз — вопросы и варианты будут другими.";
    toNext.classList.add("hidden");
  }
  home.classList.remove("hidden");
  el("resultWord").textContent = word;

  var rc = el("reviewCard"), list = el("reviewList");
  if (!mistakes.length){ rc.classList.add("hidden"); }
  else {
    rc.classList.remove("hidden");
    list.innerHTML = "";
    mistakes.forEach(function(m){
      var div = document.createElement("div");
      div.className = "review-item";
      var qq = document.createElement("div");
      qq.className = "review-q";
      var qShort = m.q.length > 220 ? m.q.slice(0, 220) + "…" : m.q;
      qq.textContent = qShort;
      var aa = document.createElement("div");
      aa.className = "review-a";
      aa.textContent = "Правильный ответ: " + m.a + (m.chosen ? "  (у вас: " + m.chosen + ")" : "");
      div.appendChild(qq); div.appendChild(aa);
      list.appendChild(div);
    });
  }
}

el("nextBtn").addEventListener("click", function(){ cur++; if (cur < round.length) renderQuestion(); else showResult(); });
el("againBtn").addEventListener("click", function(){ startLevel(levelIdx); });
el("toNextLevelBtn").addEventListener("click", function(){ startLevel(levelIdx + 1); });
el("homeBtn").addEventListener("click", function(){ renderStart(); show("screenStart"); });

renderStart();
</script>
