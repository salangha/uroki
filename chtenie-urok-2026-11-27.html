function el(id){return document.getElementById(id);}

var stars=0;
try{stars=parseInt(localStorage.getItem('misarStars')||'0',10)||0;}catch(e){}
function drawStars(){el('starCount').textContent=stars;}

el('addStar').onclick=function(){stars++;saveStars();};
el('resetStars').onclick=function(){stars=0;saveStars();};
drawStars();

var curTab='t1';
var tabBtns=document.querySelectorAll('#tabs button');
for(var tb=0;tb<tabBtns.length;tb++){
  (function(b){b.onclick=function(){showTab(b.getAttribute('data-tab'));};})(tabBtns[tb]);
}
function showTab(id){
  curTab=id;
  for(var k=0;k<tabBtns.length;k++){
    tabBtns[k].className=(tabBtns[k].getAttribute('data-tab')===id)?'active':'';
  }
  var secs=document.querySelectorAll('main>section');

}

var seq2=[],ti2=0,rev2=false;
function buildSeq2(){
  seq2=[];
  var ts=shuffle(TRIPLETS);
  for(var i=0;i<ts.length;i++){seq2=seq2.concat(ts[i]);}
}
function showWord2(){
  rev2=false;
  var c=seq2[ti2];
  el('wBig').textContent=c.w;
  el('wBig').className=c.t?'word target':'word';
  el('wBadge').textContent=c.t?'новое слово ⭐':'';
  el('wPic').textContent='';
  el('wNext').textContent='Показать картинку 🖼';
  el('wCnt').textContent=(ti2+1)+' / '+seq2.length;
}
el('wNext').onclick=function(){
  if(!rev2){
    rev2=true;
    var c=seq2[ti2];
    var b64=IMGS[c.w];
    if(b64){el('wPic').innerHTML='<img alt="">';el('wPic').firstChild.src=b64;}
    else if(c.e){el('wPic').innerHTML='<span>'+c.e+'</span>';}
    else{el('wPic').textContent='';}
    el('wNext').textContent='Дальше →';
  }else{
    ti2++;if(ti2>=seq2.length){ti2=0;buildSeq2();}
    showWord2();
  }
};
el('wBack').onclick=function(){if(ti2>0){ti2--;showWord2();}};

  var syl=b5[i5];
  var remaining=order5.filter(function(k){return placed5.indexOf(k)<0;});
  var tEl=el('sTiles');
  tEl.innerHTML='';
  for(var i=0;i<remaining.length;i++){
    (function(k){
      var d=document.createElement('div');
      d.className='tile';
      d.style.background=SLOT_COLORS[k];
      d.style.borderColor=SLOT_COLORS[k];
      d.style.color='#fff';
      d.style.textShadow='0 1px 2px rgba(0,0,0,.35)';
      d.textContent=syl[k];
      d.onclick=function(){if(placed5.length<syl.length){placed5.push(k);render5();}};
      tEl.appendChild(d);
    })(remaining[i]);

  slEl.innerHTML='';
